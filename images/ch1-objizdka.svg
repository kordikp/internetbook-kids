<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Překopnutý kabel? Zpráva si najde objížďku</text>

  <defs>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <!-- přímá cesta: přerušený kabel -->
  <g stroke="#6B7280" stroke-width="2" opacity="0.5">
    <line x1="200" y1="252" x2="380" y2="252"/>
    <line x1="420" y1="252" x2="600" y2="252"/>
  </g>
  <g stroke="#EF4444" stroke-width="3.5" stroke-linecap="round">
    <line x1="390" y1="242" x2="410" y2="262"/>
    <line x1="410" y1="242" x2="390" y2="262"/>
  </g>
  <text x="400" y="287" text-anchor="middle" font-size="11" fill="#EF4444">překopnutý kabel</text>

  <!-- objížďka přes další router -->
  <text x="400" y="66" text-anchor="middle" font-size="12.5" fill="#1E1B4B">objížďka přes další router</text>
  <path d="M 612 240 C 578 152 492 116 400 116 C 308 116 222 152 188 240" fill="none" stroke="#0EA5E9" stroke-width="2.5" marker-end="url(#arrb)"/>
  <rect x="377" y="95" width="46" height="46" rx="9" transform="rotate(45 400 118)" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <text x="400" y="122" text-anchor="middle" font-size="11" fill="#1E1B4B">router</text>

  <!-- uzly Praha a Brno (modrá = síť) -->
  <g fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2">
    <circle cx="185" cy="252" r="11"/>
    <circle cx="615" cy="252" r="11"/>
  </g>
  <circle cx="185" cy="252" r="3" fill="#0EA5E9"/>
  <circle cx="615" cy="252" r="3" fill="#0EA5E9"/>
  <g text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">
    <text x="185" y="290">Praha</text>
    <text x="615" y="290">Brno</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="185" y="308">kamarádka</text>
    <text x="615" y="308">ty píšeš zprávu</text>
  </g>

  <!-- zpráva dorazí (zelená = v pořádku) -->
  <circle cx="152" cy="252" r="11" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <path d="M 146.5 252 L 151 257 L 158 246" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- putující zpráva (jantarová obálka) -->
  <g>
    <rect x="-12" y="-8.5" width="24" height="17" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <path d="M -12 -8.5 L 0 2 L 12 -8.5" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round"/>
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 612 240 C 578 152 492 116 400 116 C 308 116 222 152 188 240"/>
  </g>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">Když jedna cesta vypadne, routery pošlou data jinudy – zpráva stejně dorazí.</text>

  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
</svg>
