  <!-- zvýraznění nejhustšího svazku -->
  <text x="400" y="70" text-anchor="middle" font-size="11" fill="#D97706">tudy vede nejvíc kabelů světa</text>
  <line x1="400" y1="75" x2="400" y2="86" stroke="#D97706" stroke-width="1.5"/>

  <!-- popisky -->
  <g text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E1B4B">
    <text x="148" y="211">Amerika</text>
    <text x="620" y="112">Evropa</text>
    <text x="620" y="232">Afrika</text>
  </g>
  <text x="398" y="332" text-anchor="middle" font-size="11" fill="#6B7280">Atlantský oceán</text>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">99 % dat mezi kontinenty teče kabely po dně oceánu – satelity jsou jen doplněk.</text>
</svg>
