<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1E1B4B">Lístek č. 42 aneb šatna, která nezapomíná</text>

  <!-- P1: expozice -->
  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="250" y="78" width="74" height="24" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="287" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">ŠATNA</text>
  <rect x="190" y="108" width="180" height="34" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="280" y="129" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Váš lístek: číslo 42.</text>
  <rect x="196" y="192" width="168" height="48" rx="4" fill="#FAFAF7" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="282" cy="156" r="10" fill="#10B981"/>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M282 166 L282 192"/>
    <path d="M282 172 L246 180"/>
  </g>
  <rect x="214" y="172" width="30" height="18" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="229" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">42</text>
  <circle cx="96" cy="140" r="10" fill="#7C3AED"/>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M96 150 L96 196"/>
    <path d="M96 196 L86 222"/>
    <path d="M96 196 L106 222"/>
    <path d="M96 160 L126 170"/>
    <path d="M96 162 L78 178"/>
  </g>
  <rect x="122" y="162" width="26" height="36" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <path d="M126 166 L135 172 L144 166" fill="none" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="204" y="306" text-anchor="middle" font-size="12" fill="#6B7280">Kabát odevzdáš, dostaneš lístek s číslem. Nic víc.</text>

  <!-- P2: rozvinutí -->
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="536" y="94" width="224" height="50" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="648" y="114" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Číslo 42 — modrá bunda,</text>
  <text x="648" y="132" text-anchor="middle" font-size="12.5" fill="#1E1B4B">je to tak?</text>
  <rect x="580" y="192" width="170" height="48" rx="4" fill="#FAFAF7" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="664" cy="162" r="10" fill="#10B981"/>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M664 172 L664 192"/>
    <path d="M664 178 L628 184"/>
  </g>
  <rect x="602" y="176" width="26" height="36" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <path d="M606 180 L615 186 L624 180" fill="none" stroke="#0EA5E9" stroke-width="1.2"/>
  <circle cx="488" cy="140" r="10" fill="#7C3AED"/>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M488 150 L488 196"/>
    <path d="M488 196 L478 222"/>
    <path d="M488 196 L498 222"/>
    <path d="M488 160 L520 153"/>
  </g>
  <rect x="516" y="142" width="30" height="18" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="531" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">42</text>
  <text x="596" y="306" text-anchor="middle" font-size="12" fill="#6B7280">Web tě podle lístku pozná — a vrátí ti třeba nákupní košík.</text>

  <!-- P3: komplikace -->
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="160" y="360" width="220" height="50" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="270" y="380" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Vy jste tu už potřetí!</text>
  <text x="270" y="398" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Zase přední řadu?</text>
  <rect x="30" y="376" width="112" height="32" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="86" y="396" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Jak to víte?</text>
  <rect x="196" y="470" width="168" height="48" rx="4" fill="#FAFAF7" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="282" cy="430" r="10" fill="#10B981"/>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M282 440 L282 470"/>
    <path d="M282 448 L306 458"/>
  </g>
  <rect x="300" y="450" width="36" height="26" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <g stroke="#1E1B4B" stroke-width="1.2">
    <line x1="308" y1="456" x2="308" y2="470"/>
    <line x1="314" y1="456" x2="314" y2="470"/>
    <line x1="320" y1="456" x2="320" y2="470"/>
  </g>
  <circle cx="96" cy="420" r="10" fill="#7C3AED"/>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M96 430 L96 476"/>
    <path d="M96 476 L86 502"/>
    <path d="M96 476 L106 502"/>
    <path d="M96 440 L116 450"/>
    <path d="M96 442 L78 456"/>
  </g>
  <text x="204" y="586" text-anchor="middle" font-size="12" fill="#6B7280">K číslu si šatna zapisuje každou návštěvu i tvoje zvyky.</text>

  <!-- P4: pointa -->
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="440" y="352" width="240" height="50" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="560" y="372" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Vedle v kině o vás</text>
  <text x="560" y="390" text-anchor="middle" font-size="12.5" fill="#1E1B4B">taky vědí. Znají váš lístek.</text>
  <rect x="470" y="470" width="150" height="48" rx="4" fill="#FAFAF7" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="560" cy="430" r="10" fill="#10B981"/>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M560 440 L560 470"/>
    <path d="M560 446 L600 438"/>
  </g>
  <circle cx="486" cy="420" r="10" fill="#7C3AED"/>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M486 430 L486 470"/>
    <path d="M486 470 L476 496"/>
    <path d="M486 470 L496 496"/>
    <path d="M486 446 L506 452"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2" stroke-linecap="round">
    <line x1="470" y1="406" x2="464" y2="400"/>
    <line x1="474" y1="400" x2="470" y2="392"/>
  </g>
  <rect x="418" y="432" width="64" height="26" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="450" y="449" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Cože?!</text>
  <rect x="700" y="408" width="64" height="112" rx="4" fill="#FAFAF7" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="692" y="372" width="80" height="26" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="732" y="389" text-anchor="middle" font-size="12.5" font-weight="700" fill="#D97706">KINO</text>
  <rect x="716" y="436" width="30" height="18" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="731" y="449" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">42</text>
  <text x="596" y="586" text-anchor="middle" font-size="12" fill="#6B7280">Lístek nečte jen šatna — tomu se říká cookies třetích stran.</text>

  <text x="400" y="626" text-anchor="middle" font-size="13" fill="#6B7280">Cookie je šatnový lístek webu: k číslu si server ukládá, co děláš. Čtou ho i třetí strany.</text>
</svg>
