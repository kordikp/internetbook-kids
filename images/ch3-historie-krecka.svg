<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Co prozradí historie vyhledávání</text>

  <!-- okno historie vyhledávání (neutrální bílé UI) -->
  <rect x="52" y="80" width="420" height="240" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- vyhledávací pole s lupou -->
  <rect x="76" y="98" width="372" height="36" rx="18" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="98" cy="115" r="7" fill="none" stroke="#6B7280" stroke-width="2"/>
  <line x1="103" y1="120" x2="110" y2="127" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <text x="122" y="120" font-size="12.5" fill="#6B7280">historie vyhledávání</text>

  <!-- tři záznamy s hodinami -->
  <g fill="none" stroke="#6B7280" stroke-width="1.5">
    <circle cx="100" cy="180" r="9" fill="#FFFFFF"/>
    <circle cx="100" cy="232" r="9" fill="#FFFFFF"/>
    <circle cx="100" cy="284" r="9" fill="#FFFFFF"/>
  </g>
  <g stroke="#6B7280" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="180" x2="100" y2="175"/><line x1="100" y1="180" x2="104.5" y2="180"/>
    <line x1="100" y1="232" x2="100" y2="227"/><line x1="100" y1="232" x2="104.5" y2="232"/>
    <line x1="100" y1="284" x2="100" y2="279"/><line x1="100" y1="284" x2="104.5" y2="284"/>
  </g>
  <g font-size="14" fill="#1E1B4B">
    <text x="122" y="185">je křeček vhodný k dítěti</text>
    <text x="122" y="237">nejlepší zš v praze</text>
    <text x="122" y="289">jak velkou klec potřebuji pro křečka</text>
  </g>
  <line x1="76" y1="206" x2="448" y2="206" stroke="#E5E7EB"/>
  <line x1="76" y1="258" x2="448" y2="258" stroke="#E5E7EB"/>

  <!-- jantarové podtržení: co dotaz prozrazuje -->
  <g fill="#D97706">
    <rect x="233" y="189" width="52" height="3" rx="1.5"/>
    <rect x="180" y="241" width="66" height="3" rx="1.5"/>
    <rect x="291" y="293" width="66" height="3" rx="1.5"/>
  </g>

  <!-- odhady po straně -->
  <g stroke="#D97706" stroke-width="1.2" opacity="0.8">
    <line x1="288" y1="188" x2="544" y2="180"/>
    <line x1="249" y1="240" x2="544" y2="232"/>
    <line x1="360" y1="292" x2="544" y2="284"/>
  </g>
  <g>
    <rect x="548" y="163" width="92" height="34" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="594" y="184" text-anchor="middle" font-size="12.5" fill="#1E1B4B">má dítě?</text>
    <rect x="548" y="215" width="152" height="34" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="624" y="236" text-anchor="middle" font-size="12.5" fill="#1E1B4B">řeší školu v Praze?</text>
    <rect x="548" y="267" width="110" height="34" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="603" y="288" text-anchor="middle" font-size="12.5" fill="#1E1B4B">bude křeček!</text>
  </g>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">I pár vyhledávání vypráví příběh. Historie dotazů je součást tvé digitální stopy — a servery z ní odhadují.</text>
</svg>
