<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Tři pakety, tři různé cesty</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <!-- soubor u odesílatele (fialová = zařízení lidí) -->
  <text x="102" y="128" text-anchor="middle" font-size="12.5" fill="#1E1B4B">soubor</text>
  <rect x="42" y="140" width="120" height="150" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <g fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5">
    <rect x="57" y="155" width="90" height="32" rx="4"/>
    <rect x="57" y="197" width="90" height="32" rx="4"/>
    <rect x="57" y="239" width="90" height="32" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="700" fill="#7C3AED">
    <text x="102" y="175">1</text>
    <text x="102" y="217">2</text>
    <text x="102" y="259">3</text>
  </g>
  <text x="102" y="312" text-anchor="middle" font-size="11" fill="#6B7280">rozdělí se na pakety</text>

  <!-- soubor v cíli (zelená = cíl) -->
  <text x="698" y="128" text-anchor="middle" font-size="12.5" fill="#1E1B4B">soubor v cíli</text>
  <rect x="638" y="140" width="120" height="150" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <g fill="#FFFFFF" stroke="#10B981" stroke-width="1.5">
    <rect x="653" y="155" width="90" height="32" rx="4"/>
    <rect x="653" y="197" width="90" height="32" rx="4"/>
    <rect x="653" y="239" width="90" height="32" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="700" fill="#10B981">
    <text x="698" y="175">1</text>
    <text x="698" y="217">2</text>
    <text x="698" y="259">3</text>
  </g>
  <text x="698" y="312" text-anchor="middle" font-size="11" fill="#6B7280">složí se podle čísel</text>

  <!-- tři různé trasy (modrá = data v pohybu) -->
  <g stroke="#0EA5E9" stroke-width="1.75" fill="none" opacity="0.55">
    <path d="M 162 172 C 212 132 252 102 300 102 C 352 102 455 110 505 120 C 558 130 600 148 634 170" marker-end="url(#arr)"/>
    <path d="M 162 214 C 240 214 330 215 400 215 C 470 215 560 215 634 214" marker-end="url(#arr)"/>
    <path d="M 162 254 C 215 292 320 332 400 332 C 480 332 562 294 634 256" marker-end="url(#arr)"/>
  </g>

  <!-- routery (modré křižovatky) -->
  <g stroke="#0EA5E9" stroke-width="2" fill="#E0F2FE">
    <rect x="276" y="78" width="48" height="48" rx="9" transform="rotate(45 300 102)"/>
    <rect x="481" y="96" width="48" height="48" rx="9" transform="rotate(45 505 120)"/>
    <rect x="376" y="191" width="48" height="48" rx="9" transform="rotate(45 400 215)"/>
    <rect x="376" y="308" width="48" height="48" rx="9" transform="rotate(45 400 332)"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1E1B4B">
    <text x="300" y="106">router</text>
    <text x="505" y="124">router</text>
    <text x="400" y="219">router</text>
    <text x="400" y="336">router</text>
  </g>

  <!-- putující očíslované pakety (jantarová = zvýraznění) -->
  <g>
    <rect x="-13" y="-9.5" width="26" height="19" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="0" y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E1B4B">1</text>
    <animateMotion dur="5s" repeatCount="indefinite" path="M 162 172 C 212 132 252 102 300 102 C 352 102 455 110 505 120 C 558 130 600 148 634 170"/>
  </g>
  <g>
    <rect x="-13" y="-9.5" width="26" height="19" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="0" y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E1B4B">2</text>
    <animateMotion dur="5s" repeatCount="indefinite" path="M 162 214 C 240 214 330 215 400 215 C 470 215 560 215 634 214"/>
  </g>
  <g>
    <rect x="-13" y="-9.5" width="26" height="19" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="0" y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E1B4B">3</text>
    <animateMotion dur="5s" repeatCount="indefinite" path="M 162 254 C 215 292 320 332 400 332 C 480 332 562 294 634 256"/>
  </g>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">Každý paket jede jinudy. V cíli se soubor složí podle čísel paketů.</text>

  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
</svg>
