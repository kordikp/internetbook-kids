<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Kde bydlí data? Datová centra světa</text>

  <!-- zjednodušené kontinenty -->
  <g fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5">
    <path d="M 72 98 C 110 74 205 68 252 86 C 280 97 284 122 268 140 C 252 158 240 162 232 176 C 224 190 222 206 210 216 C 196 218 184 206 170 197 C 130 178 84 140 72 98 Z"/>
    <path d="M 218 244 C 244 230 278 238 286 264 C 292 288 282 318 264 342 C 254 330 238 310 228 288 C 221 272 214 254 218 244 Z"/>
    <path d="M 386 94 C 412 76 450 76 468 94 C 480 108 474 128 454 138 C 430 148 398 144 386 128 C 379 116 378 102 386 94 Z"/>
    <path d="M 396 168 C 424 152 470 156 486 178 C 496 194 492 212 482 228 C 472 248 462 268 450 284 C 440 298 420 298 410 280 C 396 254 388 200 396 168 Z"/>
    <path d="M 496 84 C 550 62 650 64 700 88 C 725 102 728 136 704 156 C 676 178 640 184 612 188 C 604 206 596 220 585 230 C 574 220 566 204 560 189 C 530 184 502 168 492 140 C 484 118 484 92 496 84 Z"/>
    <path d="M 652 264 C 678 250 714 254 728 272 C 738 287 728 304 704 309 C 680 314 656 306 648 290 C 644 280 646 269 652 264 Z"/>
  </g>

  <!-- zelené kruhy = datová centra (velikost = počet) -->
  <g fill="#D1FAE5" stroke="#10B981" stroke-width="2">
    <circle cx="168" cy="138" r="30"/>
    <circle cx="420" cy="112" r="21"/>
    <circle cx="662" cy="148" r="13"/>
    <circle cx="583" cy="200" r="8"/>
    <circle cx="256" cy="290" r="9"/>
    <circle cx="694" cy="284" r="7"/>
  </g>
  <text x="168" y="143" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E1B4B">USA</text>
  <text x="420" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E1B4B">Evropa</text>
  <text x="662" y="209" text-anchor="middle" font-size="11" fill="#6B7280">východní Asie</text>

  <!-- legenda -->
  <g fill="#D1FAE5" stroke="#10B981" stroke-width="1.5">
    <circle cx="108" cy="368" r="5"/>
    <circle cx="136" cy="368" r="11"/>
  </g>
  <text x="158" y="372" font-size="11" fill="#6B7280">velikost kruhu = počet datových center</text>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">Na světě je asi 8 000 datových center – zdaleka nejvíc v USA a západní Evropě.</text>
</svg>
