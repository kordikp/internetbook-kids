<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Routery: chytré křižovatky internetu</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- klient (fialová = zařízení lidí) -->
  <g>
    <rect x="46" y="170" width="112" height="76" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="76" y="188" width="52" height="34" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="94" y="226" width="16" height="4" rx="2" fill="#7C3AED"/>
    <text x="102" y="264" text-anchor="middle" font-size="12.5" fill="#1E1B4B">tvůj mobil</text>
  </g>

  <!-- routery (modrá = síť): kosočtverce jako křižovatky -->
  <g stroke="#0EA5E9" stroke-width="2" fill="#E0F2FE">
    <rect x="253" y="105" width="54" height="54" rx="10" transform="rotate(45 280 132)"/>
    <rect x="253" y="253" width="54" height="54" rx="10" transform="rotate(45 280 280)"/>
    <rect x="443" y="105" width="54" height="54" rx="10" transform="rotate(45 470 132)"/>
    <rect x="443" y="253" width="54" height="54" rx="10" transform="rotate(45 470 280)"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1E1B4B">
    <text x="280" y="137">router</text>
    <text x="280" y="285">router</text>
    <text x="470" y="137">router</text>
    <text x="470" y="285">router</text>
  </g>

  <!-- server (zelená = cíl) -->
  <g>
    <rect x="648" y="152" width="104" height="112" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <g fill="#FFFFFF" stroke="#10B981" stroke-width="1.5">
      <rect x="664" y="168" width="72" height="18" rx="4"/>
      <rect x="664" y="192" width="72" height="18" rx="4"/>
      <rect x="664" y="216" width="72" height="18" rx="4"/>
    </g>
    <g fill="#10B981">
      <circle cx="674" cy="177" r="2.5"/><circle cx="674" cy="201" r="2.5"/><circle cx="674" cy="225" r="2.5"/>
    </g>
    <text x="700" y="264" text-anchor="middle" font-size="12.5" fill="#1E1B4B">server</text>
  </g>

  <!-- šedé spoje = všechny možné cesty -->
  <g stroke="#6B7280" stroke-width="1.5" opacity="0.45">
    <path d="M158 196 L242 148" fill="none"/>
    <path d="M158 224 L242 268" fill="none"/>
    <path d="M280 170 L280 242" fill="none"/>
    <path d="M470 170 L470 242" fill="none"/>
    <path d="M318 118 L432 118" fill="none"/>
    <path d="M318 296 L432 296" fill="none"/>
    <path d="M312 160 L438 258" fill="none"/>
    <path d="M508 146 L648 186" fill="none"/>
    <path d="M508 268 L648 230" fill="none"/>
  </g>

  <!-- zvolená cesta (modrá, animovaný paket) -->
  <g stroke="#0EA5E9" stroke-width="2.5" fill="none">
    <path d="M158 196 L242 148" marker-end="url(#arr)"/>
    <path d="M318 118 L432 118" marker-end="url(#arr)"/>
    <path d="M508 146 L648 186" marker-end="url(#arr)"/>
  </g>
  <g>
    <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M158 196 L280 128 L470 118 L700 190"/>
    </rect>
  </g>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">Každá křižovatka pošle paket dál tou cestou, která je zrovna nejlepší.</text>

  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
</svg>
