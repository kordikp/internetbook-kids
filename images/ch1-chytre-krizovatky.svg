<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Routery: chytré křižovatky internetu</text>

  <!-- ostatní (pomalejší) spoje mesh sítě -->
  <g stroke="#CBD5E1" stroke-width="2" fill="none">
    <line x1="174" y1="206" x2="320" y2="122"/>
    <line x1="320" y1="122" x2="478" y2="150"/>
    <line x1="320" y1="122" x2="400" y2="252"/>
    <line x1="400" y1="252" x2="478" y2="150"/>
    <line x1="400" y1="252" x2="536" y2="286"/>
    <line x1="478" y1="150" x2="536" y2="286"/>
    <line x1="536" y1="286" x2="628" y2="206"/>
  </g>
  <!-- nejrychlejší cesta právě teď (modrá = data v pohybu) -->
  <g stroke="#0EA5E9" stroke-width="3.5" fill="none" stroke-linecap="round">
    <line x1="174" y1="212" x2="400" y2="252"/>
    <line x1="400" y1="252" x2="628" y2="206"/>
  </g>

  <!-- mobil (fialová = zařízení lidí) -->
  <g>
    <rect x="128" y="178" width="42" height="66" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="136" y="190" width="26" height="36" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="149" cy="234" r="3" fill="#7C3AED"/>
    <text x="149" y="266" text-anchor="middle" font-size="12" fill="#1E1B4B">tvůj mobil</text>
  </g>

  <!-- routery (modré kosočtverce) -->
  <g stroke="#0EA5E9" stroke-width="2" fill="#E0F2FE">
    <rect x="298" y="100" width="44" height="44" rx="9" transform="rotate(45 320 122)"/>
    <rect x="378" y="230" width="44" height="44" rx="9" transform="rotate(45 400 252)"/>
    <rect x="456" y="128" width="44" height="44" rx="9" transform="rotate(45 478 150)"/>
    <rect x="514" y="264" width="44" height="44" rx="9" transform="rotate(45 536 286)"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1E1B4B">
    <text x="320" y="76">router</text>
    <text x="400" y="302">router</text>
    <text x="478" y="104">router</text>
    <text x="536" y="336">router</text>
  </g>

  <!-- server (zelená = cíl) -->
  <g>
    <rect x="628" y="160" width="96" height="92" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <g fill="#FFFFFF" stroke="#10B981" stroke-width="1.5">
      <rect x="640" y="172" width="72" height="18" rx="4"/>
      <rect x="640" y="196" width="72" height="18" rx="4"/>
      <rect x="640" y="220" width="72" height="18" rx="4"/>
    </g>
    <g fill="#10B981">
      <circle cx="648" cy="181" r="2.5"/><circle cx="648" cy="205" r="2.5"/><circle cx="648" cy="229" r="2.5"/>
    </g>
    <text x="676" y="270" text-anchor="middle" font-size="12" fill="#1E1B4B">server</text>
  </g>

  <!-- putující paket po nejrychlejší cestě -->
  <g>
    <rect x="-12" y="-9" width="24" height="18" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 174 212 L 400 252 L 628 206"/>
  </g>

  <!-- vysvětlivka s vodicí čarou (mimo čáry) -->
  <line x1="292" y1="322" x2="330" y2="248" stroke="#9CA3AF" stroke-width="1"/>
  <text x="292" y="340" text-anchor="middle" font-size="12" fill="#1E1B4B" font-weight="700">modře: nejrychlejší cesta právě teď</text>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">Každá křižovatka pošle paket dál tou cestou, která je zrovna nejlepší.</text>
  <style>@media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
</svg>
