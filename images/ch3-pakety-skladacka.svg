<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Pakety: skládačka, která se složí sama</text>

  <style>
    .t1, .t2, .t3, .t4 { animation-duration: 5.6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .t1 { animation-name: go1, fade; animation-delay: 0s; }
    .t2 { animation-name: go2, fade; animation-delay: -1.4s; }
    .t3 { animation-name: go3, fade; animation-delay: -2.8s; }
    .t4 { animation-name: go4, fade; animation-delay: -4.2s; }
    @keyframes go1 { 0% { transform: translate(-86px, 33px); } 38% { transform: translate(0, 0); } 70% { transform: translate(164px, -4px); } 100% { transform: translate(286px, 33px); } }
    @keyframes go2 { 0% { transform: translate(-206px, 20px); } 30% { transform: translate(-118px, 9px); } 55% { transform: translate(0, 0); } 100% { transform: translate(166px, 14px); } }
    @keyframes go3 { 0% { transform: translate(-136px, -35px); } 42% { transform: translate(0, 0); } 72% { transform: translate(129px, -8px); } 100% { transform: translate(236px, -35px); } }
    @keyframes go4 { 0% { transform: translate(-256px, -72px); } 30% { transform: translate(-134px, 2px); } 62% { transform: translate(0, 0); } 100% { transform: translate(116px, -72px); } }
    @keyframes fade { 0% { opacity: 0; } 6% { opacity: 1; } 92% { opacity: 1; } 98% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <!-- fotka u odesílatele (fialová) -->
  <g>
    <rect x="56" y="128" width="150" height="112" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <polygon points="70,224 112,170 154,224" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="128,224 160,188 192,224" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="178" cy="156" r="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <g stroke="#6B7280" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7">
      <line x1="131" y1="136" x2="131" y2="232"/>
      <line x1="64" y1="184" x2="198" y2="184"/>
    </g>
    <text x="131" y="262" text-anchor="middle" font-size="12.5" fill="#1E1B4B">u tebe: fotka se rozdělí</text>
  </g>

  <!-- fotka u příjemce (zelená) -->
  <g>
    <rect x="594" y="128" width="150" height="112" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <polygon points="608,224 650,170 692,224" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="666,224 698,188 730,224" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="716" cy="156" r="9" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="669" y="262" text-anchor="middle" font-size="12.5" fill="#1E1B4B">u kamaráda: složí se</text>
  </g>

  <!-- čtyři různé cesty sítí -->
  <g fill="none" stroke="#6B7280" stroke-width="1.5" opacity="0.35">
    <path d="M214 156 C 300 102 500 102 586 156"/>
    <path d="M214 176 C 320 164 480 136 586 170"/>
    <path d="M214 198 C 320 262 480 232 586 198"/>
    <path d="M214 218 C 300 330 500 320 586 218"/>
  </g>

  <!-- putující očíslované dílky (modrá = data v pohybu) -->
  <g transform="translate(300 123)"><g class="t1">
    <rect x="-29" y="-22" width="58" height="44" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <rect x="-21" y="-14" width="42" height="28" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1"/>
    <polygon points="-14,10 0,-8 14,10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="22" cy="-16" r="8.5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="22" y="-12" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">1</text>
  </g></g>
  <g transform="translate(420 156)"><g class="t2">
    <rect x="-29" y="-22" width="58" height="44" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <rect x="-21" y="-14" width="42" height="28" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1"/>
    <circle cx="2" cy="0" r="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="22" cy="-16" r="8.5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="22" y="-12" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">2</text>
  </g></g>
  <g transform="translate(350 233)"><g class="t3">
    <rect x="-29" y="-22" width="58" height="44" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <rect x="-21" y="-14" width="42" height="28" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1"/>
    <polygon points="-15,10 -2,-6 11,10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="22" cy="-16" r="8.5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="22" y="-12" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">3</text>
  </g></g>
  <g transform="translate(470 290)"><g class="t4">
    <rect x="-29" y="-22" width="58" height="44" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <rect x="-21" y="-14" width="42" height="28" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1"/>
    <line x1="-16" y1="8" x2="16" y2="8" stroke="#7C3AED" stroke-width="1.5"/>
    <polygon points="-4,8 6,-4 16,8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="22" cy="-16" r="8.5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="22" y="-12" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">4</text>
  </g></g>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">Fotka se rozdělí na očíslované pakety, každý smí letět jinou cestou — v cíli se složí podle čísel.</text>
</svg>
