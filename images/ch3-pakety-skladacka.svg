<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Pakety: skládačka, která se složí sama</text>

  <!-- krok 1: fotka u tebe (fialová = tvoje zařízení) -->
  <g data-krok="1">
    <rect x="56" y="120" width="150" height="112" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="92" cy="152" r="11" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <path d="M 66 216 L 106 172 L 132 198 L 156 176 L 196 216 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/>
    <text x="131" y="256" text-anchor="middle" font-size="12" fill="#1E1B4B">fotka u tebe</text>
  </g>

  <!-- krok 2: rozřezání na očíslované pakety -->
  <g data-krok="2">
    <g stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4">
      <line x1="131" y1="120" x2="131" y2="232"/>
      <line x1="56" y1="176" x2="206" y2="176"/>
    </g>
    <text x="131" y="286" text-anchor="middle" font-size="11.5" fill="#1E1B4B">rozdělí se na 4 kousky</text>
    <line x1="131" y1="266" x2="131" y2="238" stroke="#9CA3AF" stroke-width="1"/>
  </g>

  <!-- krok 3: pakety letí dvěma cestami (modré trasy, jantarové kousky) -->
  <g data-krok="3">
    <g fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
      <path d="M 212 152 C 300 96 480 96 576 148"/>
      <path d="M 212 210 C 320 268 470 268 578 214"/>
    </g>
    <g font-weight="700" font-size="13" text-anchor="middle">
      <g transform="translate(212 152)">
        <rect x="-15" y="-12" width="30" height="24" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
        <text y="5" fill="#92400E">1</text>
        <animateMotion dur="4.5s" repeatCount="indefinite" path="M 0 0 C 88 -56 268 -56 364 -4"/>
      </g>
      <g transform="translate(212 152)">
        <rect x="-15" y="-12" width="30" height="24" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
        <text y="5" fill="#92400E">2</text>
        <animateMotion dur="4.5s" begin="0.9s" repeatCount="indefinite" path="M 0 0 C 88 -56 268 -56 364 -4"/>
      </g>
      <g transform="translate(212 210)">
        <rect x="-15" y="-12" width="30" height="24" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
        <text y="5" fill="#92400E">3</text>
        <animateMotion dur="4.5s" begin="0.45s" repeatCount="indefinite" path="M 0 0 C 108 58 258 58 366 4"/>
      </g>
      <g transform="translate(212 210)">
        <rect x="-15" y="-12" width="30" height="24" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
        <text y="5" fill="#92400E">4</text>
        <animateMotion dur="4.5s" begin="1.35s" repeatCount="indefinite" path="M 0 0 C 108 58 258 58 366 4"/>
      </g>
    </g>
    <text x="395" y="330" text-anchor="middle" font-size="11.5" fill="#1E1B4B">každý kousek smí letět jinou cestou</text>
    <line x1="395" y1="310" x2="395" y2="262" stroke="#9CA3AF" stroke-width="1"/>
  </g>

  <!-- krok 4: složená fotka u kamaráda (zelená = cíl) -->
  <g data-krok="4">
    <rect x="594" y="120" width="150" height="112" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <circle cx="630" cy="152" r="11" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <path d="M 604 216 L 644 172 L 670 198 L 694 176 L 734 216 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
    <g font-size="10" fill="#065F46" text-anchor="middle" font-weight="700">
      <text x="612" y="134">1</text><text x="738" y="134">2</text><text x="612" y="228">3</text><text x="738" y="228">4</text>
    </g>
    <text x="669" y="256" text-anchor="middle" font-size="12" fill="#1E1B4B">u kamaráda: složená podle čísel</text>
  </g>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">Fotka se rozdělí na očíslované pakety — v cíli se sama složí podle čísel, ať letěly kudykoli.</text>
  <style>@media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
</svg>
