<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Řez oceánem: kudy vede kabel</text>

  <!-- voda -->
  <path d="M 128 116 C 160 132 148 176 184 216 C 220 258 260 300 400 300 C 540 300 580 258 616 216 C 652 176 640 132 672 116 L 672 116 L 128 116 Z" fill="#E0F2FE" opacity="0.55"/>
  <line x1="60" y1="116" x2="740" y2="116" stroke="#0EA5E9" stroke-width="2" opacity="0.5"/>

  <!-- pevniny (zelená = pevná zem) -->
  <g>
    <path d="M 46 116 L 128 116 C 150 140 146 176 178 212 C 154 226 120 232 92 232 L 46 232 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <path d="M 754 116 L 672 116 C 650 140 654 176 622 212 C 646 226 680 232 708 232 L 754 232 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="86" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">Evropa</text>
    <text x="712" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">Amerika</text>
  </g>

  <!-- kabel po dně (modrá = síť) + putující jiskra -->
  <path id="cbl" d="M 108 226 C 180 268 240 322 400 322 C 560 322 620 268 692 226" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle r="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <animateMotion dur="4s" repeatCount="indefinite" path="M 108 226 C 180 268 240 322 400 322 C 560 322 620 268 692 226"/>
  </g>
  <text x="400" y="366" text-anchor="middle" font-size="11.5" fill="#1E1B4B">optický kabel na dně — tlustý asi jako zahradní hadice</text>

  <!-- hloubka (vodicí šipka mimo kabel) -->
  <g stroke="#9CA3AF" stroke-width="1.5">
    <line x1="536" y1="122" x2="536" y2="252"/>
    <path d="M 532 128 L 536 120 L 540 128 M 532 246 L 536 254 L 540 246" fill="none"/>
  </g>
  <text x="548" y="192" font-size="11" fill="#1E1B4B">hloubka i 4 km</text>

  <!-- opravárenská loď + vodicí čára -->
  <g>
    <path d="M 254 108 L 342 108 L 322 128 L 274 128 Z" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2" stroke-linejoin="round"/>
    <rect x="284" y="88" width="24" height="20" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <path d="M 298 128 C 298 170 298 210 340 262" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="298" y="76" text-anchor="middle" font-size="11.5" fill="#1E1B4B">opravárenská loď kabel vytáhne a spraví</text>
  </g>

  <!-- rybka (dekorace, žraloci nekoušou) -->
  <g fill="none" stroke="#0EA5E9" stroke-width="2" opacity="0.7">
    <path d="M 476 236 C 484 230 494 230 500 236 C 494 242 484 242 476 236 Z"/>
    <path d="M 476 236 L 468 230 L 468 242 Z"/>
  </g>

  <text x="400" y="404" text-anchor="middle" font-size="12.5" fill="#6B7280">Zpráva pluje kabelem po dně oceánu. Když se přetrhne, opraví ho loď — a žralok si nekousne.</text>
  <style>@media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
</svg>
