            od vysílače jsi, tím slabší signál máš.</p><ul><li>Vysílač typu <strong>4G</strong> zvládne
            přibližně 60 Mb/s, <strong>5G</strong> přibližně 600 Mb/s.</li><li>Dosah vysílače je přibližně
