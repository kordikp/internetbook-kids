          answer: "Wi-Fi: výhoda - bez kabelu; nevýhoda - krátký dosah, ruší se; využití - notebook nebo mobil doma. Kabel: výhoda - rychlý a spolehlivý; nevýhoda - nejde do mobilu, překáží; využití - online výuka na počítači. Mobilní data: výhoda - fungují i v přírodě; nevýhoda - potřebuješ SIM kartu s předplacenými daty; využití - hledání cesty v mapě na výletě."
