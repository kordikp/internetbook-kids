        concept: datova-stopa
        q: "Jak se jmenuje záznam o všem, co na internetu děláme — co lajkujeme, na co klikáme, co komentujeme?"
        options: ["datová stopa", "požadavek na server", "IP adresa", "bezdrátové připojení"]
        correct: 0
        explain: "Datová stopa je záznam o tom, co všechno na internetu děláme."
      - id: bq-12
        concept: personalizace
        q: "Jak se říká přizpůsobování obsahu na internetu podle toho, co jsme tam dřív dělali?"
        options: ["decentralizace", "speedtest", "hotspot", "personalizace"]
        correct: 3
        explain: "Personalizace znamená, že se obsah přizpůsobuje podle naší dřívější činnosti na internetu."
