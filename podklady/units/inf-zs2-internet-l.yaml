# Obsahový balíček P-book Školní edice v0.4, §5 — blok „Jak funguje internet“, varianta L (6.–7. ročník)
# Zdroj: Internet4Kids (MFF UK + PedF UK); pbook/content/1H–4H.js (variants.L) + converted/*_priprava_pro_ucitele_L.md

unit:
  id: inf-zs2-internet-l
  title: "Jak funguje internet"
  grade: "6-7"
  lang: cs
  source: "Internet4Kids (MFF UK + PedF UK), blok 4 hodin"
  rvp: ["I-9-4-03", "I-9-4-05"]

  # Číselník konceptů — odvozen z tabulky pojmů lekce 4H (příprava pro učitele, varianta L, 26 pojmů)
  concepts:
    server: "Server"
    sitovy-router: "Síťový router"
    datove-centrum: "Datové centrum"
    internet: "Internet"
    bts: "BTS"
    cookies: "Cookies"
    datova-stopa: "Datová stopa"
    ip-adresa: "IP adresa"
    paket: "Paket"
    satelit: "Satelit"
    mobilni-data: "Mobilní data"
    wi-fi: "Wi-Fi"
    bezdratove-pripojeni: "Bezdrátové připojení"
    kabel: "Kabel"
    personalizace: "Personalizace"
    wi-fi-router: "Wi-Fi router"
    speedtest: "Speedtest"
    poskytovatel-internetu: "Poskytovatel internetu"
    hacker: "Hacker"
    hotspot: "Hotspot"
    sim-karta: "SIM karta"
    pocitacova-sit: "Počítačová síť"
    podmorske-kabely: "Podmořské kabely"
    pozadavek-na-server: "Požadavek na server"
    ip-adresa-prijemce: "IP adresa příjemce"
    ip-adresa-odesilatele: "IP adresa odesílatele"

  lessons:
    - id: L1
      title: "Jak vypadá internet"
      objectives:
        - "Žák vysvětlí, co znamená, že je internet decentralizovaný, a uvede výhodu plynoucí z decentralizace (např. odolnost)."
        - "Žák popíše, přes jaká zařízení putují data internetem (servery, routery)."
      home_prep:
        segments: [seg/l1-servery, seg/l1-kabely-routery, seg/l1-decentralizace]
        recall: auto
        est_min: 25
        link_label: "Domácí příprava na 2. hodinu"
      in_class:
        - {phase: warmup, min: 5, source: generated, note: "Evokace „K čemu potřebujeme internet?“: dvojice napíšou činnosti, které lze dělat online / offline / obojí; sdílení na tabuli.", offline: true}
        - {phase: aktivita, min: 20, note: "Servery a kabely: odhady (počet videí na YouTube, počet serverů na světě), aktivita „Co je uloženo na serverech“ (PL úkol 2), hadice jako model kabelu.", offline: true}
        - {phase: aktivita, min: 10, note: "Palčivé otázky ve skupinách: a) Má internet řídící centrum a ředitele? b) Co se stane, když někdo překopne kabel Praha–Brno? Skupiny argumentují, poté společné rozuzlení.", offline: true}
        - {phase: reflexe, min: 10, note: "Přiřazování pojmů k vysvětlením (PL úkol 4), kontrola nad zjednodušeným modelem internetu, sdílení překvapení z hodiny.", offline: true}
      gate: {requires: home_prep, min_score: 0.7, soft: true}

    - id: L2
      title: "Jak se připojíme k internetu?"
      objectives:
        - "Žák vyjmenuje tři druhy připojení k internetu."
        - "Žák napíše ke každému druhu připojení alespoň jednu výhodu a nevýhodu a ideální využití."
      home_prep:
        segments: [seg/l2-wifi-router, seg/l2-kabely, seg/l2-mobilni-data, seg/l2-shrnuti]
        recall: auto
        est_min: 30
        link_label: "Domácí příprava na 3. hodinu"
        activity: {type: tutored_task, tutor_config: tc/L2}
      in_class:
        - {phase: warmup, min: 5, note: "Evokace „Jak se připojíme?“: dvojice řeší situace (doma na mobilu, v lese, na školním počítači, doma na notebooku), společná kontrola.", offline: true}
        - {phase: aktivita, min: 10, note: "Experiment s routerem: router zapojený jen do elektřiny — Wi-Fi vidíme, ale internet nefunguje; hlasování, zkouška s vlastními zařízeními, zapojení internetového kabelu.", offline: true}
        - {phase: aktivita, min: 12, note: "Kabely (podmořské kabely, video z pokládky), mobilní data a BTS (mapa nejbližších vysílačů na gsmweb.cz), hotspot, hlasování o roli satelitů.", offline: false}
        - {phase: reflexe, min: 13, note: "Speedtest školní Wi-Fi ve dvojicích (speedtest.cesnet.cz), zápis hodnot na tabuli a porovnání; tabulka výhod/nevýhod/ideálního využití (PL úkol 3).", offline: false}
      gate: {requires: home_prep, min_score: 0.7, soft: true}

    - id: L3
      title: "Co o nás ví internet?"
      objectives:
        - "Žák odhadne a napíše vlastnosti osoby podle její historie vyhledávání."
        - "Žák vyjmenuje alespoň dvě pozitivní a dvě negativní věci na datové stopě z perspektivy uživatele internetu."
      home_prep:
        segments: [seg/l3-pakety, seg/l3-kdo-plati, seg/l3-cookies, seg/l3-stopa]
        recall: auto
        est_min: 30
        link_label: "Domácí příprava na 4. hodinu"
        activity:
          - type: telling
            brief: "Připrav si 2–3minutové vyprávění pro někoho doma (rodiče, sourozence, prarodiče): vysvětli vlastními slovy, jak putuje fotka internetem (pakety, IP adresy, routery) a co je datová stopa. Použij alespoň 5 pojmů z číselníku pojmů a vymysli jedno vlastní přirovnání (jako kostra dinosaura nebo šatnový lístek). Klidně si nakresli obrázek jako pomůcku — vyprávění si přineseš na 4. hodinu k obhajobě."
          - type: peer_review
            note: "Domluv se s kamarádem nebo spolužákem a vyprávění si navzájem přehrajte (osobně, hovorem, hlasovkou). Každý dá tomu druhému jedno konkrétní ocenění (co bylo srozumitelné, který pojem nebo přirovnání sedly) a jeden tip na zlepšení. Poznámky z hodnocení si přines na 4. hodinu."
      in_class:
        - {phase: warmup, min: 5, note: "Opakování hlasováním se zavřenýma očima: centrum internetu, kde jsou uloženy weby a videa, router jako chytrá křižovatka, Wi-Fi vs. internet, BTS.", offline: true}
        - {phase: aktivita, min: 7, note: "Evokace „Převoz dinosaura“: dvojice vymýšlejí, jak převézt kostru více auty — rozebrat, očíslovat, plánek, složit v cíli.", offline: true}
        - {phase: aktivita, min: 15, note: "Pakety a IP adresy, aktivita „Co je pravda?“ (PL úkol 1), kdo platí internet, cookies jako šatnový lístek, datová stopa jako stopy ve sněhu.", offline: true}
        - {phase: aktivita, min: 8, note: "Aktivita „Křeček“: z historie vyhledávání žáci odhadují vlastnosti neznámého uživatele a navrhují reklamy; závěr — servery odhadují jen s pravděpodobností.", offline: true}
        - {phase: reflexe, min: 10, note: "„Co o mně ví internet?“ + výhody a nevýhody sbírání dat (PL úkol 3). Start tellingu: zadání domácího vyprávění a peer review — žáci si volí publikum a pojmy.", offline: true}
      gate: {requires: home_prep, min_score: 0.7, soft: true}

    - id: L4
      title: "Velké opakování"
      objectives:
        - "Žák za pomoci spolužáků odpoví správně na většinu otázek, které shrnují učivo předchozích tří vyučovacích hodin."
      home_prep:
        segments: [seg/l4-opakovani]
        recall: auto
        est_min: 25
        link_label: "Lehké opakování před závěrečnou hodinou"
        activity: {type: game, note: "Zahraj si doma Bingo s pojmy podle návodu v segmentu „Zopakuj si pojmy a zahraj si Bingo“ — potřebuješ druhého hráče (kamaráda, sourozence, rodiče), mřížku 3×3 a seznam pojmů z pracovního listu."}
      in_class:
        - {phase: warmup, min: 5, note: "Rozdělení do týmů po 4, vysvětlení pravidel kvízu (2 kola, nerozhoduje rychlost, ale správnost).", offline: true}
        - {phase: aktivita, min: 20, note: "Týmový kvíz v Kahootu (1. kolo s výběrem odpovědí, 2. kolo otevřené otázky na lepící papírky), offline alternativa: Bingo s losováním definic pojmů.", offline: false}
        - {phase: obhajoby, min: 12, note: "Obhajoby tellingů: žáci krátce představí své vyprávění z DP3 a poznatky z peer review; třída oceňuje nejlepší přirovnání.", offline: true}
        - {phase: boss_quiz, min: 6, note: "Závěrečný BOSS kvíz bloku — 12 položek pokrývajících pojmy všech lekcí.", offline: false}
        - {phase: certifikat, min: 2, note: "Vyhodnocení, předání certifikátu „Jak funguje internet“ a společné shrnutí bloku.", offline: true}
      gate: {requires: home_prep, min_score: 0.7, soft: true}

  segments:
    # ── L1: Jak vypadá internet ────────────────────────────────────────────────
    - id: seg/l1-servery
      title: "Kde je to všechno uloženo? Servery a datová centra"
      concepts: [server, datove-centrum, pozadavek-na-server]
      est_min: 8
      blocks:
        - type: text
          html: >-
            <p>Když jsi připojený k internetu, můžeš si psát s kamarády, sledovat videa, hrát online hry
            nebo si vyhledávat informace. Ale napadlo tě někdy, <strong>kde je to všechno uloženo</strong>?
            Videa přece nejsou ve tvém mobilu - zkusme si to spočítat na YouTube:</p><ul><li>Na YouTube je
            zhruba <strong>800 milionů videí</strong>.</li><li>Jedno video zabere v paměti průměrně
            <strong>1 GB</strong>.</li><li>Dohromady je to asi <strong>800 000 000 GB</strong> dat.</li>
            <li>Tvůj mobil má přitom paměť typicky jen <strong>32 až 128 GB</strong>.</li></ul><p>Všechna
            videa z YouTube by se do mobilu nevešla ani náhodou. Musí být uložena jinde - na
            <strong>serverech</strong>.</p><p><strong>Server</strong> je počítač, kde je uloženo velké
            množství dat (webové stránky, videa, tvoje zprávy) a který poskytuje nějaké
            <strong>služby</strong>. Slovo pochází z anglického <em>serve</em> = sloužit. Server je vlastně
            takový sluha, který plní tvoje požadavky: "Ukaž mi video!" - "Tady ho máš."</p><p>Velké firmy
            jako Google, Apple nebo Meta potřebují serverů obrovské množství. Ukládají je do speciálních
            budov zvaných <strong>datová centra</strong> - v jednom datovém centru mohou být tisíce až
            miliony serverů.</p>
        - type: figure
          src: "pbook/assets/svg/1H_prezentace_L/page-09.svg"
          alt: "Mapa světa s kroužky znázorňujícími počty datových center v jednotlivých zemích."
          caption: "Datová centra jsou rozmístěna po celém světě - nejvíce jich je v USA a západní Evropě."
      items:
        - id: l1s1-i1
          concept: server
          q: "Co je to server?"
          options:
            - "Program, který zrychluje internet v mobilu"
            - "Kabel, který vede data přes oceán"
            - "Počítač s velkým úložištěm dat, který poskytuje nějaké služby"
            - "Aplikace na sledování videí"
          correct: 2
          explain: "Server je počítač, kde je uloženo velké množství dat a který plní naše požadavky - anglicky serve znamená sloužit."
        - id: l1s1-i2
          concept: server
          q: "Kolik je přibližně na světě serverů?"
          options: ["Méně než 10", "Asi tisíc", "Asi sto tisíc", "Více než milion"]
          correct: 3
          explain: "Serverů jsou miliony - jen velké firmy jako Google jich mají obrovská množství v datových centrech po celém světě."
        - id: l1s1-i3
          concept: datove-centrum
          q: "Co je datové centrum?"
          options:
            - "Aplikace, kde si zálohuješ fotky"
            - "Budova, kde je umístěno velké množství serverů"
            - "Hlavní řídící centrum internetu"
            - "Obchod s počítači"
          correct: 1
          explain: "Datové centrum je prostor (budova), kde jsou naskládány tisíce až miliony serverů."
        - id: l1s1-i4
          concept: server
          q: "Proč se všechna videa z YouTube nevejdou do paměti tvého mobilu?"
          options:
            - "Videa jsou chráněná heslem"
            - "Videa dohromady zabírají asi 800 000 000 GB, mobil má paměť jen v desítkách GB"
            - "Mobil neumí přehrávat videa"
            - "YouTube ukládání do mobilů zakazuje"
          correct: 1
          explain: "Na YouTube je zhruba 800 milionů videí, každé průměrně 1 GB - dohromady asi 800 000 000 GB. Mobil má typicky 32 až 128 GB, proto jsou videa uložena na serverech."
        - id: l1s1-i5
          concept: pozadavek-na-server
          q: "Napíšeš do mobilu „ukaž mi video“. Jak se této zprávě, kterou tvé zařízení pošle serveru, říká?"
          options: ["Odpověď", "Cookie", "Požadavek na server", "Objížďka"]
          correct: 2
          explain: "Požadavek na server je úkol, který server dostane od tvého zařízení. Server jako „sluha“ požadavek splní a pošle ti video zpět."
        - id: l1s1-i6
          concept: datove-centrum
          q: "Komu typicky patří velká datová centra?"
          options:
            - "Velkým firmám, třeba Googlu nebo Microsoftu"
            - "Každé škole"
            - "Vládám jednotlivých států"
            - "Výrobcům mobilních telefonů"
          correct: 0
          explain: "Datové centrum je místo, kde je mnoho serverů u sebe - typicky patří nějaké velké firmě, třeba Microsoftu nebo Googlu."
      prompts:
        - type: didyouknow
          id: l1s1-p1
          concept: server
          text: "Na světě je více než milion serverů a asi 8000 datových center. Server ale může být i u vás ve škole nebo doma - třeba na ovládání chytré domácnosti."
        - type: try
          id: l1s1-p2
          task: "Nakresli si na papír dva velké překrývající se ovály (jako brýle). Levý nadepiš „pouze online“, pravý „pouze offline“ a překryv „online i offline“. Do každé části napiš alespoň 2 činnosti, které na mobilu nebo počítači děláš. Bonus: vyber si 5 služeb, které používáš (sociální síť, hru, mapy, e-shop, školní web), a ke každé napiš, co asi je uloženo na jejích serverech."
          answer: "Pouze online: psaní zpráv kamarádům, vyhledávání informací, nakupování. Pouze offline: focení, psaní poznámek. Obojí: hraní her, poslech hudby, sledování filmů. Na serverech služeb bývají uloženy např. profily a příspěvky (sociální síť), herní účty a skóre (hra), mapové podklady (mapy), zboží a košíky (e-shop), rozvrhy a články (školní web)."
          to_item_pool: true

    - id: seg/l1-kabely-routery
      title: "Kabely a chytré křižovatky"
      concepts: [kabel, podmorske-kabely, sitovy-router, wi-fi-router, satelit]
      est_min: 7
      blocks:
        - type: text
          html: >-
            <p>Jak se ale video ze serveru dostane až do tvého mobilu? Většinu cesty urazí
            <strong>po kabelech</strong>. Představ si zahradní hadici: hadice je kabel a místo vody jím
            k tobě "teče" video ze serveru.</p><p>Kabely vedou pod zemí, mezi městy i mezi kontinenty -
            <strong>po dně oceánů</strong>. Podmořské kabely mají silný ochranný plášť a pokládají je
            speciální lodě. Právě díky nim si můžeš psát s někým v Americe nebo se dívat na video uložené
            na serveru v Irsku.</p>
        - type: figure
          src: "pbook/assets/svg/1H_prezentace_L/page-12.svg"
          alt: "Mapa světa s vyznačenými trasami podmořských internetových kabelů mezi kontinenty."
          caption: "Síť podmořských kabelů propojuje kontinenty - nejhustší svazky vedou přes Atlantik mezi Amerikou a Evropou."
        - type: text
          html: >-
            <p>Kabely se někde musí potkávat a větvit. V těchto místech jsou <strong>chytré
            křižovatky</strong> - zařízení zvaná <strong>routery</strong> (z anglického <em>route</em> =
            směrovat). Router pozná, kam mají data dorazit, a pošle je správným směrem - jako dopravní
            policista, který na křižovatce ukazuje autům, kudy jet.</p><p>Pozor, rozlišuj dva druhy
            routerů:</p><ul><li><strong>Wi-Fi router</strong> - krabička u tebe doma, díky které se
            připojíš přes Wi-Fi.</li><li><strong>Síťový router</strong> - křižovatka v internetové síti,
            která směruje data až k cíli (třeba k serveru webové stránky).</li></ul>
        - type: figure
          src: "pbook/assets/svg/1H_prezentace_L/page-13.svg"
          alt: "Schéma sítě: notebook (klient) propojený kabely přes několik routerů se serverem v datovém centru."
          caption: "Mezi tvým zařízením (klientem) a serverem vede přes routery více možných cest."
      items:
        - id: l1s2-i1
          concept: podmorske-kabely
          q: "Jak se data nejčastěji dostanou přes oceán, třeba z Evropy do Ameriky?"
          options:
            - "Podmořskými kabely po dně oceánu"
            - "Přes satelity na oběžné dráze"
            - "Rádiovým signálem z vysílačů na pobřeží"
            - "Vůbec to nejde, data zůstávají na jednom kontinentu"
          correct: 0
          explain: "Naprostá většina dat cestuje v kabelech - mezi kontinenty vedou podmořské kabely po dně oceánů, satelity se používají jen výjimečně."
        - id: l1s2-i2
          concept: sitovy-router
          q: "K čemu slouží síťový router?"
          options:
            - "Ukládá všechna videa z YouTube"
            - "Vyrábí elektřinu pro servery"
            - "Směruje data po internetové síti až k cíli"
            - "Blokuje viry v počítači"
          correct: 2
          explain: "Router je chytrá křižovatka - pozná, kam mají data dorazit, a pošle je správným směrem."
        - id: l1s2-i3
          concept: kabel
          q: "Kudy putuje po světě naprostá většina internetových dat?"
          options:
            - "Přes satelity na obloze"
            - "V kabelech - pod zemí i po dně oceánů"
            - "Rádiovými vlnami mezi vysílači"
            - "Vzduchem přes Wi-Fi mezi městy"
          correct: 1
          explain: "Hodně lidí si myslí, že internet jede přes satelity - ve skutečnosti naprostá většina dat cestuje kabely, i mezi kontinenty."
        - id: l1s2-i4
          concept: wi-fi-router
          q: "Jaký je rozdíl mezi Wi-Fi routerem a síťovým routerem?"
          options:
            - "Žádný, je to stejné zařízení se dvěma jmény"
            - "Wi-Fi router směruje data celým internetem, síťový router je krabička doma"
            - "Wi-Fi router je krabička doma na připojení přes Wi-Fi, síťový router je křižovatka v internetové síti"
            - "Síťový router je novější verze Wi-Fi routeru"
          correct: 2
          explain: "Wi-Fi router máš doma a díky němu se připojíš přes Wi-Fi; síťový router je křižovatka uvnitř internetu, která směruje data až k cíli."
        - id: l1s2-i5
          concept: podmorske-kabely
          q: "Kdo pokládá podmořské internetové kabely na dno oceánu?"
          options: ["Potápěči s lopatami", "Vojenské ponorky", "Speciální lodě", "Roboti řízení servery"]
          correct: 2
          explain: "Podmořské kabely mají silný ochranný plášť a na dno oceánů je pokládají speciální lodě."
      prompts:
        - type: didyouknow
          id: l1s2-p1
          concept: satelit
          text: "Hodně lidí si myslí, že internet funguje hlavně přes satelity na obloze. Ve skutečnosti naprostá většina dat cestuje v kabelech - i přes oceány."
        - type: think
          id: l1s2-p2
          question: "Co kdyby jednoho dne přestaly fungovat všechny podmořské kabely mezi Evropou a Amerikou? Co všechno by přestalo fungovat - a co by naopak jelo dál?"
          handoff: {bot: co-kdyby, minutes: 4}

    - id: seg/l1-decentralizace
      title: "Internet nemá ředitele"
      concepts: [internet, sitovy-router, pocitacova-sit]
      est_min: 7
      blocks:
        - type: text
          html: >-
            <p>Zamysli se: má internet nějaké jedno velké <strong>řídící centrum</strong>? Nebo dokonce
            ředitele, který ho celý ovládá?</p><p>Odpověď zní <strong>NE</strong>. Internet je
            <strong>decentralizovaná</strong> síť - nemá žádné centrum. Servery a datová centra jsou
            rozprostřeny po celém světě. A je to tak schválně:</p><ul><li><strong>Bezpečnost:</strong>
            kdyby existovalo jedno centrum a někdo ho zničil, přestal by fungovat internet na celém
            světě.</li><li><strong>Rychlost:</strong> jedno centrum by nestíhalo zpracovávat požadavky
            miliard lidí - internet by byl strašně pomalý.</li></ul><p>A co kdyby někdo <strong>překopl
            internetový kabel</strong> mezi Prahou a Brnem? Došla by zpráva z Brna kamarádce v Praze?
            <strong>ANO, došla!</strong> Data mohou k cíli putovat různými cestami - routery umí najít
            <strong>objížďku</strong>, podobně jako navigace v autě, když je na silnici uzavírka.</p>
        - type: figure
          src: "pbook/assets/svg/1H_prezentace_L/page-17.svg"
          alt: "Mapa Česka: přímý kabel mezi Prahou a Brnem je přerušený, data putují objízdnou trasou přes jiný router."
          caption: "Překopnutý kabel nevadí - routery pošlou data objížďkou."
      items:
        - id: l1s3-i1
          concept: internet
          q: "Co znamená, že je internet decentralizovaný?"
          options:
            - "Že ho řídí jedna velká firma"
            - "Že nemá žádné jedno řídící centrum"
            - "Že funguje jen ve velkých městech"
            - "Že je uložený na jednom obřím serveru"
          correct: 1
          explain: "Internet nemá centrum ani ředitele - servery a routery jsou rozprostřeny po celém světě, což ho dělá odolným a rychlým."
        - id: l1s3-i2
          concept: sitovy-router
          q: "Někdo překopne internetový kabel mezi Prahou a Brnem. Dojde tvoje zpráva z Brna kamarádce do Prahy?"
          options:
            - "Ne, dokud kabel neopraví, zpráva nedojde"
            - "Dojde, ale až za několik dní"
            - "Ne, zprávy mezi Prahou a Brnem přestanou fungovat úplně"
            - "Ano, routery pošlou data jinou cestou (objížďkou)"
          correct: 3
          explain: "Data mohou putovat různými cestami - routery umí najít objížďku jako navigace v autě při uzavírce."
        - id: l1s3-i3
          concept: internet
          q: "Proč by bylo nebezpečné, kdyby internet měl jedno řídící centrum?"
          options:
            - "Centrum by spotřebovalo příliš mnoho elektřiny"
            - "Jeho zničení by vyřadilo internet na celém světě a nestíhalo by požadavky miliard lidí"
            - "Nikdo by nevěděl, kde centrum stojí"
            - "Bylo by příliš drahé na postavení"
          correct: 1
          explain: "Jedno centrum by bylo slabým místem: po zničení by přestal fungovat internet všude a navíc by nestíhalo miliardy požadavků - internet by byl pomalý."
        - id: l1s3-i4
          concept: pocitacova-sit
          q: "Co je počítačová síť?"
          options:
            - "Jiné jméno pro internet"
            - "Program na hlídání virů"
            - "Soustava propojených počítačových zařízení, která nemusí být připojena k internetu"
            - "Seznam všech IP adres na světě"
          correct: 2
          explain: "Počítačová síť je soustava zařízení propojených kabely - a nemusí být vůbec připojená k internetu. Internet je pak celosvětová síť takových sítí."
        - id: l1s3-i5
          concept: sitovy-router
          q: "K čemu přirovnáváme to, že routery umí najít náhradní cestu pro data?"
          options:
            - "K navigaci v autě, která při uzavírce najde objížďku"
            - "K výtahu v paneláku"
            - "Ke skládání puzzle"
            - "K tisknutí fotografie"
          correct: 0
          explain: "Když je nějaká cesta přerušená, routery pošlou data objížďkou - stejně jako navigace v autě při uzavírce silnice."
      prompts:
        - type: try
          id: l1s3-p1
          task: "Zkontroluj, co sis zapamatoval(a): přiřaď zpaměti k pojmům správné vysvětlení - server, datové centrum, Wi-Fi router, síťový router. Vysvětlení: 1. Prostor, kde se nachází velké množství serverů. 2. Počítač, kde je uloženo velké množství dat a který poskytuje nějaké služby. 3. Po internetové síti směruje data až k cíli. 4. Zařízení, které ti umožňuje připojit se přes Wi-Fi."
          answer: "server = 2 (počítač s daty a službami), datové centrum = 1 (prostor s mnoha servery), Wi-Fi router = 4 (připojení přes Wi-Fi), síťový router = 3 (směruje data k cíli)."
