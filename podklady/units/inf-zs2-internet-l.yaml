            - "V lese se připojit vůbec nejde"
          correct: 1
          explain: "V přírodě není Wi-Fi ani kabel, ale mobilní signál z BTS vysílačů tam většinou dosáhne."
        - id: l2s4-i2
          concept: bezdratove-pripojeni
          q: "Která dvojice připojení je bezdrátová?"
          options:
            - "Wi-Fi a mobilní data"
            - "Kabel a Wi-Fi"
            - "Kabel a mobilní data"
            - "Jen kabel"
          correct: 0
          explain: "Bezdrátové připojení nepotřebuje žádný kabel ani drát - patří sem Wi-Fi, mobilní data i satelit. Kabel naopak připojí zařízení do sítě fyzicky."
        - id: l2s4-i3
          concept: speedtest
          q: "Co zjistíš pomocí speedtestu?"
          options:
            - "Sílu svého hesla k Wi-Fi"
            - "Počet zařízení připojených k routeru"
            - "Rychlost svého připojení k internetu"
            - "Stáří svého routeru"
          correct: 2
          explain: "Speedtest je aktivita, kterou otestuješ rychlost svého připojení - důležitý je hlavně údaj download (kolik dat za sekundu umíš přijmout)."
        - id: l2s4-i4
          concept: wi-fi
          q: "Jaká je hlavní nevýhoda Wi-Fi?"
          options:
            - "Nefunguje na mobilních telefonech"
            - "Má krátký dosah a snadno se ruší"
            - "Potřebuje SIM kartu s předplacenými daty"
            - "Je ze všech připojení nejpomalejší"
          correct: 1
          explain: "Wi-Fi je pohodlná, protože nepotřebuje kabel - ale signál má krátký dosah a snadno se ruší, třeba zdmi."
        - id: l2s4-i5
          concept: kabel
          q: "Potřebuješ co nejspolehlivější připojení počítače pro online výuku. Co zvolíš?"
          options:
            - "Satelit"
