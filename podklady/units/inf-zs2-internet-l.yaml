    # ── L3: Co o nás ví internet? ─────────────────────────────────────────────
    - id: seg/l3-pakety
      title: "Dinosaurus v náklaďácích aneb jak cestují data"
      concepts: [paket, ip-adresa, ip-adresa-odesilatele, sitovy-router]
      est_min: 6
      blocks:
        - type: text
          html: >-
            <p>Představ si, že pracuješ v muzeu a máš poslat obří kostru dinosaura do muzea v jiném městě.
            Do jednoho náklaďáku se celá nevejde a poškodit se nesmí. Co uděláš?</p><ul><li>Uděláš si
            <strong>plánek</strong>, jak kostra vypadá složená.</li><li><strong>Očísluješ</strong>
            jednotlivé kosti.</li><li>Uložíš je do <strong>označených krabic</strong> a naložíš do několika
            náklaďáků.</li></ul><p>A tady je fígl: náklaďáky <strong>nemusí jet stejnou cestou</strong> ani
            dorazit ve správném pořadí. Hlavně že dojedou všechny — podle plánku pak kostru zase složíš.</p>
        - type: figure
          src: "pbook/assets/svg/3H_prezentace_L/page-03.svg"
          alt: "Schéma dvou náklaďáků vezoucích části kostry dinosaura z jednoho muzea do druhého po různých trasách."
          caption: "Každý náklaďák může jet jinudy — v cíli se kostra stejně složí."
        - type: text
          html: >-
            <p>Úplně stejně to funguje s daty na internetu. Když posíláš kamarádovi fotku, tvoje zařízení
            ji <strong>rozloží na malé kousky</strong>, kterým říkáme <strong>pakety</strong>. Každý paket
            je očíslovaný, cestuje sítí klidně jinou cestou než ostatní a v kamarádově zařízení se všechny
            zase složí do původní fotky.</p><p>Čím větší je to, co posíláš, tím víc paketů vznikne — video
            se proto obvykle rozdělí na víc paketů než fotka a fotka na víc než krátká zpráva.</p>
        - type: figure
          src: "pbook/assets/svg/3H_prezentace_L/page-04.svg"
          alt: "Ilustrace telefonu odesílajícího obrázek rozdělený do očíslovaných krabiček (paketů), z nichž každá nese část obrázku jako dílek skládačky."
          caption: "Obrázek se před odesláním rozdělí na očíslované pakety — každý nese jeden dílek skládačky."
        - type: text
          html: >-
            <p>Jak je ale možné, že pakety dorazí do správného zařízení, a ne třeba k sousedovi? Každé
            zařízení na internetu má svou adresu — říká se jí <strong>IP adresa</strong>. Podle ní routery
            (chytré křižovatky z minulých lekcí) poznají, kam mají který paket poslat. Proto je IP adresa
            odesílatele i příjemce <strong>součástí každého paketu</strong>.</p>
      items:
        - id: l3s1-i1
          concept: paket
          q: "Co je to paket?"
          options:
            - "Malý kousek dat, na které se rozdělí to, co posíláme po internetu"
            - "Speciální kabel pro rychlý internet"
            - "Program, který blokuje reklamy"
            - "Krabice, ve které se prodávají routery"
          correct: 0
          explain: "Vše, co po internetu posíláme, se rozloží na malé očíslované kousky — pakety — a v cíli se zase složí."
        - id: l3s1-i2
          concept: paket
          q: "Musí všechny pakety jedné fotky cestovat stejnou cestou?"
          options:
            - "Ano, jinak by se fotka poškodila"
            - "Ano, ale jen o víkendu"
            - "Ne, každý paket může jet jinudy a v cíli se vše složí podle čísel"
            - "Ne, protože fotka se posílá vždy jako jeden kus"
          correct: 2
          explain: "Stejně jako náklaďáky s kostrou dinosaura — nezáleží na cestě ani pořadí, důležité je, že dorazí všechny."
        - id: l3s1-i3
          concept: ip-adresa
          q: "K čemu slouží IP adresa?"
          options:
            - "Určuje, jak rychlý má kdo internet"
            - "Je to heslo k domácí Wi-Fi"
            - "Je to jméno webové stránky"
            - "Je to adresa zařízení, podle které routery poznají, kam poslat pakety"
          correct: 3
          explain: "Každé zařízení na internetu má svou IP adresu — díky ní dorazí data právě tobě, a ne sousedovi."
        - id: l3s1-i4
          concept: paket
          q: "Rozdělí se video obvykle na víc paketů než fotka?"
          options:
            - "Ne, všechno se dělí na stejný počet paketů"
            - "Většinou ano, protože video bývá větší než fotka"
            - "Ne, video se na pakety nedělí"
            - "Ano, ale jen když je natočené na mobil"
          correct: 1
          explain: "Čím větší data, tím víc paketů — video bývá větší než fotka, i když výjimky existují."
        - id: l3s1-i5
          concept: ip-adresa-odesilatele
          q: "Proč paket vždy obsahuje i IP adresu odesílatele?"
          options:
            - "Aby byl paket těžší a nedal se ukrást"
            - "Aby se vědělo, odkud byl poslán — a kam má dorazit odpověď"
            - "Aby paket cestoval rychleji"
            - "Neobsahuje ji, stačí adresa příjemce"
          correct: 1
          explain: "IP adresa odesílatele je součástí každého paketu — router díky ní ví, odkud paket přišel, a odpověď může dorazit zpět do správného zařízení."
        - id: l3s1-i6
          concept: sitovy-router
          q: "Kdo směruje pakety po internetu k jejich příjemci?"
          options:
            - "Servery"
            - "Poskytovatel internetu ručně"
            - "Routery"
            - "Satelity"
          correct: 2
          explain: "Pakety směrují routery — chytré křižovatky sítě. Servery data ukládají a poskytují služby, ale pakety po cestě nesměrují."
      prompts:
        - type: try
          id: l3s1-p1
          task: "Co je pravda? U každého tvrzení si nejdřív tipni VŽDY / SPÍŠE ANO / NE: 1. Paket obsahuje IP adresu odesílatele. 2. Delší zpráva bude mít stejně paketů jako kratší. 3. Všechny pakety jedné zprávy musí cestovat stejnými routery. 4. Video bude rozděleno do více paketů než obrázek. 5. Pakety vždy přijdou už ve správném pořadí. 6. Pakety jsou po internetu směrovány servery."
          answer: "1. VŽDY (jinak by odpověď netrefila zpět), 2. NE (delší zpráva = víc paketů), 3. NE (každý může jet jinudy), 4. SPÍŠE ANO (většinou ano, záleží na velikosti souborů), 5. NE (pořadí se srovná až v cíli podle čísel), 6. NE (směrují je routery, ne servery)."
          to_item_pool: true
        - type: think
          id: l3s1-p2
          question: "Co kdyby se jeden náklaďák s kostmi — tedy jeden paket — cestou ztratil? Co by se muselo stát, aby fotka u kamaráda nakonec vypadala celá?"
          handoff: {bot: co-kdyby, minutes: 3}

    - id: seg/l3-kdo-plati
      title: "Kdo platí internet?"
      concepts: [poskytovatel-internetu, internet, datova-stopa]
      est_min: 4
      blocks:
        - type: text
          html: >-
            <p>Internet vypadá, že je zadarmo — ale není. Kabely někdo musel zakopat, routery a servery
            někdo musí napájet a udržovat. Neexistuje ale žádný „ředitel internetu“, kterému by všichni
            platili.</p><ul><li>Za <strong>připojení</strong> platí (většinou tvoji rodiče) tzv.
            <strong>poskytovatelům internetu</strong> — firmám jako O2, T-Mobile nebo Vodafone. I „internet
            zdarma“ v kavárně někdo platí — majitel kavárny.</li><li>Spousta webových stránek se zase živí
            <strong>reklamou</strong>: firmy platí za to, že se na stránce ukáže reklama na jejich zboží.
            Proto je pro stránky výhodné, když na nich trávíš hodně času.</li></ul>
        - type: note
          html: "Když se ti nějaká stránka nebo aplikace tváří jako úplně zdarma, často „platíš“ jinak — svou pozorností u reklam a informacemi o tom, co tě zajímá."
      items:
        - id: l3s2-i1
          concept: poskytovatel-internetu
          q: "Kdo platí internet?"
          options:
            - "Nikdo, internet je úplně zadarmo"
            - "Ředitel internetu, kterému všichni posílají peníze"
            - "Platí se poskytovatelům připojení a hodně stránek platí reklamy"
            - "Jen školy a úřady"
          correct: 2
          explain: "Za připojení se platí poskytovatelům internetu (např. O2, Vodafone) a spousta stránek se financuje z reklam — žádný ředitel internetu neexistuje."
        - id: l3s2-i2
          concept: internet
          q: "Existuje „ředitel internetu“, kterému všichni uživatelé posílají peníze?"
          options:
            - "Ano, sídlí v Americe"
            - "Ne — internet nikdo nevlastní, platí se poskytovatelům připojení a provoz hradí různé firmy"
            - "Ano, volí se každé čtyři roky"
            - "Ano, je jím vynálezce internetu"
          correct: 1
          explain: "Internet je celosvětová síť bez centra a ředitele. Platí se za připojení poskytovatelům; kabely, routery a servery provozují různé firmy."
        - id: l3s2-i3
          concept: poskytovatel-internetu
          q: "Kdo platí „internet zdarma“ v kavárně?"
          options:
            - "Nikdo, Wi-Fi v kavárně je opravdu zadarmo"
            - "Hosté zvláštním poplatkem u vstupu"
            - "Stát ze společných daní"
            - "Majitel kavárny — platí za připojení poskytovateli internetu"
          correct: 3
          explain: "I „internet zdarma“ někdo platí: majitel kavárny platí poskytovateli internetu a hostům připojení nabízí jako službu."
        - id: l3s2-i4
          concept: datova-stopa
          q: "Stránka se tváří jako úplně zdarma. Čím jí často ve skutečnosti „platíš“?"
          options:
            - "Svou pozorností u reklam a informacemi o tom, co tě zajímá"
            - "Penězi z účtu rodičů"
            - "Rychlostí svého připojení"
            - "Ničím, provoz stránek nic nestojí"
          correct: 0
          explain: "Spousta stránek se živí reklamou — čím víc času na nich trávíš a čím víc o tobě vědí, tím víc vydělají. „Platíš“ tedy pozorností a svými daty."
      prompts:
        - type: think
          id: l3s2-p1
          question: "Vadilo by ti platit za oblíbenou aplikaci měsíční poplatek, kdyby za to neukazovala žádné reklamy a nesbírala data o tom, co tě zajímá? Která „cena“ je podle tebe férovější?"
          handoff: {bot: argumentacni-partner, minutes: 4}

    - id: seg/l3-cookies
      title: "Cookies: šatnový lístek internetu"
      concepts: [cookies]
      est_min: 5
      blocks:
        - type: text
          html: >-
            <p>Určitě jsi už na nějaké stránce klikal(a) na tlačítko <strong>„Přijmout vše“</strong>
            v okně o <strong>cookies</strong>. Co se tím vlastně stane?</p><p>Funguje to podobně jako šatna
            v divadle: kabát odevzdáš, dostaneš <strong>lístek s číslem</strong> a druhý lístek se stejným
            číslem zůstane u kabátu. Díky tomu se pozná, který kabát je tvůj. Cookie je takový lístek pro
            webovou stránku — malý soubor uložený v tvém zařízení. Když se na stránku vrátíš, server podle
            něj <strong>pozná, že jsi to zase ty</strong> (přesněji: tvoje zařízení).</p><p>Server si pak
            o tobě může ukládat různé údaje: na co klikáš, co máš v nákupním košíku, jaké máš herní skóre
            nebo jaký jazyk sis nastavil(a).</p>
      items:
        - id: l3s3-i1
          concept: cookies
          q: "Co se stane, když na stránce potvrdíš cookies?"
          options:
            - "Do tvého zařízení se uloží malý soubor a stránka tě příště pozná"
            - "Stránka se navždy zablokuje"
            - "Smaže se historie vyhledávání"
            - "Počítač se zrychlí"
          correct: 0
          explain: "Cookie funguje jako šatnový lístek — podle uloženého souboru server pozná, že přišlo zase tvoje zařízení."
        - id: l3s3-i2
          concept: cookies
          q: "K čemu přirovnáváme fungování cookies?"
          options:
            - "Ke stopám ve sněhu"
            - "K lístku ze šatny v divadle"
            - "K zahradní hadici"
            - "Ke kostře dinosaura"
          correct: 1
          explain: "Jako v šatně: jeden lístek s číslem máš ty, druhý zůstane u kabátu. Podle cookie server spáruje tvou návštěvu s tím, co si o tobě dřív uložil."
        - id: l3s3-i3
          concept: cookies
          q: "Co si o tobě server díky cookies může pamatovat?"
          options:
            - "Jen tvoje jméno a adresu bydliště"
            - "Tvoje známky ve škole"
            - "Na co klikáš, obsah nákupního košíku, herní skóre nebo nastavený jazyk"
            - "Nic — cookies jsou jen ozdoba stránky"
          correct: 2
          explain: "Server si díky cookies ukládá např. na co klikáš, co máš v košíku, jaké máš skóre ve hře nebo jaký jazyk sis nastavil(a)."
        - id: l3s3-i4
          concept: cookies
          q: "Koho přesně server podle cookie „pozná“, když se na stránku vrátíš?"
          options:
            - "Tebe osobně podle obličeje"
            - "Tvoji školu"
            - "Tvého poskytovatele elektřiny"
            - "Tvoje zařízení"
          correct: 3
          explain: "Server nepozná tebe osobně — pozná tvoje zařízení, ve kterém je cookie soubor uložený."
      prompts:
        - type: didyouknow
          id: l3s3-p1
          concept: cookies
          text: "Cookies mají i příjemné stránky: e-shop ti podrží zboží v košíku, hra si pamatuje tvoje skóre a stránka jazyk. Zároveň ale někdo sbírá informace o tom, co děláš — obojí je dobré vědět, než klikneš na „Přijmout vše“."
        - type: try
          id: l3s3-p2
          task: "Až příště na nějaké stránce vyskočí okno o cookies, nezavírej ho automaticky: přečti si, co všechno chce stránka ukládat, a podívej se, jaké možnosti kromě „Přijmout vše“ nabízí. Teprve pak se rozhodni."
          answer: "V okně obvykle najdeš, jaké údaje se budou ukládat a k čemu. Kromě „Přijmout vše“ bývá i možnost odmítnout nebo povolit jen nezbytné cookies — rozhodnutí je na tobě."
          to_item_pool: true

    - id: seg/l3-stopa
      title: "Tvoje digitální stopa"
      concepts: [datova-stopa, personalizace]
      est_min: 8
      blocks:
        - type: text
          html: >-
            <p>I když cookies nepotvrdíš, něco po tobě na internetu zůstává. Představ si, že se projdeš
            čerstvě napadaným sněhem — zůstanou po tobě stopy. Stejné je to se vším, co na internetu děláš:
            fotky, lajky, komentáře, vyhledávání, navštívené stránky. Říkáme tomu <strong>digitální
            (datová) stopa</strong>.</p><p>Servery z těchto stop <strong>odhadují</strong>, co jsi za
            člověka a co by tě mohlo zajímat — a podle toho ti ukazují reklamy a příspěvky. Pozor: jsou to
            jen odhady podle pravděpodobnosti, takže se klidně mohou plést.</p>
        - type: figure
          src: "pbook/assets/svg/3H_prezentace_L/page-10.svg"
          alt: "Vyhledávač Google s historií vyhledávání: je křeček vhodný k dítěti, nejlepší zš v praze, jak velkou klec potřebuji pro křečka."
          caption: "Historie vyhledávání neznámého člověka — co se z ní dá odhadnout?"
        - type: figure
          src: "pbook/assets/svg/3H_prezentace_L/page-12.svg"
          alt: "Vennův diagram se dvěma překrývajícími se poli nadepsanými výhody a nevýhody, s vybarveným průnikem uprostřed."
          caption: "Do průniku patří věci, které jsou výhodou i nevýhodou zároveň — třeba reklama „na míru“."
        - type: note
          html: "Cílem není se internetu bát, ale vědět, co po tobě zůstává. Kdo o své stopě ví, může se rozhodovat chytře — třeba co sdílet a co ne."
      items:
        - id: l3s4-i1
          concept: datova-stopa
          q: "Co je digitální stopa?"
          options:
            - "Otisk prstu na displeji telefonu"
            - "Speciální aplikace na sledování polohy"
            - "Porucha internetu po bouřce"
            - "Všechno, co po nás na internetu zůstává: fotky, lajky, vyhledávání, kliknutí"
          correct: 3
          explain: "Jako stopy ve sněhu — vše, co na internetu děláme, za námi zanechává stopu, ze které servery odhadují, co nás zajímá."
        - id: l3s4-i2
          concept: datova-stopa
          q: "Servery odhadují z historie vyhledávání, co nás zajímá. Mohou se splést?"
          options:
            - "Ne, servery vědí všechno jistě"
            - "Ano, odhadují jen podle pravděpodobnosti, ne s jistotou"
            - "Ne, protože odhady kontrolují lidé"
            - "Ano, ale jen u dospělých"
          correct: 1
          explain: "Server volí nejpravděpodobnější variantu — třeba že si hledající chce koupit křečka — ale jistotu nemá a klidně se plete."
        - id: l3s4-i3
          concept: personalizace
          q: "Co je personalizace?"
          options:
            - "Přizpůsobení toho, co na internetu vidíme, podle toho, co jsme tam dřív dělali"
            - "Nastavení nového hesla"
            - "Zrychlení internetového připojení"
            - "Smazání historie prohlížeče"
          correct: 0
          explain: "Personalizace znamená, že se obsah (reklamy, příspěvky, doporučená videa) přizpůsobuje podle naší dřívější činnosti na internetu."
        - id: l3s4-i4
          concept: datova-stopa
          q: "Zanecháváš datovou stopu, i když cookies nepotvrdíš?"
          options:
            - "Ne, bez cookies po mně na internetu nic nezůstává"
            - "Jen o víkendech"
            - "Ano — servery i tak vidí, co na nich děláme"
            - "Jen na sociálních sítích"
          correct: 2
          explain: "Potvrzením cookies se o nás sbírá víc informací, ale i bez nich servery vědí, co na nich děláme — stopa jako ve sněhu zůstává vždy."
        - id: l3s4-i5
          concept: datova-stopa
          q: "Co z následujícího patří do tvé datové stopy?"
          options:
            - "Barva tvého pokoje"
            - "Lajky, komentáře a to, co vyhledáváš"
            - "Tvoje dnešní svačina"
            - "Počasí za oknem"
          correct: 1
          explain: "Datová stopa je záznam o tom, co děláme na internetu — co lajkujeme, komentujeme, vyhledáváme, na co klikáme. Věci mimo internet do ní nepatří."
        - id: l3s4-i6
          concept: personalizace
          q: "Které stránky vidí všichni uživatelé (skoro) stejně?"
          options:
            - "Funkce „Objevujte“ na Instagramu"
            - "E-shop s doporučeným zbožím"
            - "Reklamy na sociální síti"
            - "Jízdní řády nebo stránky školy"
          correct: 3
          explain: "Obsah se nám přizpůsobuje téměř všude — na sociálních sítích, v e-shopech i ve zpravodajství. Stránky jako jízdní řády nebo web školy ale vidí všichni stejně."
      prompts:
        - type: try
          id: l3s4-p1
          task: "Detektiv křeček: prohlédni si historii vyhledávání na obrázku („je křeček vhodný k dítěti“, „nejlepší zš v praze“, „jak velkou klec potřebuji pro křečka“) a zkus písemně odpovědět: 1. Co všechno by se o tomto člověku dalo odhadnout a z čeho to usuzuješ? 2. Jaké reklamy by se mu asi začaly ukazovat? Nakonec se zamysli: dá se něco z toho tvrdit jistě?"
          answer: "Dá se odhadnout, že člověk zvažuje pořízení křečka a řeší základní školu v Praze — může to být rodič, ale i učitel(ka) nebo někdo jiný. Reklamy by se mu asi ukazovaly na klece, krmivo a chovatelské potřeby. Jistě ale nevíme nic — a přesně tak, jen s pravděpodobností, uvažují i servery."
          to_item_pool: true
        - type: think
          id: l3s4-p2
          question: "Vzpomeň si na svoje fotky, lajky a vyhledávání. Jak si tě internet asi „představuje“? V čem se jeho odhad nejspíš trefí — a v čem se úplně plete? A jaké výhody a nevýhody sbírání dat o tobě má?"
          handoff: {bot: zvedavy-mimon, minutes: 5}

    # ── L4: Velké opakování ───────────────────────────────────────────────────
    - id: seg/l4-opakovani
      title: "Zopakuj si pojmy a zahraj si Bingo"
      concepts: [internet, hacker, bezdratove-pripojeni, pozadavek-na-server, ip-adresa-odesilatele, satelit, wi-fi]
      est_min: 25
      blocks:
        - type: text
          html: >-
            <p><strong>Jak vypadá internet?</strong> <strong>Internet</strong> je celosvětová počítačová
            síť, která nemá žádné centrum ani ředitele — je <strong>decentralizovaná</strong>. Skládá se
            z menších sítí: <strong>počítačová síť</strong> je soustava zařízení propojených kabely a
            nemusí být ani připojená k internetu. Služby nám na internetu poskytují <strong>servery</strong>
            — počítače, které ukazují weby nebo ukládají fotky. Když jich stojí mnoho pohromadě, říkáme
            tomu místu <strong>datové centrum</strong>; typicky patří velké firmě, třeba Microsoftu nebo
            Googlu.</p><p>Když tvůj mobil pošle serveru <strong>požadavek na server</strong> (třeba „ukaž
            mi video“), informace putuje rozdělená na malé kousky — <strong>pakety</strong>. Každý paket
            musí nést <strong>IP adresu příjemce</strong> (aby ho <strong>síťový router</strong>, chytrá
            křižovatka internetu, poslal správným směrem) a <strong>IP adresu odesílatele</strong> (aby se
            vědělo, odkud přišel). <strong>IP adresa</strong> je jedinečná adresa každého zařízení v síti.
            Mezi kontinenty putují data <strong>podmořskými kabely</strong>.</p>
        - type: text
          html: >-
            <p><strong>Jak se připojujeme?</strong> Doma se nejčastěji připojíš přes <strong>Wi-Fi</strong>
            — signál vysílá <strong>Wi-Fi router</strong>. Venku ti poslouží <strong>mobilní data</strong>:
            mobilní signál vysílá věž <strong>BTS</strong> a do mobilní sítě tě pustí <strong>SIM
            karta</strong>, malá kartička od operátora. Ze svého mobilu můžeš zapnout <strong>hotspot</strong>
            a pustit na internet i další lidi. Wi-Fi i mobilní data jsou <strong>bezdrátové připojení</strong>
            — nepotřebuješ žádný drát. Naopak <strong>kabel</strong> připojí tvoje zařízení do sítě fyzicky
            a funguje i na velkou vzdálenost. Existuje i připojení přes <strong>satelit</strong> ve vesmíru,
            ale to není běžné. Tvou domácí síť připojuje k internetu firma zvaná <strong>poskytovatel
            internetu</strong>. Rychlost svého připojení si můžeš změřit aktivitou <strong>speedtest</strong>.</p>
        - type: text
          html: >-
            <p><strong>Co po nás na internetu zůstává?</strong> Všechno, co na internetu děláš — co
            lajkuješ, na co klikáš, co komentuješ — tvoří tvou <strong>datovou stopu</strong>. Servery si
            o tobě ukládají malé soubory <strong>cookies</strong>, a díky nim ti pak přizpůsobují obsah —
            tomu se říká <strong>personalizace</strong>. A pozor na pojem <strong>hacker</strong>: to je
            člověk, který dokáže získat informace nebo služby bez patřičného oprávnění.</p>
        - type: note
          html: "Tučné pojmy jsou přesně ty, ze kterých se hraje Bingo i závěrečný kvíz. Když si u některého nejsi jistý/á, vrať se k lekcím 1 až 3."
        - type: activity
          html: >-
            <p><strong>Jak hrát Bingo doma:</strong></p><ul><li>Vytiskni si (nebo nakresli na papír)
            mřížku 3 × 3 a do každého z devíti políček napiš jeden pojem z nabídky na pracovním listu
            (server, síťový router, datové centrum, internet, BTS, cookies, datová stopa, IP adresa, paket,
            satelit, mobilní data, Wi-Fi, bezdrátové připojení, kabel, personalizace, Wi-Fi router,
            speedtest, poskytovatel internetu, hacker, hotspot, SIM karta, síť, podmořské kabely, požadavek
            na server, IP adresa příjemce, IP adresa odesílatele).</li><li>Druhý hráč čte nahlas
            <strong>vysvětlení</strong> pojmů v náhodném pořadí (definice najde v tomto segmentu — pojmy
            jsou tučně) a pojem samotný neprozrazuje.</li><li>Když si myslíš, že pojem odpovídající
            vysvětlení máš v mřížce, škrtni ho nebo barevně označ.</li><li>Po chvíli čtenář prozradí,
            o který pojem šlo — zkontrolujte, jestli jsi škrtal/a správně, a klidně proberte, proč jiná
            odpověď nesedí.</li><li>Vyhráváš, když spojíš tři správně škrtnutá políčka v řadě — vodorovně,
            svisle nebo úhlopříčně. Pak si role vyměňte a zahrajte si znovu.</li></ul>
        - type: figure
          src: "pbook/assets/svg/4H_pracovni_list_L/page-01.svg"
          alt: "Pracovní list s prázdnou mřížkou 3 krát 3 na Bingo a seznamem pojmů k vepsání do políček"
          caption: "Herní mřížka na Bingo — do každého políčka vepiš jeden pojem z nabídky."
      items:
        - id: l4s1-i1
          concept: hacker
          q: "Kdo je hacker?"
          options:
            - "Člověk, který dokáže získat informace nebo služby bez patřičného oprávnění"
            - "Opravář počítačů"
            - "Správce školní počítačové sítě"
            - "Prodejce routerů"
          correct: 0
          explain: "Hacker je člověk, který dokáže získat informace nebo služby bez patřičného oprávnění — i proto je dobré hlídat si svou datovou stopu a hesla."
        - id: l4s1-i2
          concept: bezdratove-pripojeni
          q: "Co znamená bezdrátové připojení?"
          options:
            - "Připojení bez hesla"
            - "Připojení zdarma"
            - "Připojení jen pro mobilní telefony"
            - "Připojení, ke kterému nepotřebuješ žádný kabel nebo drát"
          correct: 3
          explain: "Bezdrátové připojení funguje bez kabelu či drátu — patří sem Wi-Fi, mobilní data i satelit."
        - id: l4s1-i3
          concept: pozadavek-na-server
          q: "Jak se nazývá úkol, který serveru pošle tvoje zařízení (třeba „ukaž mi video“)?"
          options: ["Odpověď", "Požadavek na server", "Personalizace", "Hotspot"]
          correct: 1
          explain: "Požadavek na server je úkol, který server dostane od našeho zařízení — server ho splní a pošle odpověď."
        - id: l4s1-i4
          concept: ip-adresa-odesilatele
          q: "K čemu v paketu slouží IP adresa odesílatele?"
          options:
            - "Router díky ní ví, odkud byl paket poslán"
            - "Určuje rychlost paketu"
            - "Je to tajné heslo paketu"
            - "Říká, jak je paket velký"
          correct: 0
          explain: "IP adresa odesílatele je řada číslic, kterou musí paket obsahovat, aby router věděl, odkud byl poslán."
        - id: l4s1-i5
          concept: satelit
          q: "Co je satelit?"
          options:
            - "Kabel spojující kontinenty"
            - "Zařízení ve vesmíru — díky němu funguje třeba GPS a výjimečně i připojení k internetu"
            - "Vysílač mobilního signálu na střeše domu"
            - "Aplikace na navigaci"
          correct: 1
          explain: "Satelit je zařízení ve vesmíru, díky kterému můžeme využívat např. GPS anebo se připojit k internetu — to ale není běžné."
        - id: l4s1-i6
          concept: wi-fi
          q: "Co je Wi-Fi?"
          options:
            - "Totéž co internet"
            - "Připojení kabelem"
            - "Připojení k internetu pomocí signálu, který vysílá router — typicky doma"
            - "Mobilní síť operátora"
          correct: 2
          explain: "Wi-Fi je připojení pomocí signálu z Wi-Fi routeru. Pozor: Wi-Fi není totéž co internet — je to jen jeden ze způsobů, jak se k němu připojit."
      prompts:
        - type: didyouknow
          id: l4s1-p1
          concept: satelit
          text: "Satelity ti pomáhají skoro každý den, i když se přes ně nepřipojuješ k internetu — díky nim funguje třeba GPS, když hledáš cestu v mapách."
        - type: think
          id: l4s1-p2
          question: "Který pojem z celého bloku je podle tebe pro běžný život nejdůležitější? Vyber jeden a obhaj svou volbu — a zkus vyvrátit i protiargumenty."
          handoff: {bot: argumentacni-partner, minutes: 3}

  tutor_configs:
    - id: tc/L2
      bot: pruvodce-ukolem
      goal: "Žák změří rychlost svého připojení k internetu (speedtest.cesnet.cz), interpretuje naměřené hodnoty (především download) a porovná alespoň dva typy připojení; z porovnání vyvodí, které připojení se hodí pro jakou situaci."
      rubric:
        - "Žák provedl vlastní měření a zapsal hodnotu downloadu (případně i upload) včetně typu připojení, přes které měřil."
        - "Žák vysvětlí vlastními slovy, co naměřené číslo znamená (kolik dat za sekundu umí přijmout) a k čemu taková rychlost v praxi stačí."
        - "Žák porovná alespoň dva typy připojení (např. domácí Wi-Fi vs. mobilní data) a rozdíl v naměřených hodnotách okomentuje."
        - "Žák ke každému porovnanému typu připojení uvede situaci, ve které by ho zvolil, a volbu zdůvodní."
      checkpoints:
        - id: c1
          prompt: "Ukaž mi svoje první měření: přes jaké připojení jsi měřil(a) a jaké číslo ti vyšlo u downloadu? Než půjdeme dál — co si myslíš, že ten údaj vlastně říká?"
        - id: c2
          prompt: "Zkus naměřené číslo přeložit do lidské řeči: co ti taková rychlost dovolí dělat pohodlně (video, hry, videohovor) a kde by mohla přestat stačit? Vzpomeň si, co všechno na internetu děláš — u čeho je rychlost nejdůležitější?"
        - id: c3
          prompt: "Teď změř to samé přes jiný typ připojení (mobilní data, hotspot, případně počítač na kabelu). Které vyšlo rychleji — a proč to tak podle tebe je? Napadá tě situace, kdy by ses přesto rozhodl(a) pro to pomalejší?"
      scaffold_level: 2
      notes: "Sokratovský princip: tutor nikdy nesděluje finální řešení ani hodnoty, které má žák naměřit. Vede otázkami, nechává žáka měřit, interpretovat a porovnávat samostatně; nápovědu stupňuje jen při zaseknutí (odkaz na myšlenkovou mapu typů připojení ze segmentu shrnutí)."

