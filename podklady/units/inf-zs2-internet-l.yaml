        explain: "Poskytovatel internetu je firma, která připojí tvou lokální domácí síť k internetu."
      - id: bq-10
        concept: cookies
        q: "Co jsou cookies?"
        options:
          - "viry, které ničí počítač"
          - "hesla uložená v prohlížeči"
          - "malé soubory s informacemi o nás, které si ukládají servery"
