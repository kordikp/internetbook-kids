    # ── L2: Jak se připojíme k internetu? ─────────────────────────────────────
    - id: seg/l2-wifi-router
      title: "Wi-Fi a router: odkud se bere signál"
      concepts: [wi-fi, wi-fi-router, kabel]
      est_min: 7
      blocks:
        - type: text
          html: >-
            <p>Když se doma připojíš k internetu z mobilu, nejspíš to bude přes <strong>Wi-Fi</strong>.
            Ale odkud se Wi-Fi bere? Není jen tak kolem nás &mdash; vysílá ji krabička, které se říká
            <strong>Wi-Fi router</strong> (někdy taky modem).</p><p>Aby router fungoval, nestačí ho jen
            zapnout. Musí být zapojen <strong>dvěma kabely</strong>:</p><ul><li>do <strong>elektřiny</strong>
            &mdash; jako každý spotřebič,</li><li>do <strong>přípojky k internetu</strong> ve zdi &mdash;
            tudy do něj internet vlastně přitéká.</li></ul><p>Notebook nebo stolní počítač můžeš k routeru
            připojit i přímo <strong>síťovým kabelem</strong> &mdash; router na to má vzadu několik portů.</p>
        - type: figure
          src: "pbook/assets/svg/2H_prezentace_L/page-05.svg"
          alt: "Schéma zapojení Wi-Fi routeru: žlutý kabel k notebooku, modrý kabel do internetové přípojky ve zdi a fialový kabel do elektrické zásuvky."
          caption: "Zapojení Wi-Fi routeru: žlutý kabel vede k notebooku, modrý do přípojky k internetu ve zdi a fialový do elektřiny. Barvy kabelů odpovídají barvám portů na routeru."
        - type: note
          html: "Když je router zapojený jen do elektřiny, Wi-Fi síť na mobilu uvidíš a půjde se k ní připojit &mdash; ale žádná stránka se nenačte. Bez kabelu do internetové přípojky router nemá internet co rozdávat."
      items:
        - id: l2s1-i1
          concept: wi-fi-router
          q: "Co všechno musí být u Wi-Fi routeru zapojeno, aby ti doma fungoval internet?"
          options:
            - "Stačí ho zapojit do elektřiny"
            - "Elektřina a kabel do přípojky k internetu ve zdi"
            - "Nic, router funguje na baterie"
            - "Stačí k němu přišroubovat antény"
          correct: 1
          explain: "Router potřebuje dva kabely: napájení z elektřiny a kabel do internetové přípojky, kterou do něj internet přitéká."
        - id: l2s1-i2
          concept: wi-fi-router
          q: "Router je zapojený jen do elektřiny. Co se stane, když se k jeho Wi-Fi připojíš mobilem?"
          options:
            - "Wi-Fi síť vůbec neuvidíš"
            - "Internet pojede úplně normálně"
            - "Připojíš se k Wi-Fi, ale žádná stránka se nenačte"
            - "Mobil se okamžitě vybije"
          correct: 2
          explain: "Wi-Fi síť router vysílá i bez internetu - ale bez kabelu do internetové přípojky nemá internet co rozdávat, takže se nic nenačte."
        - id: l2s1-i3
          concept: wi-fi
          q: "Odkud se doma bere Wi-Fi signál?"
          options:
            - "Je přirozeně všude kolem nás ve vzduchu"
            - "Vysílá ho BTS věž na kopci"
            - "Vytváří ho sám mobil"
            - "Vysílá ho Wi-Fi router (někdy zvaný modem)"
          correct: 3
          explain: "Wi-Fi není jen tak kolem nás - signál vysílá krabička zvaná Wi-Fi router, kterou máš doma."
        - id: l2s1-i4
          concept: kabel
          q: "Jak můžeš připojit notebook k routeru i bez Wi-Fi?"
          options:
            - "Síťovým kabelem do portu na routeru"
            - "Přes satelit"
            - "Vložením SIM karty do notebooku"
            - "Nijak, notebook se připojuje jen bezdrátově"
          correct: 0
          explain: "Router má vzadu několik portů - notebook nebo stolní počítač do něj můžeš zapojit přímo síťovým kabelem."
      prompts:
        - type: try
          id: l2s1-p1
          task: "Prozkoumej domácí Wi-Fi router (nic nevytahuj!): najdi, kolik kabelů do něj vede a kam. Který vede do elektřiny a který do přípojky k internetu? Jakou barvu mají porty vzadu?"
          answer: "Do routeru vedou minimálně dva kabely: jeden do elektrické zásuvky (napájení) a jeden do přípojky k internetu ve zdi. Případné další kabely vedou k počítačům. Porty bývají barevně odlišené, aby se kabely nepletly."
          to_item_pool: true

