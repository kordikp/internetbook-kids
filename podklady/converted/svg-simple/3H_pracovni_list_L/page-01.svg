<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" role="img" lang="cs">
<title>Pracovní list č. 3L – Pakety, IP adresy, digitální stopa</title>
<desc>Pracovní list k lehčí variantě lekce: tabulka tvrzení o paketech (MŮJ TIP / SPRÁVNĚ), úkol nad historií vyhledávání a Vennův diagram výhod a nevýhod sbírání informací.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
<text x="45" y="40" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#555">PRACOVNÍ LIST č.3L</text>
<text x="440" y="40" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#888">jméno:</text>
<line x1="490" y1="43" x2="745" y2="43" stroke="#bbb" stroke-width="1"/>
<text x="45" y="78" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#000">PAKETY, IP ADRESY, DIGITÁLNÍ STOPA</text>
<text x="45" y="112" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">1.</text>
<text x="70" y="112" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">Zapiš do sloupce PŘED, jestli je dané tvrzení vždy pravdivé (VŽDY),</text>
<text x="70" y="131" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">většinou pravdivé (SPÍŠE ANO) nebo není pravdivé (NE):</text>
<g aria-label="Tabulka tvrzení se sloupci MŮJ TIP a SPRÁVNĚ">
<rect x="45" y="155" width="700" height="258" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="495" y1="155" x2="495" y2="413" stroke="#333" stroke-width="1"/>
<line x1="620" y1="155" x2="620" y2="413" stroke="#333" stroke-width="1"/>
<line x1="45" y1="185" x2="745" y2="185" stroke="#333" stroke-width="1.5"/>
<text x="270" y="175" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">TVRZENÍ</text>
<text x="557" y="175" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">MŮJ TIP</text>
<text x="682" y="175" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">SPRÁVNĚ</text>
<text x="60" y="209" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">1.  Paket obsahuje IP adresu odesílatele.</text>
<line x1="45" y1="223" x2="745" y2="223" stroke="#999" stroke-width="0.8"/>
<text x="60" y="247" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">2.  Delší zpráva bude mít stejně paketů jako kratší zpráva.</text>
<line x1="45" y1="261" x2="745" y2="261" stroke="#999" stroke-width="0.8"/>
<text x="60" y="285" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">3.  Všechny pakety jedné zprávy musí cestovat stejnými routery.</text>
<line x1="45" y1="299" x2="745" y2="299" stroke="#999" stroke-width="0.8"/>
<text x="60" y="323" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">4.  Video bude rozděleno do více paketů než obrázek.</text>
<line x1="45" y1="337" x2="745" y2="337" stroke="#999" stroke-width="0.8"/>
<text x="60" y="361" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">5.  Pakety vždy přijdou již ve správném pořadí.</text>
<line x1="45" y1="375" x2="745" y2="375" stroke="#999" stroke-width="0.8"/>
<text x="60" y="399" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">6.  Pakety jsou po internetu směrovány servery.</text>
</g>
<text x="45" y="445" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">2.</text>
<text x="70" y="445" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">Podívejte se na historii vyhledávání jednoho člověka. Odpovězte na otázky níže.</text>
<text x="45" y="485" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#000">a)</text>
<text x="70" y="485" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">Co lze odhadnout z této historie</text>
<text x="70" y="504" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">vyhledávání? A proč?</text>
<g role="img"><title>Historie vyhledávání: je křeček vhodný k dítěti; nejlepší zš v praze; jak velkou klec potřebuji pro křečka</title>
<rect x="375" y="480" width="375" height="145" rx="6" fill="none" stroke="#aaa" stroke-width="1.5"/>
<rect x="390" y="505" width="350" height="40" rx="20" fill="none" stroke="#aaa" stroke-width="1.5"/>
<circle cx="414" cy="525" r="8" fill="none" stroke="#777" stroke-width="2"/><line x1="420" y1="531" x2="428" y2="539" stroke="#777" stroke-width="2"/>
<line x1="434" y1="515" x2="434" y2="535" stroke="#333" stroke-width="1.5"/>
<circle cx="414" cy="561" r="8" fill="none" stroke="#777" stroke-width="1.5"/><path d="M414,556 L414,561 L419,563" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="434" y="566" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#6a3fc0">je křeček vhodný k dítěti</text>
<circle cx="414" cy="586" r="8" fill="none" stroke="#777" stroke-width="1.5"/><path d="M414,581 L414,586 L419,588" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="434" y="591" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#6a3fc0">nejlepší zš v praze</text>
<circle cx="414" cy="611" r="8" fill="none" stroke="#777" stroke-width="1.5"/><path d="M414,606 L414,611 L419,613" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="434" y="616" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#6a3fc0">jak velkou klec potřebuji pro křečka</text>
</g>
<text x="45" y="680" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#000">b)</text>
<text x="70" y="680" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">Jaké reklamy by se tomuto člověku podle</text>
<text x="70" y="699" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">vás měly ukazovat?</text>
<text x="45" y="838" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">3.</text>
<text x="70" y="838" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">Co je dobré a co je špatné na tom, že jsou o nás na internetu sbírány informace?</text>
<g aria-label="Vennův diagram pro zápis výhod a nevýhod, s průnikem uprostřed">
<rect x="45" y="862" width="420" height="220" rx="90" fill="none" stroke="#333" stroke-width="1.5"/>
<rect x="330" y="862" width="420" height="220" rx="90" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="210" y="892" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">výhody</text>
<text x="585" y="892" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">nevýhody</text>
</g>
<text x="45" y="1095" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#888">internet4kids.mff.cuni.cz</text>
<line x1="660" y1="1085" x2="745" y2="1085" stroke="#999" stroke-width="1"/>
<text x="745" y="1098" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#888">1</text>
</svg>
