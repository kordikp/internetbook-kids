<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Závěrečný slide</title>
  <desc>Závěrečný slide s odkazem na web projektu a informacemi o grantech, díky nimž výukové materiály vznikly. Fialové pozadí s mapou světa jako na titulním slidu.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#4b2e83"/>
  <g role="img" aria-label="Stylizovaná mapa světa s růžovými spojnicemi">
    <title>Stylizovaná mapa světa s růžovými obloukovitými spojnicemi mezi uzly — stejné pozadí jako na titulním slidu.</title>
    <ellipse cx="240" cy="150" rx="110" ry="55" fill="#5d3fa0"/>
    <ellipse cx="560" cy="130" rx="90" ry="45" fill="#5d3fa0"/>
    <ellipse cx="760" cy="180" rx="120" ry="60" fill="#5d3fa0"/>
    <path d="M 200 140 Q 400 50 560 120" fill="none" stroke="#f06ba8" stroke-width="3"/>
    <path d="M 560 120 Q 660 70 780 160" fill="none" stroke="#f06ba8" stroke-width="3"/>
    <circle cx="200" cy="140" r="6" fill="#f06ba8"/>
    <circle cx="560" cy="120" r="6" fill="#f06ba8"/>
    <circle cx="780" cy="160" r="6" fill="#f06ba8"/>
  </g>
  <text x="480" y="300" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ffffff">internet4kids.mff.cuni.cz</text>
  <g aria-label="Informace o grantech">
    <text x="480" y="360" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#e8dcff">Výukové materiály vznikly díky grantům:</text>
    <text x="480" y="395" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c9b8ee">GA UK 360322 Multimediální materiály pro výuku informatiky na 2. stupni ZŠ</text>
    <text x="480" y="422" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c9b8ee">GA ČR 22-20771S Internet4Kids – Budování znalostí o internetu:</text>
    <text x="480" y="444" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c9b8ee">perspektiva teorií konceptuální změny</text>
  </g>
  <g aria-label="Loga institucí">
    <text x="60" y="515" font-family="sans-serif" font-size="16" fill="#c9b8ee">Matfyz (MFF UK)</text>
    <text x="240" y="515" font-family="sans-serif" font-size="16" fill="#c9b8ee">Pedagogická fakulta UK</text>
  </g>
</svg>
