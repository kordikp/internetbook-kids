<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Jak byste se připojili k Internetu? (řešení)</title>
  <desc>Řešení otázky ze slidu 2: u každé ze čtyř situací jsou zobrazeny správné typy připojení — mobil doma: Wi-Fi a mobilní data; mobil v lese: jen mobilní data; školní počítač: Wi-Fi a kabel; notebook doma: Wi-Fi a kabel.</desc>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#1a1a2e">Jak byste se připojili k Internetu?</text>
  <g aria-label="Situace se správnými odpověďmi">
    <g aria-label="Situace 1: doma na mobilu — Wi-Fi a mobilní data">
      <rect x="60" y="85" width="190" height="120" fill="#f2f2f2" stroke="#999"/>
      <text x="155" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Doma</text>
      <text x="155" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">na mobilu</text>
      <ellipse cx="155" cy="235" rx="90" ry="22" fill="#fff" stroke="#6c3df4" stroke-width="2"/>
      <text x="155" y="241" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1a1a2e">Wi-Fi + mobilní data</text>
    </g>
    <g aria-label="Situace 2: v lese na mobilu — pouze mobilní data">
      <rect x="270" y="85" width="190" height="120" fill="#f2f2f2" stroke="#999"/>
      <text x="365" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">V lese</text>
      <text x="365" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">na mobilu</text>
      <ellipse cx="365" cy="235" rx="90" ry="22" fill="#fff" stroke="#e0483e" stroke-width="2"/>
      <text x="365" y="241" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1a1a2e">pouze mobilní data</text>
    </g>
    <g aria-label="Situace 3: na školním počítači — Wi-Fi a kabel">
      <rect x="480" y="85" width="190" height="120" fill="#f2f2f2" stroke="#999"/>
      <text x="575" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Na školním</text>
      <text x="575" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">počítači</text>
      <ellipse cx="575" cy="235" rx="90" ry="22" fill="#fff" stroke="#f5a623" stroke-width="2"/>
      <text x="575" y="241" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1a1a2e">Wi-Fi + kabel</text>
    </g>
    <g aria-label="Situace 4: doma na notebooku — Wi-Fi a kabel">
      <rect x="690" y="85" width="190" height="120" fill="#f2f2f2" stroke="#999"/>
      <text x="785" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Doma</text>
      <text x="785" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">na notebooku</text>
      <ellipse cx="785" cy="235" rx="90" ry="22" fill="#fff" stroke="#f5a623" stroke-width="2"/>
      <text x="785" y="241" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1a1a2e">Wi-Fi + kabel</text>
    </g>
  </g>
  <g aria-label="Legenda typů připojení">
    <text x="160" y="380" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1a1a2e">Připojení přes <tspan font-weight="bold">Wi-Fi</tspan></text>
    <text x="470" y="380" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1a1a2e">Připojení přes <tspan font-weight="bold">mobilní data</tspan></text>
    <text x="785" y="380" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1a1a2e">Připojení přes <tspan font-weight="bold">síťový kabel</tspan></text>
    <path d="M 135 340 A 30 30 0 0 1 185 340" fill="none" stroke="#6c3df4" stroke-width="4"/>
    <circle cx="160" cy="350" r="5" fill="#6c3df4"/>
    <line x1="458" y1="352" x2="458" y2="322" stroke="#e0483e" stroke-width="4"/>
    <path d="M 451 330 L 458 318 L 465 330 Z" fill="#e0483e"/>
    <line x1="482" y1="322" x2="482" y2="352" stroke="#e0483e" stroke-width="4"/>
    <path d="M 475 344 L 482 356 L 489 344 Z" fill="#e0483e"/>
    <path d="M 750 348 Q 775 322 800 340" fill="none" stroke="#f5a623" stroke-width="4"/>
    <rect x="798" y="332" width="18" height="15" rx="3" fill="#f5a623"/>
  </g>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">3</text>
</svg>
