<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Podmořské kabely</title>
  <desc>Mapa světa s podmořskými internetovými kabely: červené linie spojují kontinenty přes oceány, červené tečky jsou přípojné body. V kruhovém výřezu fotografie potápěče u podmořského kabelu.</desc>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#2d1b69">Podmořské kabely</text>
  <g role="img" aria-label="Mapa podmořských optických kabelů mezi kontinenty">
    <title>Mapa světa: červené linie podmořských kabelů vedou napříč oceány — hustá síť přes Atlantik mezi Severní Amerikou a Evropou, přes Pacifik do Asie a kolem pobřeží Afriky; červené tečky jsou přípojné body.</title>
    <rect x="90" y="80" width="780" height="360" fill="#eaf3fa" stroke="#999"/>
    <ellipse cx="230" cy="190" rx="90" ry="60" fill="#d9e6d0" stroke="#8aa87e"/>
    <text x="230" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a6b3e">Severní Amerika</text>
    <ellipse cx="300" cy="350" rx="55" ry="55" fill="#d9e6d0" stroke="#8aa87e"/>
    <text x="300" y="355" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a6b3e">Jižní Amerika</text>
    <ellipse cx="520" cy="160" rx="60" ry="40" fill="#d9e6d0" stroke="#8aa87e"/>
    <text x="520" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a6b3e">Evropa</text>
    <ellipse cx="540" cy="310" rx="65" ry="65" fill="#d9e6d0" stroke="#8aa87e"/>
    <text x="540" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a6b3e">Afrika</text>
    <ellipse cx="740" cy="200" rx="100" ry="65" fill="#d9e6d0" stroke="#8aa87e"/>
    <text x="740" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a6b3e">Asie</text>
    <g aria-label="Podmořské kabely (červené linie)">
      <path d="M 310 180 Q 400 150 465 160" fill="none" stroke="#d63a2f" stroke-width="3"/>
      <path d="M 310 200 Q 400 200 470 175" fill="none" stroke="#d63a2f" stroke-width="3"/>
      <path d="M 320 230 Q 420 280 490 300" fill="none" stroke="#d63a2f" stroke-width="3"/>
      <path d="M 545 190 Q 560 240 545 250" fill="none" stroke="#d63a2f" stroke-width="3"/>
      <path d="M 575 150 Q 650 130 685 170" fill="none" stroke="#d63a2f" stroke-width="3"/>
      <path d="M 600 320 Q 680 320 720 260" fill="none" stroke="#d63a2f" stroke-width="3"/>
      <path d="M 165 230 Q 120 350 250 390" fill="none" stroke="#d63a2f" stroke-width="3"/>
      <circle cx="310" cy="180" r="5" fill="#d63a2f"/>
      <circle cx="465" cy="160" r="5" fill="#d63a2f"/>
      <circle cx="490" cy="300" r="5" fill="#d63a2f"/>
      <circle cx="685" cy="170" r="5" fill="#d63a2f"/>
      <circle cx="250" cy="390" r="5" fill="#d63a2f"/>
    </g>
  </g>
  <g role="img" aria-label="Fotografie potápěče u podmořského kabelu">
    <title>Kruhový výřez: potápěč pod vodou u položeného podmořského kabelu — černý kabel se žlutými pruhy na mořském dně.</title>
    <circle cx="160" cy="430" r="70" fill="#bfe0f0" stroke="#555" stroke-width="3"/>
    <path d="M 105 460 Q 160 440 215 460" fill="none" stroke="#222" stroke-width="6"/>
    <path d="M 120 455 l 8 -3 M 150 448 l 8 -2 M 185 450 l 8 2" stroke="#e8b021" stroke-width="3"/>
    <text x="160" y="518" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">potápěč u podmořského kabelu</text>
  </g>
  <text x="480" y="475" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#888">Zdroj: cable data by Greg Mahlknecht, map by Openstreetmap contributors; CC BY-SA 2.0</text>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">8</text>
</svg>
