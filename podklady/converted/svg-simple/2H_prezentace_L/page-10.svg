<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>BTS vysílače</title>
  <desc>Slide o BTS vysílačích: stožár s 5G anténou vysílá signál k uživateli s mobilem; parametry — rychlost 4G cca 60 Mb/s, 5G cca 600 Mb/s, maximální dosah přibližně 5 km.</desc>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#2d1b69">BTS vysílače</text>
  <g role="img" aria-label="Stožár BTS na kopci">
    <title>Kreslený příhradový stožár BTS s cedulkou 5G na zeleném kopci; z antén se šíří žluté vlny signálu.</title>
    <path d="M 40 400 Q 160 300 300 400 L 300 470 L 40 470 Z" fill="#8bc98a"/>
    <line x1="140" y1="380" x2="170" y2="180" stroke="#555" stroke-width="4"/>
    <line x1="200" y1="380" x2="170" y2="180" stroke="#555" stroke-width="4"/>
    <line x1="150" y1="320" x2="192" y2="320" stroke="#555" stroke-width="3"/>
    <line x1="157" y1="265" x2="185" y2="265" stroke="#555" stroke-width="3"/>
    <line x1="150" y1="320" x2="185" y2="265" stroke="#555" stroke-width="2"/>
    <line x1="192" y1="320" x2="157" y2="265" stroke="#555" stroke-width="2"/>
    <rect x="150" y="150" width="40" height="30" rx="4" fill="#fff" stroke="#333"/>
    <text x="170" y="171" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d1b69">5G</text>
  </g>
  <g aria-label="Vlny signálu od vysílače k mobilu">
    <path d="M 230 220 A 180 180 0 0 1 350 320" fill="none" stroke="#e8b021" stroke-width="4"/>
    <path d="M 260 190 A 260 260 0 0 1 430 340" fill="none" stroke="#e8b021" stroke-width="4"/>
    <path d="M 290 160 A 340 340 0 0 1 510 360" fill="none" stroke="#e8b021" stroke-width="4"/>
  </g>
  <g role="img" aria-label="Uživatel s mobilem na kopci">
    <title>Postava s batohem a mobilem na modrém kopci; signál z věže doputuje až k jejímu telefonu.</title>
    <path d="M 660 420 Q 780 330 900 420 L 900 470 L 660 470 Z" fill="#8ab8d8"/>
    <circle cx="780" cy="330" r="14" fill="none" stroke="#333" stroke-width="3"/>
    <line x1="780" y1="344" x2="780" y2="390" stroke="#333" stroke-width="3"/>
    <line x1="780" y1="358" x2="805" y2="348" stroke="#333" stroke-width="3"/>
    <rect x="803" y="336" width="14" height="22" rx="3" fill="none" stroke="#333" stroke-width="2"/>
    <text x="780" y="500" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">uživatel s mobilem</text>
  </g>
  <g aria-label="Parametry BTS">
    <text x="420" y="130" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e">Rychlost přenosu</text>
    <text x="440" y="160" font-family="sans-serif" font-size="19" fill="#1a1a2e">• typ 4G přibližně 60 Mb/s</text>
    <text x="440" y="188" font-family="sans-serif" font-size="19" fill="#1a1a2e">• typ 5G přibližně 600 Mb/s</text>
    <text x="420" y="230" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e">Maximální dosah</text>
    <text x="440" y="260" font-family="sans-serif" font-size="19" fill="#1a1a2e">• přibližně 5 kilometrů</text>
  </g>
  <g aria-label="Fotografie skutečných BTS věží">
    <g role="img"><title>Fotografie příhradového stožáru BTS s anténami proti obloze.</title>
      <circle cx="420" cy="430" r="45" fill="#f2f2f2" stroke="#999"/>
      <path d="M 410 460 L 420 400 L 430 460" fill="none" stroke="#555" stroke-width="3"/>
    </g>
    <g role="img"><title>Fotografie stožáru BTS s anténami.</title>
      <circle cx="530" cy="430" r="45" fill="#f2f2f2" stroke="#999"/>
      <path d="M 520 460 L 530 400 L 540 460" fill="none" stroke="#555" stroke-width="3"/>
    </g>
    <g role="img"><title>Fotografie stožáru BTS s anténami.</title>
      <circle cx="640" cy="430" r="45" fill="#f2f2f2" stroke="#999"/>
      <path d="M 630 460 L 640 400 L 650 460" fill="none" stroke="#555" stroke-width="3"/>
    </g>
    <text x="530" y="505" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">fotografie skutečných BTS věží</text>
  </g>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">10</text>
</svg>
