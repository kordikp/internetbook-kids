<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Wi-Fi router</title>
  <desc>Slide představuje Wi-Fi router: schematická kresba zadní strany routeru s barevně vyznačenými porty (fialový napájecí konektor, modrý WAN port, čtyři žluté LAN porty) a fotografie skutečného routeru.</desc>
  <text x="480" y="56" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#2d1b69">Wi-Fi router</text>
  <g aria-label="Schéma zadní strany Wi-Fi routeru">
    <line x1="390" y1="150" x2="360" y2="90" stroke="#333" stroke-width="6"/>
    <line x1="570" y1="150" x2="600" y2="90" stroke="#333" stroke-width="6"/>
    <rect x="330" y="150" width="300" height="70" rx="10" fill="#e9e9f2" stroke="#333" stroke-width="2"/>
    <circle cx="370" cy="185" r="12" fill="none" stroke="#6a3fb5" stroke-width="4"/>
    <rect x="405" y="170" width="30" height="30" fill="none" stroke="#4a9fd8" stroke-width="4"/>
    <rect x="455" y="170" width="30" height="30" fill="none" stroke="#e8b021" stroke-width="4"/>
    <rect x="495" y="170" width="30" height="30" fill="none" stroke="#e8b021" stroke-width="4"/>
    <rect x="535" y="170" width="30" height="30" fill="none" stroke="#e8b021" stroke-width="4"/>
    <rect x="575" y="170" width="30" height="30" fill="none" stroke="#e8b021" stroke-width="4"/>
    <g aria-label="Popisky portů">
      <line x1="370" y1="200" x2="370" y2="255" stroke="#6a3fb5" stroke-width="2"/>
      <text x="370" y="278" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6a3fb5">napájení</text>
      <line x1="420" y1="205" x2="420" y2="235" stroke="#4a9fd8" stroke-width="2"/>
      <text x="420" y="255" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#3a7fb0">WAN — přípojka k internetu</text>
      <line x1="530" y1="205" x2="530" y2="290" stroke="#e8b021" stroke-width="2"/>
      <text x="530" y="313" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#b5850f">4× LAN — kabelové připojení zařízení</text>
    </g>
  </g>
  <g role="img" aria-label="Fotografie skutečného routeru">
    <title>Fotografie skutečného černého Wi-Fi routeru se třemi anténami.</title>
    <rect x="360" y="360" width="240" height="120" fill="#f2f2f2" stroke="#999"/>
    <rect x="420" y="430" width="120" height="26" rx="5" fill="#333"/>
    <line x1="440" y1="430" x2="430" y2="392" stroke="#333" stroke-width="4"/>
    <line x1="480" y1="430" x2="480" y2="388" stroke="#333" stroke-width="4"/>
    <line x1="520" y1="430" x2="530" y2="392" stroke="#333" stroke-width="4"/>
    <text x="480" y="500" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">Fotografie skutečného Wi-Fi routeru</text>
  </g>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">4</text>
</svg>
