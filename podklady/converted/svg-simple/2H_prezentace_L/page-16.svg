<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Rychlost připojení</title>
  <desc>Aktivita měření rychlosti připojení: žáci pomocí QR kódu otevřou test rychlosti a změří připojení čtyřmi způsoby — přes Wi-Fi router a školní síť, mobilní data, hotspot s daty a hotspot s Wi-Fi.</desc>
  <text x="480" y="56" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#2d1b69">Rychlost připojení</text>
  <g role="img" aria-label="Pozadí s budíkem speedtestu">
    <title>Ztmavená fotografie budíku (rychloměru) speedtestu v pozadí slidu.</title>
    <circle cx="480" cy="300" r="140" fill="#f2f2f2" stroke="#bbb" stroke-width="3"/>
    <path d="M 370 340 A 130 130 0 0 1 590 340" fill="none" stroke="#999" stroke-width="6"/>
    <line x1="480" y1="300" x2="545" y2="230" stroke="#777" stroke-width="5"/>
    <circle cx="480" cy="300" r="8" fill="#777"/>
  </g>
  <g aria-label="QR kód testu rychlosti">
    <rect x="415" y="250" width="130" height="90" fill="#fff8dc" stroke="#b5850f" stroke-width="3"/>
    <text x="480" y="290" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e">QR kód:</text>
    <text x="480" y="315" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1a1a2e">test rychlosti připojení</text>
  </g>
  <g aria-label="Způsoby měření">
    <text x="130" y="440" font-family="sans-serif" font-size="20" fill="#1a1a2e">Měřte postupně:</text>
    <text x="150" y="472" font-family="sans-serif" font-size="19" fill="#1a1a2e">• přes <tspan font-weight="bold">Wi-Fi router</tspan> a <tspan font-weight="bold">školní síť</tspan></text>
    <text x="150" y="500" font-family="sans-serif" font-size="19" fill="#1a1a2e">• přes <tspan font-weight="bold">mobilní data</tspan></text>
    <text x="540" y="472" font-family="sans-serif" font-size="19" fill="#1a1a2e">• přes <tspan font-weight="bold">hotspot + data</tspan></text>
    <text x="540" y="500" font-family="sans-serif" font-size="19" fill="#1a1a2e">• přes <tspan font-weight="bold">hotspot + Wi-Fi</tspan></text>
  </g>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">16</text>
</svg>
