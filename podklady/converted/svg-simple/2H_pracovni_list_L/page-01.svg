<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" role="img" lang="cs">
  <title>Pracovní list č. 2L — Jak se připojíme k internetu?</title>
  <desc>Pracovní list se třemi úkoly: přiřazení typů připojení k situacím (zakroužkování ikon), měření rychlosti speedtestem se zápisem do tabulky a tabulka výhod, nevýhod a ideálního využití typů připojení.</desc>
  <defs>
    <g id="ico-data" aria-label="ikona mobilní data">
      <line x1="-14" y1="12" x2="-14" y2="-10" stroke="#111" stroke-width="3"/>
      <path d="M -19 -5 L -14 -14 L -9 -5 Z" fill="#111"/>
      <line x1="0" y1="-10" x2="0" y2="12" stroke="#111" stroke-width="3"/>
      <path d="M -5 7 L 0 16 L 5 7 Z" fill="#111"/>
    </g>
    <g id="ico-wifi" aria-label="ikona Wi-Fi">
      <path d="M -14 2 A 20 20 0 0 1 14 2" fill="none" stroke="#111" stroke-width="3"/>
      <path d="M -8 9 A 11 11 0 0 1 8 9" fill="none" stroke="#111" stroke-width="3"/>
      <circle cx="0" cy="15" r="3" fill="#111"/>
    </g>
    <g id="ico-kabel" aria-label="ikona kabel se zástrčkou">
      <path d="M -18 12 Q -4 -10 10 2" fill="none" stroke="#111" stroke-width="3"/>
      <rect x="8" y="-6" width="14" height="12" rx="2" fill="#111"/>
    </g>
  </defs>
  <g aria-label="Záhlaví">
    <text x="45" y="42" font-family="sans-serif" font-size="16" fill="#333">PRACOVNÍ LIST č.2L</text>
    <text x="440" y="42" font-family="sans-serif" font-size="15" fill="#777">jméno: _______________________</text>
    <text x="45" y="80" font-family="sans-serif" font-size="26" font-weight="bold" fill="#111">JAK SE PŘIPOJÍME K INTERNETU?</text>
  </g>
  <g aria-label="Úkol 1: přiřazení typů připojení k situacím">
    <text x="45" y="118" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111">1.  Jak se lze v těchto situacích připojit k internetu?</text>
    <text x="68" y="142" font-family="sans-serif" font-size="14" fill="#111">Zakroužkuj vždy všechny možnosti (šipky ↑↓ = mobilní data, vějíř = Wi-Fi, zástrčka = kabel)</text>
    <g aria-label="Situace 1: doma na mobilu">
      <rect x="45" y="160" width="164" height="120" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <text x="127" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">Jsem <tspan font-weight="bold">doma</tspan></text>
      <text x="127" y="207" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">na <tspan font-weight="bold">mobilu</tspan></text>
      <use href="#ico-data" x="85" y="243"/>
      <use href="#ico-wifi" x="127" y="240"/>
      <use href="#ico-kabel" x="172" y="243"/>
    </g>
    <g aria-label="Situace 2: v lese na mobilu">
      <rect x="225" y="160" width="164" height="120" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <text x="307" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">Jsem <tspan font-weight="bold">v lese</tspan></text>
      <text x="307" y="207" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">na <tspan font-weight="bold">mobilu</tspan></text>
      <use href="#ico-data" x="265" y="243"/>
      <use href="#ico-wifi" x="307" y="240"/>
      <use href="#ico-kabel" x="352" y="243"/>
    </g>
    <g aria-label="Situace 3: na školním počítači">
      <rect x="405" y="160" width="164" height="120" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <text x="487" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">Jsem <tspan font-weight="bold">na školním</tspan></text>
      <text x="487" y="207" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111"><tspan font-weight="bold">počítači</tspan></text>
      <use href="#ico-data" x="445" y="243"/>
      <use href="#ico-wifi" x="487" y="240"/>
      <use href="#ico-kabel" x="532" y="243"/>
    </g>
    <g aria-label="Situace 4: doma na notebooku">
      <rect x="585" y="160" width="164" height="120" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <text x="667" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">Jsem <tspan font-weight="bold">doma</tspan></text>
      <text x="667" y="207" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">na <tspan font-weight="bold">notebooku</tspan></text>
      <use href="#ico-data" x="625" y="243"/>
      <use href="#ico-wifi" x="667" y="240"/>
      <use href="#ico-kabel" x="712" y="243"/>
    </g>
  </g>
  <g aria-label="Úkol 2: speedtest">
    <text x="45" y="335" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111">2.  Speedtest: Ověřte rychlost vašeho připojení k internetu. Zjištěné údaje</text>
    <text x="68" y="357" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111">zapište do tabulky. Zaměřte se na údaj „download".</text>
    <text x="90" y="395" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111">TYPY PŘIPOJENÍ</text>
    <text x="330" y="395" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111">DOWNLOAD</text>
    <g aria-label="Řádek Wi-Fi">
      <text x="110" y="432" font-family="sans-serif" font-size="15" fill="#111">Wi-Fi</text>
      <line x1="80" y1="440" x2="490" y2="440" stroke="#333" stroke-width="1.5"/>
    </g>
    <g aria-label="Řádek mobilní data">
      <text x="98" y="470" font-family="sans-serif" font-size="15" fill="#111">mobilní data</text>
      <line x1="80" y1="478" x2="490" y2="478" stroke="#333" stroke-width="1.5"/>
    </g>
    <g aria-label="Řádek kabel">
      <text x="122" y="508" font-family="sans-serif" font-size="15" fill="#111">kabel</text>
      <line x1="80" y1="516" x2="490" y2="516" stroke="#333" stroke-width="1.5"/>
    </g>
    <g aria-label="QR kód na speedtest.net">
      <text x="615" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111">SPEEDTEST.NET</text>
      <rect x="555" y="405" width="120" height="115" fill="#fff" stroke="#111" stroke-width="2"/>
      <text x="615" y="455" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111">QR:</text>
      <text x="615" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">speedtest.net</text>
    </g>
  </g>
  <g aria-label="Úkol 3: výhody a nevýhody typů připojení">
    <text x="45" y="575" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111">3.  Doplňte do tabulky výhody, nevýhody jednotlivých typů připojení.</text>
    <text x="68" y="597" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111">Doplňte také konkrétní situaci, ve kterých je ideální dané připojení využít.</text>
    <text x="68" y="619" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111">Napište jiné situace než v úkolu 1.</text>
    <g aria-label="Tabulka výhod a nevýhod">
      <line x1="45" y1="635" x2="749" y2="635" stroke="#333" stroke-width="1.5"/>
      <line x1="45" y1="672" x2="749" y2="672" stroke="#333" stroke-width="1.5"/>
      <line x1="45" y1="772" x2="749" y2="772" stroke="#333" stroke-width="1.5"/>
      <line x1="45" y1="872" x2="749" y2="872" stroke="#333" stroke-width="1.5"/>
      <line x1="45" y1="972" x2="749" y2="972" stroke="#333" stroke-width="1.5"/>
      <line x1="205" y1="635" x2="205" y2="972" stroke="#333" stroke-width="1"/>
      <line x1="390" y1="635" x2="390" y2="972" stroke="#333" stroke-width="1"/>
      <line x1="575" y1="635" x2="575" y2="972" stroke="#333" stroke-width="1"/>
      <text x="125" y="659" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111">TYPY PŘIPOJENÍ</text>
      <text x="297" y="659" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111">VÝHODY</text>
      <text x="482" y="659" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111">NEVÝHODY</text>
      <text x="662" y="659" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111">IDEÁLNÍ VYUŽITÍ</text>
      <text x="125" y="727" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#111">WI-FI</text>
      <text x="125" y="827" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#111">mobilní data</text>
      <text x="125" y="927" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#111">kabel</text>
    </g>
  </g>
  <g aria-label="Zápatí">
    <text x="45" y="1085" font-family="sans-serif" font-size="13" fill="#777">internet4kids.mff.cuni.cz</text>
    <line x1="660" y1="1070" x2="749" y2="1070" stroke="#777"/>
    <text x="740" y="1088" text-anchor="end" font-family="sans-serif" font-size="13" fill="#777">1</text>
  </g>
</svg>
