<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Jaká BTS je nejblíž naší škole?</title>
  <desc>Aktivitní slide s QR kódem odkazujícím na online mapu BTS vysílačů; žáci hledají vysílač nejblíže škole (odpovídá úloze 3 v pracovním listu T).</desc>
  <text x="480" y="90" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#1a1a2e">Jaká <tspan fill="#e0483e">BTS</tspan> je <tspan fill="#e0483e">nejblíž</tspan> naší škole?</text>
  <g aria-label="QR kód na mapu BTS vysílačů">
    <rect x="330" y="150" width="300" height="280" fill="#fff" stroke="#333" stroke-width="4"/>
    <text x="480" y="270" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e">QR kód</text>
    <text x="480" y="305" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#444">online mapa BTS vysílačů</text>
  </g>
  <text x="480" y="480" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">Naskenujte QR kód a najděte na mapě vysílač nejblíže naší škole.</text>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">13</text>
</svg>
