<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Wi-Fi router — úplné schéma zapojení</title>
  <desc>Kompletní schéma: žlutý kabel spojuje notebook s LAN portem routeru, modrý kabel vede z datové zásuvky do WAN portu, fialový kabel do elektrické zásuvky a mezi routerem a mobilem jsou vlny Wi-Fi signálu. Barvy kabelů odpovídají barvám portů.</desc>
  <text x="480" y="48" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#2d1b69">Wi-Fi router</text>
  <g aria-label="Body slidu">
    <text x="60" y="84" font-family="sans-serif" font-size="16" fill="#1a1a2e">• Notebook či stolní počítač můžeme přímo k routeru připojit <tspan font-weight="bold" fill="#b5850f">kabelem</tspan></text>
    <text x="60" y="108" font-family="sans-serif" font-size="16" fill="#1a1a2e">• Router zapojíme do <tspan font-weight="bold" fill="#3a7fb0">přípojky</tspan> k internetu ve zdi</text>
    <text x="60" y="132" font-family="sans-serif" font-size="16" fill="#1a1a2e">• Router posílá Wi-Fi signál do zařízení nebo přijímá Wi-Fi signál od zařízení</text>
    <text x="60" y="156" font-family="sans-serif" font-size="16" fill="#1a1a2e">• Router musí být zapojen do <tspan font-weight="bold" fill="#4b2e83">elektřiny</tspan></text>
  </g>
  <g aria-label="Notebook">
    <rect x="70" y="250" width="160" height="100" rx="6" fill="#f5f5fa" stroke="#333" stroke-width="2"/>
    <rect x="85" y="262" width="130" height="65" fill="#fff" stroke="#888"/>
    <line x1="55" y1="356" x2="245" y2="356" stroke="#333" stroke-width="4"/>
    <text x="150" y="385" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">notebook</text>
  </g>
  <g aria-label="Datová zásuvka ve zdi">
    <rect x="360" y="190" width="85" height="75" rx="8" fill="#e6ddf5" stroke="#333" stroke-width="2"/>
    <rect x="375" y="215" width="22" height="24" fill="none" stroke="#4a9fd8" stroke-width="3"/>
    <rect x="407" y="215" width="22" height="24" fill="none" stroke="#888" stroke-width="3"/>
    <text x="402" y="182" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">datová zásuvka ve zdi</text>
  </g>
  <g aria-label="Elektrická zásuvka">
    <rect x="360" y="400" width="85" height="75" rx="8" fill="#e6ddf5" stroke="#333" stroke-width="2"/>
    <circle cx="402" cy="437" r="19" fill="none" stroke="#4b2e83" stroke-width="3"/>
    <circle cx="394" cy="437" r="3" fill="#4b2e83"/>
    <circle cx="410" cy="437" r="3" fill="#4b2e83"/>
    <text x="402" y="498" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">elektrická zásuvka</text>
  </g>
  <g aria-label="Wi-Fi router">
    <line x1="600" y1="210" x2="580" y2="160" stroke="#333" stroke-width="5"/>
    <line x1="690" y1="210" x2="710" y2="160" stroke="#333" stroke-width="5"/>
    <rect x="565" y="210" width="160" height="52" rx="8" fill="#e9e9f2" stroke="#333" stroke-width="2"/>
    <circle cx="588" cy="236" r="8" fill="none" stroke="#6a3fb5" stroke-width="3"/>
    <rect x="605" y="224" width="20" height="22" fill="none" stroke="#4a9fd8" stroke-width="3"/>
    <rect x="632" y="224" width="20" height="22" fill="none" stroke="#e8b021" stroke-width="3"/>
    <rect x="658" y="224" width="20" height="22" fill="none" stroke="#e8b021" stroke-width="3"/>
    <rect x="684" y="224" width="20" height="22" fill="none" stroke="#e8b021" stroke-width="3"/>
    <text x="645" y="290" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d1b69">Wi-Fi router</text>
  </g>
  <g aria-label="Žlutý LAN kabel notebook–router">
    <path d="M 230 280 Q 420 320 642 246" fill="none" stroke="#f5c542" stroke-width="5"/>
    <text x="400" y="335" font-family="sans-serif" font-size="14" fill="#b5850f">žlutý kabel (LAN)</text>
  </g>
  <g aria-label="Modrý WAN kabel zásuvka–router">
    <path d="M 430 240 Q 520 260 613 235" fill="none" stroke="#7db9e8" stroke-width="5"/>
    <text x="480" y="230" font-family="sans-serif" font-size="14" fill="#3a7fb0">modrý kabel (WAN)</text>
  </g>
  <g aria-label="Fialový napájecí kabel router–zásuvka">
    <path d="M 588 262 Q 520 420 445 437" fill="none" stroke="#3b2a70" stroke-width="5"/>
    <text x="545" y="410" font-family="sans-serif" font-size="14" fill="#3b2a70">napájecí kabel</text>
  </g>
  <g aria-label="Vlny Wi-Fi signálu router–mobil">
    <path d="M 745 225 A 30 45 0 0 1 745 285" fill="none" stroke="#6bb9e8" stroke-width="4"/>
    <path d="M 768 215 A 42 60 0 0 1 768 295" fill="none" stroke="#f06ba8" stroke-width="4"/>
    <path d="M 791 205 A 55 75 0 0 1 791 305" fill="none" stroke="#6bb9e8" stroke-width="4"/>
  </g>
  <g aria-label="Mobil s ikonou Wi-Fi">
    <rect x="815" y="200" width="80" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="3"/>
    <path d="M 835 270 A 27 27 0 0 1 875 270" fill="none" stroke="#6c3df4" stroke-width="4"/>
    <circle cx="855" cy="285" r="4" fill="#6c3df4"/>
    <text x="855" y="365" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">mobil</text>
  </g>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">6</text>
</svg>
