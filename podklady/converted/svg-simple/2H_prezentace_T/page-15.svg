<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Satelity</title>
  <desc>Satelity se pro běžnou komunikaci po internetu nepoužívají: obíhají až 35 000 km vysoko (velké zpoždění), využívají se na odlehlých místech a pro GPS; rychlost 30–100 Mb/s. Ilustrace komunikace mezi lodí a satelitem.</desc>
  <text x="300" y="60" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#2d1b69">SATELITY</text>
  <text x="300" y="100" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a2e">Pro běžnou komunikaci po internetu se nepoužívají</text>
  <g aria-label="Na oběžné dráze">
    <text x="60" y="160" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1a1a2e">Na oběžné dráze</text>
    <text x="80" y="190" font-family="sans-serif" font-size="18" fill="#1a1a2e">• až <tspan font-weight="bold">35 000 km vysoko</tspan> = <tspan font-weight="bold">velké zpoždění</tspan></text>
    <text x="80" y="217" font-family="sans-serif" font-size="18" fill="#1a1a2e">• pro srovnání — obvod Země je 40 075 km</text>
  </g>
  <g aria-label="Využití na odlehlých místech">
    <text x="60" y="270" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1a1a2e">Využití na odlehlých místech</text>
    <text x="80" y="300" font-family="sans-serif" font-size="18" fill="#1a1a2e">• v horách, uprostřed oceánu, atd.</text>
    <text x="80" y="327" font-family="sans-serif" font-size="18" fill="#1a1a2e">• dále např. pro určení polohy pomocí <tspan font-weight="bold">GPS</tspan></text>
  </g>
  <text x="60" y="390" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1a1a2e">Rychlost 30–100 Mb/s</text>
  <g role="img" aria-label="Ilustrace komunikace loď–satelit">
    <title>Nahoře satelit se solárními panely a parabolou, dole loď s anténou na mořské hladině; mezi nimi sloupec vln signálu s pakety dat putujícími oběma směry. Fialová šipka vyznačuje vzdálenost 35 000 km.</title>
    <rect x="740" y="80" width="56" height="38" rx="4" fill="#8a7bb8" stroke="#333"/>
    <rect x="680" y="88" width="50" height="22" fill="#c9b8ee" stroke="#333"/>
    <rect x="806" y="88" width="50" height="22" fill="#c9b8ee" stroke="#333"/>
    <path d="M 752 76 A 20 11 0 0 1 784 76" fill="none" stroke="#333" stroke-width="3"/>
    <text x="768" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">satelit</text>
    <path d="M 745 165 A 32 18 0 0 0 791 165" fill="none" stroke="#6bb9e8" stroke-width="4"/>
    <path d="M 740 220 A 40 22 0 0 0 796 220" fill="none" stroke="#6bb9e8" stroke-width="4"/>
    <path d="M 745 285 A 32 18 0 0 1 791 285" fill="none" stroke="#6bb9e8" stroke-width="4"/>
    <path d="M 740 340 A 40 22 0 0 1 796 340" fill="none" stroke="#6bb9e8" stroke-width="4"/>
    <rect x="762" y="188" width="12" height="12" fill="#e8b021"/>
    <rect x="762" y="308" width="12" height="12" fill="#e8b021"/>
    <path d="M 700 420 L 836 420 L 816 445 L 720 445 Z" fill="#555"/>
    <line x1="768" y1="420" x2="768" y2="390" stroke="#333" stroke-width="3"/>
    <path d="M 690 455 Q 768 470 846 455 L 846 470 L 690 470 Z" fill="#8fc3de"/>
    <text x="768" y="495" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">loď s anténou na moři</text>
    <g aria-label="Vzdálenost 35 000 km">
      <line x1="890" y1="110" x2="890" y2="410" stroke="#6c3df4" stroke-width="3"/>
      <path d="M 883 122 L 890 106 L 897 122 Z M 883 398 L 890 414 L 897 398 Z" fill="#6c3df4"/>
      <text x="884" y="265" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6c3df4">35 000 km</text>
    </g>
  </g>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">15</text>
</svg>
