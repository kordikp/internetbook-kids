<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Jak byste se připojili k Internetu?</title>
  <desc>Diskusní slide: čtyři fotografie situací (mobil doma, mobil v lese, školní počítač, notebook doma) a tři ikony typů připojení — Wi-Fi, mobilní data, síťový kabel. Žáci přiřazují typ připojení k situacím.</desc>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#1a1a2e">Jak byste se připojili k Internetu?</text>
  <g aria-label="Čtyři fotografie situací">
    <g role="img"><title>Fotografie: ruka držící chytrý telefon se zamčenou obrazovkou — doma na mobilu.</title>
      <rect x="60" y="85" width="190" height="120" fill="#f2f2f2" stroke="#999"/>
      <rect x="130" y="105" width="40" height="70" rx="6" fill="none" stroke="#555" stroke-width="3"/>
      <text x="155" y="225" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">Doma na mobilu</text>
    </g>
    <g role="img"><title>Fotografie: dívka s batohem venku v lese dívající se do mobilu.</title>
      <rect x="270" y="85" width="190" height="120" fill="#f2f2f2" stroke="#999"/>
      <circle cx="350" cy="120" r="12" fill="none" stroke="#555" stroke-width="3"/>
      <path d="M 350 132 L 350 165 M 335 145 L 365 145" fill="none" stroke="#555" stroke-width="3"/>
      <path d="M 400 175 L 415 130 L 430 175 Z" fill="#7aa46b"/>
      <text x="365" y="225" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">V lese na mobilu</text>
    </g>
    <g role="img"><title>Fotografie: školní počítačová učebna s monitory a sluchátky.</title>
      <rect x="480" y="85" width="190" height="120" fill="#f2f2f2" stroke="#999"/>
      <rect x="510" y="115" width="55" height="38" fill="none" stroke="#555" stroke-width="3"/>
      <rect x="590" y="115" width="55" height="38" fill="none" stroke="#555" stroke-width="3"/>
      <line x1="537" y1="153" x2="537" y2="168" stroke="#555" stroke-width="3"/>
      <line x1="617" y1="153" x2="617" y2="168" stroke="#555" stroke-width="3"/>
      <text x="575" y="225" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">Na školním počítači</text>
    </g>
    <g role="img"><title>Fotografie: žena pracující doma na notebooku u stolu.</title>
      <rect x="690" y="85" width="190" height="120" fill="#f2f2f2" stroke="#999"/>
      <rect x="740" y="120" width="70" height="42" fill="none" stroke="#555" stroke-width="3"/>
      <line x1="728" y1="168" x2="822" y2="168" stroke="#555" stroke-width="3"/>
      <text x="785" y="225" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">Doma na notebooku</text>
    </g>
  </g>
  <g aria-label="Tři typy připojení">
    <g aria-label="Připojení přes Wi-Fi">
      <g role="img"><title>Fialová ikona Wi-Fi — vějíř soustředných oblouků.</title>
        <path d="M 130 340 A 42 42 0 0 1 190 340" fill="none" stroke="#6c3df4" stroke-width="5"/>
        <path d="M 143 355 A 24 24 0 0 1 177 355" fill="none" stroke="#6c3df4" stroke-width="5"/>
        <circle cx="160" cy="372" r="6" fill="#6c3df4"/>
      </g>
      <text x="160" y="410" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1a1a2e">připojení přes <tspan font-weight="bold">Wi-Fi</tspan></text>
    </g>
    <g aria-label="Připojení přes mobilní data">
      <g role="img"><title>Červená ikona mobilních dat — šipka nahoru a šipka dolů.</title>
        <line x1="455" y1="375" x2="455" y2="335" stroke="#e0483e" stroke-width="5"/>
        <path d="M 447 343 L 455 330 L 463 343 Z" fill="#e0483e"/>
        <line x1="485" y1="335" x2="485" y2="375" stroke="#e0483e" stroke-width="5"/>
        <path d="M 477 367 L 485 380 L 493 367 Z" fill="#e0483e"/>
      </g>
      <text x="470" y="410" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1a1a2e">připojení přes <tspan font-weight="bold">mobilní data</tspan></text>
    </g>
    <g aria-label="Připojení přes síťový kabel">
      <g role="img"><title>Oranžová ikona síťového kabelu se zástrčkou.</title>
        <path d="M 740 370 Q 770 340 800 360" fill="none" stroke="#f5a623" stroke-width="5"/>
        <rect x="798" y="350" width="22" height="18" rx="3" fill="#f5a623"/>
      </g>
      <text x="785" y="410" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1a1a2e">připojení přes <tspan font-weight="bold">síťový kabel</tspan></text>
    </g>
  </g>
  <text x="480" y="490" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#666">Ke každé situaci přiřaďte všechny vhodné typy připojení.</text>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">18</text>
</svg>
