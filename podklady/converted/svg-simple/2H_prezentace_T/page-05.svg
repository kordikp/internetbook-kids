<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Wi-Fi router — signál a napájení</title>
  <desc>Schéma s prvními propojeními: mezi routerem a mobilem jsou vlny Wi-Fi signálu (obousměrná bezdrátová komunikace) a z routeru vede tmavě fialový kabel do elektrické zásuvky. Notebook a datová zásuvka zatím připojeny nejsou.</desc>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#2d1b69">Wi-Fi router</text>
  <g aria-label="Body slidu">
    <text x="60" y="90" font-family="sans-serif" font-size="18" fill="#1a1a2e">• Router <tspan font-weight="bold">posílá</tspan> Wi-Fi signál do zařízení nebo <tspan font-weight="bold">přijímá</tspan> Wi-Fi signál od zařízení</text>
    <text x="60" y="118" font-family="sans-serif" font-size="18" fill="#1a1a2e">• Router musí být zapojen do <tspan font-weight="bold" fill="#6c3df4">elektřiny</tspan></text>
  </g>
  <g aria-label="Notebook (zatím nepřipojen)">
    <rect x="70" y="220" width="160" height="100" rx="6" fill="#f5f5fa" stroke="#333" stroke-width="2"/>
    <rect x="85" y="232" width="130" height="65" fill="#fff" stroke="#888"/>
    <line x1="55" y1="326" x2="245" y2="326" stroke="#333" stroke-width="4"/>
    <text x="150" y="355" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">notebook</text>
  </g>
  <g aria-label="Datová zásuvka ve zdi (zatím nepřipojena)">
    <rect x="360" y="160" width="85" height="75" rx="8" fill="#e6ddf5" stroke="#333" stroke-width="2"/>
    <rect x="375" y="185" width="22" height="24" fill="none" stroke="#4a9fd8" stroke-width="3"/>
    <rect x="407" y="185" width="22" height="24" fill="none" stroke="#888" stroke-width="3"/>
    <text x="402" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">datová zásuvka ve zdi</text>
  </g>
  <g aria-label="Elektrická zásuvka připojená k routeru">
    <rect x="360" y="390" width="85" height="75" rx="8" fill="#e6ddf5" stroke="#333" stroke-width="2"/>
    <circle cx="402" cy="427" r="19" fill="none" stroke="#4b2e83" stroke-width="3"/>
    <circle cx="394" cy="427" r="3" fill="#4b2e83"/>
    <circle cx="410" cy="427" r="3" fill="#4b2e83"/>
    <text x="402" y="490" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">elektrická zásuvka</text>
  </g>
  <g aria-label="Wi-Fi router">
    <line x1="600" y1="180" x2="580" y2="130" stroke="#333" stroke-width="5"/>
    <line x1="690" y1="180" x2="710" y2="130" stroke="#333" stroke-width="5"/>
    <rect x="565" y="180" width="160" height="52" rx="8" fill="#e9e9f2" stroke="#333" stroke-width="2"/>
    <circle cx="588" cy="206" r="8" fill="none" stroke="#6a3fb5" stroke-width="3"/>
    <rect x="605" y="194" width="20" height="22" fill="none" stroke="#4a9fd8" stroke-width="3"/>
    <rect x="632" y="194" width="20" height="22" fill="none" stroke="#e8b021" stroke-width="3"/>
    <rect x="658" y="194" width="20" height="22" fill="none" stroke="#e8b021" stroke-width="3"/>
    <rect x="684" y="194" width="20" height="22" fill="none" stroke="#e8b021" stroke-width="3"/>
    <text x="645" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d1b69">Wi-Fi router</text>
  </g>
  <g aria-label="Vlny Wi-Fi signálu mezi routerem a mobilem">
    <path d="M 745 195 A 30 45 0 0 1 745 255" fill="none" stroke="#6bb9e8" stroke-width="4"/>
    <path d="M 768 185 A 42 60 0 0 1 768 265" fill="none" stroke="#f06ba8" stroke-width="4"/>
    <path d="M 791 175 A 55 75 0 0 1 791 275" fill="none" stroke="#6bb9e8" stroke-width="4"/>
  </g>
  <g aria-label="Mobil s ikonou Wi-Fi">
    <rect x="815" y="170" width="80" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="3"/>
    <path d="M 835 240 A 27 27 0 0 1 875 240" fill="none" stroke="#6c3df4" stroke-width="4"/>
    <circle cx="855" cy="255" r="4" fill="#6c3df4"/>
    <text x="855" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">mobil</text>
  </g>
  <g aria-label="Napájecí kabel routeru">
    <path d="M 590 232 Q 520 400 445 427" fill="none" stroke="#3b2a70" stroke-width="5"/>
    <text x="560" y="390" font-family="sans-serif" font-size="14" fill="#3b2a70">napájecí kabel</text>
  </g>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">5</text>
</svg>
