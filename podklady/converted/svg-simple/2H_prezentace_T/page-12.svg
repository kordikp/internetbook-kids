<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Připojení přes mobilní data</title>
  <desc>Připojení přes mobilní data funguje pomocí BTS vysílačů; přes BTS probíhají i telefonní hovory a SMS, připojují se k nim zařízení se SIM kartou. Ilustrace stožáru BTS, mapy pokrytí ČR a fotografie věží.</desc>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#2d1b69">PŘIPOJENÍ PŘES MOBILNÍ DATA</text>
  <g aria-label="Body slidu">
    <text x="60" y="95" font-family="sans-serif" font-size="19" fill="#1a1a2e">• Pomocí <tspan font-weight="bold">BTS vysílačů</tspan></text>
    <text x="60" y="123" font-family="sans-serif" font-size="19" fill="#1a1a2e">• Přes BTS probíhají i <tspan font-weight="bold">telefonní hovory</tspan> či posílání <tspan font-weight="bold">SMS</tspan></text>
    <text x="60" y="151" font-family="sans-serif" font-size="19" fill="#1a1a2e">• K BTS se připojují zařízení se <tspan font-weight="bold">SIM kartou</tspan></text>
  </g>
  <g role="img" aria-label="Stožár BTS na kopci">
    <title>Kreslený příhradový stožár BTS s cedulkou 5G na zeleném kopci; šíří žluté vlny signálu.</title>
    <path d="M 40 420 Q 140 340 260 420 L 260 470 L 40 470 Z" fill="#8bc98a"/>
    <line x1="110" y1="410" x2="135" y2="240" stroke="#555" stroke-width="4"/>
    <line x1="160" y1="410" x2="135" y2="240" stroke="#555" stroke-width="4"/>
    <line x1="119" y1="350" x2="152" y2="350" stroke="#555" stroke-width="3"/>
    <rect x="115" y="210" width="40" height="28" rx="4" fill="#fff" stroke="#333"/>
    <text x="135" y="230" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2d1b69">5G</text>
    <path d="M 190 280 A 140 140 0 0 1 280 360" fill="none" stroke="#e8b021" stroke-width="4"/>
    <path d="M 215 255 A 200 200 0 0 1 350 375" fill="none" stroke="#e8b021" stroke-width="4"/>
  </g>
  <g role="img" aria-label="Mapa pokrytí mobilním signálem">
    <title>Mapa České republiky téměř celá pokrytá červenou barvou — mapa pokrytí mobilním signálem (červená = pokryto).</title>
    <rect x="330" y="210" width="300" height="190" fill="#fff" stroke="#999"/>
    <path d="M 360 310 Q 410 240 480 255 Q 560 240 600 310 Q 570 370 480 378 Q 400 372 360 310 Z" fill="#e05548" stroke="#a83a32"/>
    <text x="480" y="425" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">mapa pokrytí ČR (červená = pokryto)</text>
  </g>
  <g role="img" aria-label="Uživatel s mobilem na kopci">
    <title>Postava s mobilem na modrém kopci; signál z věže doputuje k jejímu telefonu.</title>
    <path d="M 700 430 Q 800 350 910 430 L 910 470 L 700 470 Z" fill="#8ab8d8"/>
    <circle cx="800" cy="355" r="12" fill="none" stroke="#333" stroke-width="3"/>
    <line x1="800" y1="367" x2="800" y2="405" stroke="#333" stroke-width="3"/>
    <line x1="800" y1="378" x2="822" y2="370" stroke="#333" stroke-width="3"/>
    <rect x="820" y="358" width="13" height="20" rx="3" fill="none" stroke="#333" stroke-width="2"/>
  </g>
  <g aria-label="Fotografie BTS věží">
    <g role="img"><title>Fotografie příhradového stožáru BTS s anténami.</title>
      <circle cx="700" cy="200" r="38" fill="#f2f2f2" stroke="#999"/>
      <path d="M 692 225 L 700 175 L 708 225" fill="none" stroke="#555" stroke-width="3"/>
    </g>
    <g role="img"><title>Fotografie trubkového stožáru BTS s anténami.</title>
      <circle cx="790" cy="185" r="38" fill="#f2f2f2" stroke="#999"/>
      <line x1="790" y1="210" x2="790" y2="160" stroke="#555" stroke-width="4"/>
    </g>
    <g role="img"><title>Fotografie stožáru BTS s anténami proti obloze.</title>
      <circle cx="880" cy="200" r="38" fill="#f2f2f2" stroke="#999"/>
      <path d="M 872 225 L 880 175 L 888 225" fill="none" stroke="#555" stroke-width="3"/>
    </g>
    <text x="790" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">skutečné BTS věže</text>
  </g>
  <text x="480" y="505" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#888">Zdroj: https://czech-mobile.cz/mapa-pokryti/</text>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">12</text>
</svg>
