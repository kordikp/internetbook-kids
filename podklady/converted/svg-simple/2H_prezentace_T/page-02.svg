<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Jak by se šlo připojit k internetu na vodě?</title>
  <desc>Motivační slide vodáckého výletu: fotografie přístaviště pod mostem, kánoe na vodě a výřez mapy Vltavy se špendlíkem „Přistaviště Podolsko". Otázka, kde vzít internet na vodě.</desc>
  <text x="480" y="60" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#1a1a2e">Jak by se šlo připojit k internetu <tspan fill="#3a7fb0">na vodě</tspan>?</text>
  <g role="img" aria-label="Fotografie přístaviště pod mostem">
    <title>Pohled pod obloukem betonového mostu na přístaviště s loďkami na přehradě.</title>
    <rect x="60" y="120" width="260" height="220" fill="#eaf3fa" stroke="#999"/>
    <path d="M 60 160 Q 190 100 320 160 L 320 120 L 60 120 Z" fill="#c2c2c2"/>
    <path d="M 60 290 L 320 290 L 320 340 L 60 340 Z" fill="#8fc3de"/>
    <path d="M 130 285 q 20 -12 40 0 z" fill="#a86a3a"/>
    <path d="M 210 285 q 20 -12 40 0 z" fill="#a86a3a"/>
    <text x="190" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">přístaviště pod mostem</text>
  </g>
  <g role="img" aria-label="Fotografie kánoe na vodě">
    <title>Kánoe s pádlujícími lidmi na klidné vodní hladině pod lesem.</title>
    <rect x="350" y="120" width="260" height="220" fill="#eaf3fa" stroke="#999"/>
    <path d="M 350 260 L 610 260 L 610 340 L 350 340 Z" fill="#8fc3de"/>
    <path d="M 420 250 Q 480 275 550 250 L 535 235 L 435 235 Z" fill="#a86a3a"/>
    <circle cx="460" cy="222" r="8" fill="#555"/>
    <circle cx="510" cy="222" r="8" fill="#555"/>
    <text x="480" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">kánoe na řece</text>
  </g>
  <g role="img" aria-label="Mapa s polohou přístaviště">
    <title>Výřez online mapy řeky Vltavy s červeným špendlíkem s kotvou označujícím Přistaviště Podolsko mezi obcemi Podolsko, Temešvár a Zálesí.</title>
    <rect x="640" y="120" width="260" height="220" fill="#eef4ea" stroke="#999"/>
    <path d="M 690 120 Q 740 220 700 340" fill="none" stroke="#8fc3de" stroke-width="14"/>
    <path d="M 762 210 a 14 14 0 1 1 0.1 0 Z M 762 224 l 0 26" fill="#d63a2f" stroke="#d63a2f" stroke-width="5"/>
    <text x="790" y="200" font-family="sans-serif" font-size="13" fill="#333">Přistaviště</text>
    <text x="790" y="216" font-family="sans-serif" font-size="13" fill="#333">Podolsko</text>
    <text x="660" y="150" font-family="sans-serif" font-size="12" fill="#777">Podolsko</text>
    <text x="820" y="290" font-family="sans-serif" font-size="12" fill="#777">Temešvár</text>
    <text x="660" y="320" font-family="sans-serif" font-size="12" fill="#777">Zálesí</text>
    <text x="770" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">mapa polohy tábořiště</text>
  </g>
  <text x="480" y="440" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555">Letní tábor / vodácký výlet — kde vzít internet na vodě?</text>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">2</text>
</svg>
