<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Připojení k internetu</title>
  <desc>Titulní slide prezentace o připojení k internetu. Tmavě fialové pozadí se stylizovanou mapou světa a růžovými spojnicemi symbolizujícími globální propojení internetem.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#3b2a70"/>
  <g role="img" aria-label="Stylizovaná mapa světa s růžovými spojnicemi mezi uzly">
    <title>Stylizovaná mapa světa: přes kontinenty vedou růžové obloukovité linky spojující uzly — symbol globálního propojení internetem.</title>
    <ellipse cx="240" cy="170" rx="110" ry="60" fill="#4c3a8a"/>
    <ellipse cx="560" cy="150" rx="90" ry="50" fill="#4c3a8a"/>
    <ellipse cx="760" cy="200" rx="120" ry="65" fill="#4c3a8a"/>
    <ellipse cx="580" cy="300" rx="70" ry="45" fill="#4c3a8a"/>
    <path d="M 200 160 Q 400 60 560 140" fill="none" stroke="#f06ba8" stroke-width="3"/>
    <path d="M 560 140 Q 660 90 780 180" fill="none" stroke="#f06ba8" stroke-width="3"/>
    <path d="M 240 190 Q 420 320 580 300" fill="none" stroke="#f06ba8" stroke-width="3"/>
    <path d="M 580 300 Q 700 290 770 210" fill="none" stroke="#f06ba8" stroke-width="3"/>
    <circle cx="200" cy="160" r="6" fill="#f06ba8"/>
    <circle cx="560" cy="140" r="6" fill="#f06ba8"/>
    <circle cx="780" cy="180" r="6" fill="#f06ba8"/>
    <circle cx="240" cy="190" r="6" fill="#f06ba8"/>
    <circle cx="580" cy="300" r="6" fill="#f06ba8"/>
  </g>
  <g aria-label="Titulek">
    <text x="480" y="400" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#ffffff">PŘIPOJENÍ K INTERNETU</text>
    <text x="480" y="445" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#e8dcff">internet4kids.mff.cuni.cz</text>
  </g>
  <g aria-label="Loga institucí">
    <text x="60" y="515" font-family="sans-serif" font-size="16" fill="#c9b8ee">Matfyz (MFF UK)</text>
    <text x="240" y="515" font-family="sans-serif" font-size="16" fill="#c9b8ee">Pedagogická fakulta UK</text>
  </g>
</svg>
