<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Přenosová rychlost</title>
  <desc>Definice přenosové rychlosti: jak rychle se přenesou data z jednoho místa v síti na druhé; jednotka bit za sekundu (b/s), 1 Mb/s odpovídá 25 000 slovům za sekundu.</desc>
  <text x="480" y="66" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#2d1b69">PŘENOSOVÁ RYCHLOST</text>
  <g aria-label="Definice">
    <rect x="180" y="100" width="600" height="70" rx="20" fill="#f3effc" stroke="#6c3df4" stroke-width="2"/>
    <text x="480" y="143" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1a1a2e"><tspan font-weight="bold">jak rychle</tspan> se přenesou data z jednoho místa v síti na druhé</text>
  </g>
  <g aria-label="Jednotky">
    <text x="480" y="215" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#1a1a2e">• jednotka <tspan font-weight="bold">bit</tspan> za sekundu = <tspan font-weight="bold">b/s</tspan></text>
    <text x="480" y="250" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#1a1a2e">• <tspan font-weight="bold">1 Mb/s</tspan> = 25 000 slov za sekundu</text>
  </g>
  <g role="img" aria-label="Kreslený stolní počítač">
    <title>Kreslený stolní počítač: monitor s otevřeným oknem prohlížeče (žluté kolečko, fialový pruh a červený obdélník jako prvky webové stránky) a klávesnice.</title>
    <rect x="370" y="290" width="220" height="140" rx="8" fill="#fff" stroke="#333" stroke-width="3"/>
    <rect x="385" y="305" width="190" height="110" fill="#fdfdf5" stroke="#888"/>
    <circle cx="410" cy="325" r="10" fill="#f5d442"/>
    <rect x="430" y="317" width="120" height="14" fill="#6c3df4"/>
    <rect x="405" y="345" width="90" height="60" fill="#e8635a"/>
    <line x1="480" y1="430" x2="480" y2="455" stroke="#333" stroke-width="5"/>
    <rect x="390" y="455" width="180" height="22" rx="5" fill="#e9e9f2" stroke="#333" stroke-width="2"/>
    <text x="480" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">počítač s otevřenou webovou stránkou</text>
  </g>
  <text x="930" y="525" text-anchor="end" font-family="sans-serif" font-size="14" fill="#999">3</text>
</svg>
