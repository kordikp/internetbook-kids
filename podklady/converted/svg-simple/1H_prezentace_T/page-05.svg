<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>SERVERY</title>
  <desc>Definice serveru: servery jsou počítače, kde je uloženo velké množství dat a které poskytují služby. Vlevo náznak fotografie rozebraného serveru, vpravo náznak fotografie chodby datového centra.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#f7c94b"/>
  <text x="60" y="70" font-family="sans-serif" font-size="40" font-weight="bold" fill="#1a1a1a">SERVERY</text>
  <text x="60" y="115" font-family="sans-serif" font-size="22" fill="#1a1a1a">jsou <tspan font-weight="bold">počítače</tspan>, kde je <tspan font-weight="bold">uloženo</tspan> velké množství dat,</text>
  <text x="60" y="145" font-family="sans-serif" font-size="22" fill="#1a1a1a">a které poskytují nějaké <tspan font-weight="bold">služby</tspan>.</text>
  <g role="img" aria-label="Fotografie serveru bez krytu">
    <title>Kruhový výřez fotografie skutečného serveru bez krytu – deska s procesory, chladiči a diskovými šachtami (blade server).</title>
    <circle cx="220" cy="330" r="120" fill="#ffffff" stroke="#333333" stroke-width="3"/>
    <rect x="140" y="270" width="160" height="120" rx="6" fill="#3a5a3a"/>
    <rect x="155" y="285" width="34" height="34" fill="#8a8a8a"/>
    <rect x="200" y="285" width="34" height="34" fill="#8a8a8a"/>
    <rect x="155" y="330" width="130" height="14" fill="#5a7a5a"/>
    <rect x="155" y="352" width="130" height="14" fill="#5a7a5a"/>
    <text x="220" y="475" font-family="sans-serif" font-size="15" fill="#555555" text-anchor="middle">server bez krytu (deska s procesory)</text>
  </g>
  <g role="img" aria-label="Fotografie interiéru datového centra">
    <title>Fotografie interiéru moderního datového centra: dlouhá chodba s řadou prosklených serverových skříní osvětlených modrým světlem.</title>
    <rect x="440" y="200" width="460" height="260" rx="10" fill="#1e2a4a" stroke="#333333" stroke-width="3"/>
    <path d="M 460 220 L 660 300 L 660 380 L 460 440 Z" fill="#2e3e6a"/>
    <path d="M 880 220 L 680 300 L 680 380 L 880 440 Z" fill="#2e3e6a"/>
    <rect x="470" y="235" width="26" height="190" fill="#4a6ab0"/>
    <rect x="510" y="255" width="24" height="150" fill="#4a6ab0"/>
    <rect x="545" y="270" width="22" height="120" fill="#4a6ab0"/>
    <rect x="864" y="235" width="26" height="190" fill="#4a6ab0"/>
    <rect x="826" y="255" width="24" height="150" fill="#4a6ab0"/>
    <rect x="793" y="270" width="22" height="120" fill="#4a6ab0"/>
    <text x="670" y="345" font-family="sans-serif" font-size="16" fill="#cfe0ff" text-anchor="middle">chodba datového centra</text>
  </g>
  <text x="60" y="500" font-family="sans-serif" font-size="11" fill="#8a7420">Zdroje: Dmitry Nosachev, CC BY-SA 4.0 Deed; Image by benzoix on Freepik</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#8a7420" text-anchor="end">5</text>
</svg>
