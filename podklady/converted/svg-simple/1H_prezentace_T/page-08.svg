<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Servery plní naše požadavky (3/4)</title>
  <desc>Schéma klient–server rozšířené o druhý požadavek: dívka žádá „Ukaž mi stránku wikipedia.org“ webový server Wikipedie.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#f7c94b"/>
  <defs>
    <marker id="sipka" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3a2a80"/>
    </marker>
    <marker id="sipkaZpet" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#7a5fd0"/>
    </marker>
  </defs>
  <text x="60" y="60" font-family="sans-serif" font-size="34" font-weight="bold" fill="#1a1a1a">Servery plní naše požadavky</text>
  <text x="620" y="60" font-family="sans-serif" font-size="20" fill="#1a1a1a"><tspan font-style="italic" font-weight="bold">serve</tspan> – angl. sloužit</text>
  <g aria-label="Klient – dívka s tabletem">
    <title>Kreslená dívka s brýlemi a tabletem – klient</title>
    <circle cx="150" cy="230" r="35" fill="none" stroke="#333333" stroke-width="3"/>
    <circle cx="138" cy="225" r="7" fill="none" stroke="#333333" stroke-width="2"/>
    <circle cx="162" cy="225" r="7" fill="none" stroke="#333333" stroke-width="2"/>
    <line x1="145" y1="225" x2="155" y2="225" stroke="#333333" stroke-width="2"/>
    <line x1="150" y1="265" x2="150" y2="350" stroke="#333333" stroke-width="3"/>
    <line x1="150" y1="290" x2="195" y2="320" stroke="#333333" stroke-width="3"/>
    <rect x="185" y="310" width="55" height="40" rx="5" fill="#ffffff" stroke="#333333" stroke-width="3"/>
    <line x1="150" y1="350" x2="125" y2="420" stroke="#333333" stroke-width="3"/>
    <line x1="150" y1="350" x2="175" y2="420" stroke="#333333" stroke-width="3"/>
    <text x="150" y="455" font-family="sans-serif" font-size="18" font-weight="bold" fill="#6644cc" text-anchor="middle">klient</text>
  </g>
  <g aria-label="Požadavek na YouTube server">
    <line x1="230" y1="200" x2="680" y2="170" stroke="#3a2a80" stroke-width="4" marker-end="url(#sipka)"/>
    <rect x="320" y="135" width="290" height="42" rx="10" fill="#7a5fd0"/>
    <text x="465" y="162" font-family="sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Ukaž mi video o kočičkách</text>
  </g>
  <g aria-label="YouTube server">
    <rect x="690" y="120" width="220" height="80" rx="12" fill="#3a2a80"/>
    <rect x="710" y="140" width="55" height="40" rx="9" fill="#e02b2b"/>
    <path d="M 729 149 L 729 171 L 748 160 Z" fill="#ffffff"/>
    <text x="840" y="155" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">YouTube</text>
    <text x="840" y="178" font-family="sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">server</text>
  </g>
  <g aria-label="Odpověď YouTube serveru">
    <line x1="740" y1="225" x2="240" y2="268" stroke="#7a5fd0" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#sipkaZpet)"/>
    <circle cx="640" cy="248" r="26" fill="#ffffff" stroke="#7a5fd0" stroke-width="2"/>
    <text x="640" y="253" font-family="sans-serif" font-size="10" fill="#555555" text-anchor="middle">koťátko</text>
    <rect x="350" y="245" width="200" height="38" rx="9" fill="#e05252"/>
    <text x="450" y="270" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Dobře, tady ho máš</text>
  </g>
  <g aria-label="Požadavek na server Wikipedie">
    <line x1="235" y1="340" x2="680" y2="390" stroke="#3a2a80" stroke-width="4" marker-end="url(#sipka)"/>
    <rect x="300" y="330" width="320" height="42" rx="10" fill="#7a5fd0"/>
    <text x="460" y="357" font-family="sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Ukaž mi stránku wikipedia.org</text>
  </g>
  <g aria-label="Webový server Wikipedie">
    <rect x="690" y="360" width="220" height="90" rx="12" fill="#3a2a80"/>
    <circle cx="740" cy="405" r="26" fill="#ffffff"/>
    <text x="740" y="413" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3a2a80" text-anchor="middle">W</text>
    <text x="840" y="398" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Webový server</text>
    <text x="840" y="422" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Wikipedie</text>
  </g>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#8a7420">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#8a7420" text-anchor="end">8</text>
</svg>
