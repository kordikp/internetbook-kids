<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Co kdyby internet přestal fungovat? – oblasti následků</title>
  <desc>Otázka na následky výpadku internetu z hlediska pěti oblastí: školství, politiky, uživatelů, zdravotnictví a dopravy. Slouží k rozdělení témat mezi skupiny žáků.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#4a3a9e"/>
  <text x="480" y="80" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">Co kdyby internet najednou přestal fungovat?</text>
  <text x="480" y="130" font-family="sans-serif" font-size="24" fill="#d9d2f5" text-anchor="middle">Jaké by byly následky z hlediska:</text>
  <g aria-label="Oblast školství">
    <rect x="70" y="190" width="150" height="220" rx="12" fill="#e8823c"/>
    <text x="145" y="310" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">ŠKOLSTVÍ</text>
  </g>
  <g aria-label="Oblast politiky">
    <rect x="245" y="190" width="150" height="220" rx="12" fill="#ffffff"/>
    <text x="320" y="310" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4a3a9e" text-anchor="middle">POLITIKY</text>
  </g>
  <g aria-label="Oblast uživatelů">
    <rect x="420" y="190" width="150" height="220" rx="12" fill="#7a5fd0"/>
    <text x="495" y="310" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">UŽIVATELŮ</text>
  </g>
  <g aria-label="Oblast zdravotnictví">
    <rect x="595" y="190" width="150" height="220" rx="12" fill="#e05252"/>
    <text x="670" y="298" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">ZDRAVOT-</text>
    <text x="670" y="322" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">NICTVÍ</text>
  </g>
  <g aria-label="Oblast dopravy">
    <rect x="770" y="190" width="150" height="220" rx="12" fill="#f5c518"/>
    <text x="845" y="310" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DOPRAVY</text>
  </g>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8" text-anchor="end">3</text>
</svg>
