  <text x="480" y="270" font-family="sans-serif" font-size="40" font-weight="bold" fill="#f5c518" text-anchor="middle">internet4kids.mff.cuni.cz</text>
  <text x="480" y="380" font-family="sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Výukové materiály vznikly díky grantům:</text>
  <text x="480" y="412" font-family="sans-serif" font-size="15" fill="#d9d2f5" text-anchor="middle">GA UK 360322 Multimediální materiály pro výuku informatiky na 2. stupni ZŠ</text>
  <text x="480" y="438" font-family="sans-serif" font-size="15" fill="#d9d2f5" text-anchor="middle">GA ČR 22-20771S Internet4Kids – Budování znalostí o internetu:</text>
  <text x="480" y="460" font-family="sans-serif" font-size="15" fill="#d9d2f5" text-anchor="middle">perspektiva teorií konceptuální změny</text>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8">Matfyz (MFF UK) · Pedagogická fakulta UK</text>
