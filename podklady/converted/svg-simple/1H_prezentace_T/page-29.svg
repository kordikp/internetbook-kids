<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Závěrečný slide – internet4kids.mff.cuni.cz</title>
  <desc>Závěrečný slide s adresou webu projektu a informacemi o grantech, na tmavě fialovém pozadí s mapou světa a propojenými uzly.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#4a3a9e"/>
  <g role="img" aria-label="Stylizovaná mapa světa s propojenými uzly">
    <title>Stylizovaná mapa světa s uzly propojenými oblouky – stejný motiv jako na titulním slidu.</title>
    <ellipse cx="200" cy="160" rx="90" ry="55" fill="#5a4ab0"/>
    <ellipse cx="260" cy="300" rx="45" ry="70" fill="#5a4ab0"/>
    <ellipse cx="480" cy="150" rx="55" ry="42" fill="#5a4ab0"/>
    <ellipse cx="680" cy="170" rx="100" ry="62" fill="#5a4ab0"/>
    <ellipse cx="770" cy="350" rx="50" ry="30" fill="#5a4ab0"/>
    <path d="M 200 155 Q 340 60 480 140" fill="none" stroke="#e87ba0" stroke-width="2"/>
    <path d="M 480 140 Q 580 80 680 165" fill="none" stroke="#e87ba0" stroke-width="2"/>
    <path d="M 680 175 Q 740 270 770 345" fill="none" stroke="#e87ba0" stroke-width="2"/>
    <circle cx="200" cy="155" r="7" fill="#c9407a"/>
    <circle cx="480" cy="142" r="7" fill="#c9407a"/>
    <circle cx="680" cy="168" r="7" fill="#c9407a"/>
    <circle cx="770" cy="345" r="7" fill="#c9407a"/>
