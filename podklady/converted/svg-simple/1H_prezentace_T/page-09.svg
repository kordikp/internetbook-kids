<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Servery plní naše požadavky (4/4) + typy serverů</title>
  <desc>Kompletní schéma dvou požadavků a odpovědí mezi klientem, YouTube serverem a webovým serverem Wikipedie; dole výčet typů serverů: webové, herní, chatservery.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#f7c94b"/>
  <defs>
    <marker id="sipka" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3a2a80"/>
    </marker>
    <marker id="sipkaZpet" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#7a5fd0"/>
    </marker>
  </defs>
  <text x="60" y="60" font-family="sans-serif" font-size="34" font-weight="bold" fill="#1a1a1a">Servery plní naše požadavky</text>
  <text x="620" y="60" font-family="sans-serif" font-size="20" fill="#1a1a1a"><tspan font-style="italic" font-weight="bold">serve</tspan> – angl. sloužit</text>
  <g aria-label="Klient – dívka s tabletem">
    <title>Kreslená dívka s brýlemi a tabletem – klient</title>
    <circle cx="150" cy="210" r="32" fill="none" stroke="#333333" stroke-width="3"/>
    <circle cx="139" cy="205" r="6" fill="none" stroke="#333333" stroke-width="2"/>
    <circle cx="161" cy="205" r="6" fill="none" stroke="#333333" stroke-width="2"/>
    <line x1="145" y1="205" x2="155" y2="205" stroke="#333333" stroke-width="2"/>
    <line x1="150" y1="242" x2="150" y2="320" stroke="#333333" stroke-width="3"/>
    <line x1="150" y1="265" x2="192" y2="292" stroke="#333333" stroke-width="3"/>
    <rect x="182" y="283" width="50" height="36" rx="5" fill="#ffffff" stroke="#333333" stroke-width="3"/>
    <line x1="150" y1="320" x2="128" y2="382" stroke="#333333" stroke-width="3"/>
    <line x1="150" y1="320" x2="172" y2="382" stroke="#333333" stroke-width="3"/>
    <text x="150" y="410" font-family="sans-serif" font-size="17" font-weight="bold" fill="#6644cc" text-anchor="middle">klient</text>
  </g>
  <g aria-label="Požadavek na YouTube server">
    <line x1="230" y1="185" x2="680" y2="160" stroke="#3a2a80" stroke-width="4" marker-end="url(#sipka)"/>
    <rect x="320" y="125" width="280" height="40" rx="10" fill="#7a5fd0"/>
    <text x="460" y="151" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Ukaž mi video o kočičkách</text>
  </g>
  <g aria-label="YouTube server">
    <rect x="690" y="110" width="220" height="76" rx="12" fill="#3a2a80"/>
    <rect x="710" y="128" width="52" height="38" rx="9" fill="#e02b2b"/>
    <path d="M 728 137 L 728 157 L 746 147 Z" fill="#ffffff"/>
    <text x="840" y="142" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">YouTube</text>
    <text x="840" y="165" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">server</text>
  </g>
  <g aria-label="Odpověď YouTube serveru">
    <line x1="740" y1="210" x2="240" y2="245" stroke="#7a5fd0" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#sipkaZpet)"/>
    <circle cx="645" cy="228" r="22" fill="#ffffff" stroke="#7a5fd0" stroke-width="2"/>
    <text x="645" y="233" font-family="sans-serif" font-size="9" fill="#555555" text-anchor="middle">koťátko</text>
    <rect x="355" y="222" width="190" height="34" rx="8" fill="#e05252"/>
    <text x="450" y="245" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">Dobře, tady ho máš</text>
  </g>
  <g aria-label="Požadavek na server Wikipedie">
    <line x1="235" y1="300" x2="680" y2="330" stroke="#3a2a80" stroke-width="4" marker-end="url(#sipka)"/>
    <rect x="300" y="285" width="310" height="40" rx="10" fill="#7a5fd0"/>
    <text x="455" y="311" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Ukaž mi stránku wikipedia.org</text>
  </g>
  <g aria-label="Webový server Wikipedie">
    <rect x="690" y="300" width="220" height="76" rx="12" fill="#3a2a80"/>
    <circle cx="738" cy="338" r="24" fill="#ffffff"/>
    <text x="738" y="346" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3a2a80" text-anchor="middle">W</text>
    <text x="838" y="331" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Webový server</text>
    <text x="838" y="354" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Wikipedie</text>
  </g>
  <g aria-label="Odpověď serveru Wikipedie">
    <line x1="740" y1="400" x2="245" y2="370" stroke="#7a5fd0" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#sipkaZpet)"/>
    <circle cx="645" cy="392" r="22" fill="#ffffff" stroke="#7a5fd0" stroke-width="2"/>
    <text x="645" y="389" font-family="sans-serif" font-size="8" fill="#555555" text-anchor="middle">stránka</text>
    <text x="645" y="400" font-family="sans-serif" font-size="8" fill="#555555" text-anchor="middle">Wikipedie</text>
    <rect x="360" y="368" width="180" height="34" rx="8" fill="#e05252"/>
    <text x="450" y="391" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">Dobře, tady ji máš</text>
  </g>
  <g aria-label="Různé typy serverů">
    <text x="60" y="470" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a">Různé typy serverů:</text>
    <circle cx="300" cy="463" r="14" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="300" y="468" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3a2a80" text-anchor="middle">W</text>
    <text x="322" y="470" font-family="sans-serif" font-size="19" fill="#1a1a1a">webové,</text>
    <rect x="415" y="450" width="26" height="26" fill="#7aa05a" stroke="#333333" stroke-width="2"/>
    <text x="452" y="470" font-family="sans-serif" font-size="19" fill="#1a1a1a">herní,</text>
    <path d="M 520 450 h 44 a 8 8 0 0 1 8 8 v 12 a 8 8 0 0 1 -8 8 h -30 l -14 10 v -10 a 8 8 0 0 1 -8 -8 v -12 a 8 8 0 0 1 8 -8 z" fill="#7a5fd0"/>
    <circle cx="534" cy="468" r="2" fill="#ffffff"/><circle cx="543" cy="468" r="2" fill="#ffffff"/><circle cx="552" cy="468" r="2" fill="#ffffff"/>
    <text x="585" y="470" font-family="sans-serif" font-size="19" fill="#1a1a1a">chatservery, …</text>
  </g>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#8a7420" text-anchor="end">9</text>
</svg>
