<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Servery plní naše požadavky (2/4)</title>
  <desc>Schéma klient–server doplněné o odpověď: YouTube server posílá čárkovanou šipkou zpět video s hláškou „Dobře, tady ho máš“.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#f7c94b"/>
  <defs>
    <marker id="sipka" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3a2a80"/>
    </marker>
    <marker id="sipkaZpet" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#7a5fd0"/>
    </marker>
  </defs>
  <text x="60" y="60" font-family="sans-serif" font-size="34" font-weight="bold" fill="#1a1a1a">Servery plní naše požadavky</text>
  <text x="620" y="60" font-family="sans-serif" font-size="20" fill="#1a1a1a"><tspan font-style="italic" font-weight="bold">serve</tspan> – angl. sloužit</text>
  <g aria-label="Klient – dívka s tabletem">
    <title>Kreslená dívka s brýlemi a tabletem – klient</title>
    <circle cx="150" cy="230" r="35" fill="none" stroke="#333333" stroke-width="3"/>
    <circle cx="138" cy="225" r="7" fill="none" stroke="#333333" stroke-width="2"/>
    <circle cx="162" cy="225" r="7" fill="none" stroke="#333333" stroke-width="2"/>
    <line x1="145" y1="225" x2="155" y2="225" stroke="#333333" stroke-width="2"/>
    <line x1="150" y1="265" x2="150" y2="350" stroke="#333333" stroke-width="3"/>
    <line x1="150" y1="290" x2="195" y2="320" stroke="#333333" stroke-width="3"/>
    <rect x="185" y="310" width="55" height="40" rx="5" fill="#ffffff" stroke="#333333" stroke-width="3"/>
    <line x1="150" y1="350" x2="125" y2="420" stroke="#333333" stroke-width="3"/>
    <line x1="150" y1="350" x2="175" y2="420" stroke="#333333" stroke-width="3"/>
    <text x="150" y="455" font-family="sans-serif" font-size="18" font-weight="bold" fill="#6644cc" text-anchor="middle">klient</text>
  </g>
  <g aria-label="Požadavek na YouTube server">
    <line x1="230" y1="215" x2="680" y2="195" stroke="#3a2a80" stroke-width="4" marker-end="url(#sipka)"/>
    <rect x="320" y="160" width="290" height="46" rx="10" fill="#7a5fd0"/>
    <text x="465" y="190" font-family="sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">Ukaž mi video o kočičkách</text>
  </g>
  <g aria-label="YouTube server">
    <rect x="690" y="150" width="220" height="90" rx="12" fill="#3a2a80"/>
    <rect x="715" y="172" width="62" height="44" rx="10" fill="#e02b2b"/>
    <path d="M 736 182 L 736 206 L 757 194 Z" fill="#ffffff"/>
    <text x="845" y="190" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">YouTube</text>
    <text x="845" y="215" font-family="sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">server</text>
  </g>
  <g aria-label="Odpověď serveru">
    <title>Odpověď serveru: čárkovaná šipka zpět ke klientovi s videem koťátka a textem „Dobře, tady ho máš“</title>
    <line x1="770" y1="270" x2="235" y2="315" stroke="#7a5fd0" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#sipkaZpet)"/>
    <circle cx="655" cy="300" r="38" fill="#ffffff" stroke="#7a5fd0" stroke-width="3"/>
    <text x="655" y="296" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">video</text>
    <text x="655" y="312" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">koťátka</text>
    <rect x="330" y="330" width="240" height="46" rx="10" fill="#e05252"/>
    <text x="450" y="360" font-family="sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">Dobře, tady ho máš</text>
  </g>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#8a7420">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#8a7420" text-anchor="end">7</text>
</svg>
