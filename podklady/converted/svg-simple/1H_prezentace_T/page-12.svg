<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Analogie s dopravou – vlakové spojení Vlašim–Dobruška</title>
  <desc>Analogie cestování vlakem: mapa s pěti stanicemi spojenými šipkami (Vlašim, Kolín, Chlumec n. Cidlinou, Třebechovice p. Orebem, Dobruška) a jízdní řád s časy. Cesta se skládá z přestupů – přímé spojení mezi každými dvěma místy neexistuje.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <defs>
    <marker id="sipka" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3a2a80"/>
    </marker>
  </defs>
  <g role="img" aria-label="Mapa trasy vlaku">
    <title>Výřez automapy středních a východních Čech se stanicemi vyznačenými kroužky a tlustými šipkami spojujícími stanice v pořadí cesty z jihozápadu na severovýchod.</title>
    <rect x="35" y="70" width="470" height="360" rx="12" fill="#eef4e8" stroke="#3a2a80" stroke-width="3"/>
    <!-- šipky trasy -->
    <line x1="110" y1="380" x2="185" y2="255" stroke="#3a2a80" stroke-width="8" marker-end="url(#sipka)"/>
    <line x1="195" y1="240" x2="255" y2="200" stroke="#3a2a80" stroke-width="8" marker-end="url(#sipka)"/>
    <line x1="270" y1="195" x2="360" y2="180" stroke="#3a2a80" stroke-width="8" marker-end="url(#sipka)"/>
    <line x1="380" y1="172" x2="425" y2="145" stroke="#3a2a80" stroke-width="8" marker-end="url(#sipka)"/>
    <!-- stanice -->
    <circle cx="105" cy="388" r="10" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <circle cx="192" cy="245" r="10" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <circle cx="263" cy="197" r="10" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <circle cx="370" cy="177" r="10" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <circle cx="432" cy="140" r="10" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <!-- popisky -->
    <text x="105" y="420" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">Vlašim</text>
    <text x="140" y="250" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">Kolín</text>
    <text x="240" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Chlumec n. Cidlinou</text>
    <text x="365" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Třebechovice</text>
    <text x="365" y="255" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">p. Orebem</text>
    <text x="432" y="110" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">Dobruška</text>
  </g>
  <g aria-label="Jízdní řád – časová osa">
    <title>Svislá časová osa se zastávkami a časy jako v jízdním řádu.</title>
    <line x1="590" y1="140" x2="590" y2="390" stroke="#3a2a80" stroke-width="6" marker-end="url(#sipka)"/>
    <circle cx="590" cy="140" r="9" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <circle cx="590" cy="205" r="9" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <circle cx="590" cy="270" r="9" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <circle cx="590" cy="335" r="9" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <circle cx="590" cy="400" r="9" fill="#ffffff" stroke="#3a2a80" stroke-width="4"/>
    <text x="625" y="147" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3a2a80">11:10</text>
    <text x="700" y="147" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c0392b">Vlašim</text>
    <text x="625" y="212" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3a2a80">13:00</text>
    <text x="700" y="212" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c0392b">Kolín</text>
    <text x="625" y="277" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3a2a80">15:20</text>
    <text x="700" y="277" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c0392b">Chlumec n. Cidlinou</text>
    <text x="625" y="342" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3a2a80">16:50</text>
    <text x="700" y="342" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c0392b">Třebechovice p. Orebem</text>
    <text x="625" y="407" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3a2a80">18:10</text>
    <text x="700" y="407" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c0392b">Dobruška</text>
  </g>
  <text x="480" y="480" font-family="sans-serif" font-size="16" fill="#555555" text-anchor="middle">Cesta se skládá z přestupů – přímé spojení mezi každými dvěma místy neexistuje.</text>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#999999">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="end">13</text>
</svg>
