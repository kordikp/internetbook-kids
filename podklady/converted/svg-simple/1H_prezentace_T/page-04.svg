<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>www.google.cz – kde jsou internetové služby uloženy?</title>
  <desc>Koláž ikon internetových služeb: adresní řádek prohlížeče s www.google.cz, vyhledávač Google, e-mail, cloudová úložiště (OneDrive, iCloud, Google Drive, Dropbox) a videoslužby YouTube a Netflix. Navozuje otázku, kdo a kde nám tyto služby poskytuje.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#4a3a9e"/>
  <g aria-label="Adresní řádek prohlížeče">
    <rect x="120" y="60" width="500" height="90" rx="14" fill="#e8823c"/>
    <rect x="145" y="85" width="380" height="42" rx="21" fill="#ffffff"/>
    <text x="170" y="113" font-family="sans-serif" font-size="24" fill="#1a1a1a">www.google.cz</text>
    <path d="M 545 88 L 600 106 L 545 124 L 557 106 Z" fill="#ffffff"/>
  </g>
  <g role="img" aria-label="Vyhledávač Google pod lupou">
    <title>Fotografie lupy zvětšující logo Google na obrazovce vyhledávače.</title>
    <circle cx="770" cy="130" r="85" fill="#ffffff"/>
    <circle cx="750" cy="112" r="38" fill="none" stroke="#333333" stroke-width="6"/>
    <line x1="778" y1="140" x2="812" y2="174" stroke="#333333" stroke-width="9" stroke-linecap="round"/>
    <text x="750" y="119" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4a7fd0" text-anchor="middle">Google</text>
  </g>
  <g aria-label="E-mail">
    <rect x="80" y="260" width="240" height="180" rx="14" fill="#ffffff"/>
    <rect x="120" y="300" width="70" height="46" rx="6" fill="none" stroke="#4a3a9e" stroke-width="3"/>
    <path d="M 120 300 L 155 328 L 190 300" fill="none" stroke="#4a3a9e" stroke-width="3"/>
    <rect x="210" y="300" width="70" height="46" rx="6" fill="none" stroke="#4a3a9e" stroke-width="3"/>
    <path d="M 210 300 L 245 328 L 280 300" fill="none" stroke="#4a3a9e" stroke-width="3"/>
    <text x="200" y="405" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4a3a9e" text-anchor="middle">e-mail @</text>
  </g>
  <g role="img" aria-label="Cloudová úložiště">
    <title>Mrak složený z log cloudových úložišť OneDrive, iCloud, Google Drive a Dropbox.</title>
    <path d="M 400 400 C 370 400 355 375 370 355 C 360 325 395 305 420 315 C 430 285 485 280 505 305 C 535 290 570 310 565 340 C 590 350 590 385 560 395 C 555 405 545 410 530 410 L 410 410 Z" fill="#2e2650"/>
    <text x="470" y="345" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">OneDrive · iCloud</text>
    <text x="470" y="372" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Google Drive · Dropbox</text>
    <text x="470" y="445" font-family="sans-serif" font-size="18" fill="#d9d2f5" text-anchor="middle">cloudová úložiště</text>
  </g>
  <g aria-label="Videoslužby">
    <rect x="640" y="260" width="240" height="180" rx="14" fill="#e8823c"/>
    <rect x="675" y="300" width="80" height="54" rx="12" fill="#e02b2b"/>
    <path d="M 703 312 L 703 342 L 730 327 Z" fill="#ffffff"/>
    <rect x="775" y="300" width="70" height="54" rx="8" fill="#1a1a1a"/>
    <text x="810" y="337" font-family="sans-serif" font-size="26" font-weight="bold" fill="#e02b2b" text-anchor="middle">N</text>
    <text x="760" y="405" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">YouTube · Netflix</text>
  </g>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8" text-anchor="end">4</text>
</svg>
