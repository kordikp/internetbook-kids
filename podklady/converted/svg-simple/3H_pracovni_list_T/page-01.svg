<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" role="img" lang="cs">
<title>Pracovní list č. 3T – Digitální stopa</title>
<desc>Pracovní list k těžší variantě lekce: co si o žákovi myslí Instagram, odhady z historie vyhledávání, výhody a nevýhody cookies a pět pravidel pro zacházení s datovou stopou.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
<text x="45" y="40" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#555">PRACOVNÍ LIST č.3T</text>
<text x="440" y="40" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#888">jméno:</text>
<line x1="490" y1="43" x2="745" y2="43" stroke="#bbb" stroke-width="1"/>
<text x="45" y="78" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#000">DIGITÁLNÍ STOPA</text>
<text x="45" y="112" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">1.</text>
<text x="75" y="112" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">Co si o vás asi myslí Instagram?</text>
<text x="45" y="225" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">2.</text>
<text x="75" y="225" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">Zde vidíme historii vyhledávání nějakého uživatele internetu.</text>
<g role="img"><title>Historie vyhledávání: je křeček vhodný k dítěti; nejlepší zš v praze; jak velkou klec potřebuji pro křečka</title>
<rect x="45" y="245" width="340" height="95" rx="6" fill="none" stroke="#aaa" stroke-width="1.5"/>
<circle cx="84" cy="260" r="8" fill="none" stroke="#777" stroke-width="1.5"/><path d="M84,255 L84,260 L89,262" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="104" y="265" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#6a3fc0">je křeček vhodný k dítěti</text>
<circle cx="84" cy="285" r="8" fill="none" stroke="#777" stroke-width="1.5"/><path d="M84,280 L84,285 L89,287" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="104" y="290" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#6a3fc0">nejlepší zš v praze</text>
<circle cx="84" cy="310" r="8" fill="none" stroke="#777" stroke-width="1.5"/><path d="M84,305 L84,310 L89,312" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="104" y="315" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#6a3fc0">jak velkou klec potřebuji pro křečka</text>
</g>
<text x="420" y="268" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">Co všechno bychom o něm mohli</text>
<text x="420" y="287" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">odhadovat? Vymyslete a zdůvodněte</text>
<text x="420" y="306" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">co nejvíc odpovědí:</text>
<text x="45" y="560" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">3.</text>
<text x="75" y="560" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">Napište alespoň 2 výhody a 2 nevýhody ukládání souborů COOKIES</text>
<text x="220" y="598" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">VÝHODY</text>
<text x="575" y="598" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">NEVÝHODY</text>
<line x1="397" y1="582" x2="397" y2="745" stroke="#777" stroke-width="1.5"/>
<text x="45" y="790" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">4.</text>
<text x="75" y="790" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">Ve skupině zformulujte 5 pravidel, jak zacházet s datovou stopou,</text>
<text x="75" y="809" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">aby nemohla být zneužita proti nám.</text>
<text x="75" y="830" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#000">Příklady rozumných pravidel můžete hledat i na internetu.</text>
<text x="50" y="872" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">1.</text>
<line x1="80" y1="876" x2="745" y2="876" stroke="#ddd" stroke-width="1"/>
<text x="50" y="918" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">2.</text>
<line x1="80" y1="922" x2="745" y2="922" stroke="#ddd" stroke-width="1"/>
<text x="50" y="964" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">3.</text>
<line x1="80" y1="968" x2="745" y2="968" stroke="#ddd" stroke-width="1"/>
<text x="50" y="1010" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">4.</text>
<line x1="80" y1="1014" x2="745" y2="1014" stroke="#ddd" stroke-width="1"/>
<text x="50" y="1056" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">5.</text>
<line x1="80" y1="1060" x2="745" y2="1060" stroke="#ddd" stroke-width="1"/>
<text x="45" y="1095" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#888">internet4kids.mff.cuni.cz</text>
<line x1="660" y1="1085" x2="745" y2="1085" stroke="#999" stroke-width="1"/>
<text x="745" y="1098" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#888">1</text>
</svg>
