<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" role="img" lang="cs">
  <title>Pracovní list č. 4L – Bingo</title>
  <desc>Pracovní list k opakovací hodině o internetu. Obsahuje prázdnou herní mřížku 3×3 na hru Bingo a třísloupcový výběr 29 pojmů, ze kterých žák vepisuje do políček.</desc>

  <g aria-label="Záhlaví listu">
    <text x="42" y="34" font-family="sans-serif" font-size="13" fill="#000">PRACOVNÍ LIST č.4L</text>
    <text x="460" y="34" font-family="sans-serif" font-size="13" fill="#777">jméno:</text>
    <line x1="510" y1="37" x2="700" y2="37" stroke="#bbb" stroke-width="1"/>
    <text x="42" y="64" font-family="sans-serif" font-size="26" font-weight="bold" fill="#000">BINGO</text>
  </g>

  <g aria-label="Herní mřížka Bingo 3×3 s prázdnými políčky">
    <rect x="42" y="80" width="710" height="680" fill="none" stroke="#999" stroke-width="1"/>
    <line x1="278.67" y1="80" x2="278.67" y2="760" stroke="#999" stroke-width="1"/>
    <line x1="515.33" y1="80" x2="515.33" y2="760" stroke="#999" stroke-width="1"/>
    <line x1="42" y1="306.67" x2="752" y2="306.67" stroke="#999" stroke-width="1"/>
    <line x1="42" y1="533.33" x2="752" y2="533.33" stroke="#999" stroke-width="1"/>
  </g>

  <g aria-label="Výběr pojmů" font-family="sans-serif" font-size="14" fill="#000">
    <text x="42" y="810" font-size="15" font-weight="bold">VÝBĚR POJMŮ</text>
    <g aria-label="První sloupec pojmů">
      <text x="55" y="845">• server</text>
      <text x="55" y="864">• síťový router</text>
      <text x="55" y="883">• datové centrum</text>
      <text x="55" y="902">• internet</text>
      <text x="55" y="921">• BTS</text>
      <text x="55" y="940">• cookies</text>
      <text x="55" y="959">• datová stopa</text>
      <text x="55" y="978">• IP adresa</text>
      <text x="55" y="997">• paket</text>
      <text x="55" y="1016">• satelit</text>
    </g>
    <g aria-label="Druhý sloupec pojmů">
      <text x="290" y="845">• mobilní data</text>
      <text x="290" y="864">• Wi-Fi</text>
      <text x="290" y="883">• bezdrátové připojení</text>
      <text x="290" y="902">• kabel</text>
      <text x="290" y="921">• personalizace</text>
      <text x="290" y="940">• Wi-Fi router</text>
      <text x="290" y="959">• speedtest</text>
      <text x="290" y="978">• centralizace</text>
      <text x="290" y="997">• decentralizace</text>
      <text x="290" y="1016">• poskytovatel internetu</text>
    </g>
    <g aria-label="Třetí sloupec pojmů">
      <text x="530" y="845">• hacker</text>
      <text x="530" y="864">• data</text>
      <text x="530" y="883">• hotspot</text>
      <text x="530" y="902">• SIM karta</text>
      <text x="530" y="921">• síť</text>
      <text x="530" y="940">• podmořské kabely</text>
      <text x="530" y="959">• požadavek na server</text>
      <text x="530" y="978">• IP adresa příjemce</text>
      <text x="530" y="997">• IP adresa odesílatele</text>
    </g>
  </g>

  <g aria-label="Zápatí" font-family="sans-serif" font-size="11" fill="#888">
    <text x="42" y="1090">internet4kids.mff.cuni.cz</text>
    <line x1="640" y1="1075" x2="752" y2="1075" stroke="#bbb" stroke-width="1"/>
    <text x="746" y="1090" text-anchor="end">1</text>
  </g>
</svg>
