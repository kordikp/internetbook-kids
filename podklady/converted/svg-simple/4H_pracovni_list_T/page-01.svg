<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" role="img" lang="cs">
  <title>Pracovní list č. 4T – Bingo</title>
  <desc>Pracovní list k opakovací hodině o internetu. Obsahuje prázdnou herní mřížku 3×3 na hru Bingo a třísloupcový výběr 31 pojmů, ze kterých žák vepisuje do políček.</desc>

  <g aria-label="Záhlaví listu">
    <text x="42" y="34" font-family="sans-serif" font-size="13" fill="#000">PRACOVNÍ LIST č.4T</text>
    <text x="460" y="34" font-family="sans-serif" font-size="13" fill="#777">jméno:</text>
    <line x1="510" y1="37" x2="700" y2="37" stroke="#bbb" stroke-width="1"/>
    <text x="42" y="64" font-family="sans-serif" font-size="26" font-weight="bold" fill="#000">BINGO</text>
  </g>

  <g aria-label="Herní mřížka Bingo 3×3 s prázdnými políčky">
    <rect x="42" y="80" width="710" height="680" fill="none" stroke="#999" stroke-width="1"/>
    <line x1="278.67" y1="80" x2="278.67" y2="760" stroke="#999" stroke-width="1"/>
    <line x1="515.33" y1="80" x2="515.33" y2="760" stroke="#999" stroke-width="1"/>
    <line x1="42" y1="306.67" x2="752" y2="306.67" stroke="#999" stroke-width="1"/>
    <line x1="42" y1="533.33" x2="752" y2="533.33" stroke="#999" stroke-width="1"/>
  </g>

  <g aria-label="Výběr pojmů" font-family="sans-serif" font-size="14" fill="#000">
    <text x="42" y="806" font-size="15" font-weight="bold">VÝBĚR POJMŮ</text>
    <g aria-label="První sloupec pojmů">
      <text x="55" y="838">• server</text>
      <text x="55" y="856">• síťový router</text>
      <text x="55" y="874">• datové centrum</text>
      <text x="55" y="892">• internet</text>
      <text x="55" y="910">• BTS</text>
      <text x="55" y="928">• cookies</text>
      <text x="55" y="946">• datová stopa</text>
      <text x="55" y="964">• IP adresa</text>
      <text x="55" y="982">• paket</text>
      <text x="55" y="1000">• satelit</text>
      <text x="55" y="1018">• mobilní data</text>
    </g>
    <g aria-label="Druhý sloupec pojmů">
      <text x="290" y="838">• Wi-Fi</text>
      <text x="290" y="856">• optický kabel</text>
      <text x="290" y="874">• bezdrátové připojení</text>
      <text x="290" y="892">• kovový kabel</text>
      <text x="290" y="910">• Wi-Fi router</text>
      <text x="290" y="928">• přenosová rychlost</text>
      <text x="290" y="946">• speedtest</text>
      <text x="290" y="964">• poskytovatel internetu</text>
      <text x="290" y="982">• páteřní síť</text>
      <text x="290" y="1000">• CETIN</text>
      <text x="290" y="1018">• hacker</text>
    </g>
    <g aria-label="Třetí sloupec pojmů">
      <text x="530" y="838">• hotspot</text>
      <text x="530" y="856">• SIM karta</text>
      <text x="530" y="874">• síť</text>
      <text x="530" y="892">• podmořské kabely</text>
      <text x="530" y="910">• požadavek na server</text>
      <text x="530" y="928">• klient-server</text>
      <text x="530" y="946">• traceroute</text>
      <text x="530" y="964">• IP adresa příjemce</text>
      <text x="530" y="982">• IP adresa odesílatele</text>
    </g>
  </g>

  <g aria-label="Zápatí" font-family="sans-serif" font-size="11" fill="#888">
    <text x="42" y="1090">internet4kids.mff.cuni.cz</text>
    <line x1="640" y1="1075" x2="752" y2="1075" stroke="#bbb" stroke-width="1"/>
    <text x="746" y="1090" text-anchor="end">1</text>
  </g>
</svg>
