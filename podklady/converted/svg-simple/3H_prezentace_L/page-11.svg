<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Vzpomeňte si…</title>
<desc>Šest dlaždic připomíná stopy, které žáci na internetu zanechali (fotky, označení, lajky, cookies, vyhledávání, navštěvované stránky); úkol: napsat, jak je vidí internet.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="480" y="60" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#000">Vzpomeňte si…</text>
<g role="img"><title>Fotografie: osoba na lodičce na vodě</title>
<rect x="45" y="100" width="280" height="130" rx="10" fill="none" stroke="#d97706" stroke-width="2.5"/>
<text x="185" y="143" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">na všechny fotky,</text>
<text x="185" y="165" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">které jste dali</text>
<text x="185" y="187" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">na Internet</text>
</g>
<g role="img"><title>Fotografie: dva lidé, jeden si dělá selfie</title>
<rect x="345" y="100" width="280" height="130" rx="10" fill="none" stroke="#d97706" stroke-width="2.5"/>
<text x="485" y="154" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">na příspěvky, na kterých</text>
<text x="485" y="176" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">vás označili kamarádi</text>
</g>
<g role="img"><title>Fotografie: palec nahoru — gesto like</title>
<rect x="645" y="100" width="280" height="130" rx="10" fill="none" stroke="#d97706" stroke-width="2.5"/>
<text x="785" y="154" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">co všechno jste</text>
<text x="785" y="176" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">olajkovali</text>
</g>
<g role="img"><title>Fotografie: talíř sušenek — vizuální hříčka cookies</title>
<rect x="45" y="250" width="280" height="130" rx="10" fill="none" stroke="#d97706" stroke-width="2.5"/>
<text x="185" y="304" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">kde všude jste povolili</text>
<text x="185" y="326" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">soubory cookies</text>
</g>
<g role="img"><title>Fotografie: osoba u notebooku s hrnkem</title>
<rect x="345" y="250" width="280" height="130" rx="10" fill="none" stroke="#d97706" stroke-width="2.5"/>
<text x="485" y="304" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">co jste si na Internetu</text>
<text x="485" y="326" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">hledali</text>
</g>
<g role="img"><title>Fotografie: notebook, telefon a zápisník na stole</title>
<rect x="645" y="250" width="280" height="130" rx="10" fill="none" stroke="#d97706" stroke-width="2.5"/>
<text x="785" y="293" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">jaké stránky navštěvujete</text>
<text x="785" y="315" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">a co na nich o sobě</text>
<text x="785" y="337" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">ukládáte</text>
</g>
<text x="480" y="460" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000">…a zkuste napsat, jak vás vidí Internet.</text>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">11</text>
</svg>
