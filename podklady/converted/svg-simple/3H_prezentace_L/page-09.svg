<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Co se stane, když potvrdíme cookies?</title>
<desc>Vysvětlení: počítač si volbu zapamatuje, stránka nás příště pozná a server o nás ukládá údaje. Kartotéka jako metafora složek uživatelů na serveru.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="480" y="70" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#000">Co se stane, když potvrdíme cookies?</text>
<g role="img"><title>Fotografie zásuvky kartotéky s papírovými složkami — metafora: server má o každém uživateli „složku"</title>
<rect x="70" y="160" width="250" height="260" rx="8" fill="none" stroke="#888" stroke-width="2"/>
<rect x="90" y="210" width="210" height="40" rx="3" fill="#f0e6d8" stroke="#b09a55" stroke-width="1.5"/>
<rect x="100" y="196" width="60" height="14" rx="3" fill="#f0e6d8" stroke="#b09a55" stroke-width="1.5"/>
<rect x="90" y="270" width="210" height="40" rx="3" fill="#f0e6d8" stroke="#b09a55" stroke-width="1.5"/>
<rect x="170" y="256" width="60" height="14" rx="3" fill="#f0e6d8" stroke="#b09a55" stroke-width="1.5"/>
<rect x="90" y="330" width="210" height="40" rx="3" fill="#f0e6d8" stroke="#b09a55" stroke-width="1.5"/>
<rect x="240" y="316" width="60" height="14" rx="3" fill="#f0e6d8" stroke="#b09a55" stroke-width="1.5"/>
<text x="195" y="400" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#777">kartotéka = server</text>
</g>
<text x="370" y="180" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#000">•  Náš počítač si naši volbu zapamatuje</text>
<text x="370" y="216" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#000">•  Webová stránka příště pozná,</text>
<text x="370" y="252" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#000">    že jsme to my</text>
<text x="370" y="288" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#000">•  Webový server dané stránky si o nás</text>
<text x="370" y="324" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#000">    ukládá různé údaje</text>
<text x="370" y="360" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#000">•  Kam klikáme, co jsme si dali do košíku,</text>
<text x="370" y="396" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#000">    herní skóre…</text>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">9</text>
</svg>
