<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Jak můžeme dinosaura rozebrat a poslat z muzea do muzea? (řešení)</title>
<desc>Řešení: plánek, očíslování kostí, označené krabice. Schéma dvou náklaďáků jedoucích různými trasami z muzea A do muzea B — analogie paketového přenosu.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="340" y="80" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#000">Jak můžeme dinosaura rozebrat</text>
<text x="340" y="120" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#000">a poslat z muzea do muzea?</text>
<g role="img"><title>Fotografie kostry velkého dinosaura (sauropoda) v muzejní expozici</title>
<rect x="50" y="60" width="250" height="160" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<rect x="120" y="135" width="110" height="10" fill="#bbb"/>
<circle cx="120" cy="133" r="8" fill="#bbb"/>
<circle cx="120" cy="147" r="8" fill="#bbb"/>
<circle cx="230" cy="133" r="8" fill="#bbb"/>
<circle cx="230" cy="147" r="8" fill="#bbb"/>
<text x="175.0" y="208" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#777">kostra dinosaura v muzeu</text>
</g>
<text x="360" y="190" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#000">•  Udělat si plánek dinosaura</text>
<text x="360" y="222" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#000">•  Očíslovat si kosti</text>
<text x="360" y="254" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#000">•  Uložit je do označených krabic</text>
<text x="470" y="330" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">Náklaďáky nemusí jet stejnou cestou</text>
<g aria-label="Muzeum A">
<rect x="40" y="420" width="130" height="60" rx="8" fill="none" stroke="#333" stroke-width="2"/>
<text x="105.0" y="456.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">Muzeum A</text>
</g>
<g aria-label="Muzeum B">
<rect x="800" y="420" width="130" height="60" rx="8" fill="#fde047" stroke="#333" stroke-width="2"/>
<text x="865.0" y="456.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">Muzeum B</text>
</g>
<g aria-label="Horní trasa: červený náklaďák jede přes dvě křižovatky">
<polyline points="170,440 250,440 250,380 620,380 620,435 795,435" fill="none" stroke="#a04030" stroke-width="3" marker-end="url(#arrR)"/>
<circle cx="250" cy="380" r="7" fill="#fff" stroke="#a04030" stroke-width="2"/>
<circle cx="620" cy="380" r="7" fill="#fff" stroke="#a04030" stroke-width="2"/>
<g fill="#a04030"><rect x="420" y="355" width="26" height="14" rx="2"/><rect x="446" y="360" width="12" height="9" rx="2"/><circle cx="428" cy="372" r="3.5"/><circle cx="451" cy="372" r="3.5"/></g>
</g>
<g aria-label="Spodní trasa: fialový náklaďák jede jinou cestou přes jiné křižovatky">
<polyline points="170,465 260,465 260,515 640,515 640,465 795,465" fill="none" stroke="#6a3fc0" stroke-width="3" marker-end="url(#arrP)"/>
<circle cx="260" cy="515" r="7" fill="#fff" stroke="#6a3fc0" stroke-width="2"/>
<circle cx="640" cy="515" r="7" fill="#fff" stroke="#6a3fc0" stroke-width="2"/>
<g fill="#6a3fc0"><rect x="430" y="490" width="26" height="14" rx="2"/><rect x="456" y="495" width="12" height="9" rx="2"/><circle cx="438" cy="507" r="3.5"/><circle cx="461" cy="507" r="3.5"/></g>
</g>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">3</text>
</svg>
