<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Jak můžeme dinosaura rozebrat a poslat z muzea do muzea?</title>
<desc>Motivační problém: přesun kostry dinosaura mezi muzei. Schéma: muzeum A, neznámý způsob přepravy (otazník), cílové muzeum B.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="360" y="140" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#000">Jak můžeme dinosaura</text>
<text x="360" y="184" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#000">rozebrat a poslat</text>
<text x="360" y="228" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#000">z muzea do muzea?</text>
<g role="img"><title>Fotografie kostry velkého dinosaura (sauropoda) v muzejní expozici</title>
<rect x="50" y="90" width="260" height="170" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<rect x="123" y="170" width="114" height="10" fill="#bbb"/>
<circle cx="123" cy="168" r="8" fill="#bbb"/>
<circle cx="123" cy="182" r="8" fill="#bbb"/>
<circle cx="237" cy="168" r="8" fill="#bbb"/>
<circle cx="237" cy="182" r="8" fill="#bbb"/>
<text x="180.0" y="248" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#777">kostra dinosaura v muzeu</text>
</g>
<line x1="180" y1="260" x2="180" y2="390" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<g aria-label="Muzeum A">
<rect x="120" y="400" width="140" height="60" rx="8" fill="none" stroke="#333" stroke-width="2"/>
<text x="190.0" y="436.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">Muzeum A</text>
</g>
<line x1="260" y1="430" x2="445" y2="430" stroke="#555" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="480" cy="430" r="30" fill="none" stroke="#555" stroke-width="2"/>
<text x="480" y="440" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#000">?</text>
<line x1="515" y1="430" x2="695" y2="430" stroke="#555" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr)"/>
<g aria-label="Muzeum B">
<rect x="700" y="400" width="140" height="60" rx="8" fill="#fde047" stroke="#333" stroke-width="2"/>
<text x="770.0" y="436.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">Muzeum B</text>
</g>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">2</text>
</svg>
