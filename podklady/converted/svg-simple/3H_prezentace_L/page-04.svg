<rect x="38" y="190" width="30" height="150" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="53" y="212" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6a3fc0">M</text>
