<text x="730" y="450" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#b33939">nevýhody</text>
<text x="480" y="335" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#8a6d1a">obojí</text>
