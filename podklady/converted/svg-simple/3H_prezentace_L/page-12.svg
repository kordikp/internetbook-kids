<rect x="395" y="250" width="170" height="160" rx="0" fill="#fde68a" stroke="none" stroke-width="1.5"/>
<rect x="120" y="180" width="445" height="230" rx="60" fill="none" stroke="#6a3fc0" stroke-width="3"/>
<rect x="395" y="250" width="445" height="230" rx="60" fill="none" stroke="#b33939" stroke-width="3"/>
