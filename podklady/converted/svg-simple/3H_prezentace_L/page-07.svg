<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Kdo platí internet?</title>
<desc>Otázka pro diskuzi o financování internetu; v originále na pozadí fotografie českých bankovek a mincí.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<g role="img"><title>Fotografie českých peněz: stokorunová bankovka a mince 1, 2 a 10 Kč</title>
<rect x="330" y="300" width="200" height="100" rx="8" fill="#efe7f5" stroke="#9a86b8" stroke-width="2"/>
<text x="430" y="356" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#6a5588">100 Kč</text>
<circle cx="590" cy="330" r="26" fill="#f3ead0" stroke="#b09a55" stroke-width="2"/>
<text x="590" y="337" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8a7433">10</text>
<circle cx="640" cy="375" r="20" fill="#f3ead0" stroke="#b09a55" stroke-width="2"/>
<text x="640" y="381" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8a7433">2</text>
<circle cx="595" cy="405" r="16" fill="#f3ead0" stroke="#b09a55" stroke-width="2"/>
<text x="595" y="411" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#8a7433">1</text>
</g>
<text x="480" y="220" font-family="sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="#000">KDO PLATÍ INTERNET?</text>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">7</text>
</svg>
