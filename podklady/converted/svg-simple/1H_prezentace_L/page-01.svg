<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>JAK VYPADÁ INTERNET?</title>
  <desc>Titulní slide prezentace na tmavě fialovém pozadí se stylizovanou mapou světa, na níž jsou uzly na kontinentech propojené obloukovými spoji – symbol celosvětové propojenosti internetu.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#4a3a9e"/>
  <g role="img" aria-label="Stylizovaná mapa světa s propojenými uzly">
    <title>Stylizovaná mapa světa: uzly na Severní Americe, Jižní Americe, Evropě, Asii a Austrálii propojené růžovými oblouky.</title>
    <!-- zjednodušené obrysy kontinentů -->
    <ellipse cx="200" cy="180" rx="90" ry="60" fill="#5a4ab0"/>
    <ellipse cx="260" cy="330" rx="50" ry="80" fill="#5a4ab0"/>
    <ellipse cx="480" cy="160" rx="60" ry="45" fill="#5a4ab0"/>
    <ellipse cx="520" cy="300" rx="45" ry="70" fill="#5a4ab0"/>
    <ellipse cx="680" cy="190" rx="110" ry="70" fill="#5a4ab0"/>
    <ellipse cx="770" cy="380" rx="55" ry="35" fill="#5a4ab0"/>
    <!-- spoje -->
    <path d="M 200 170 Q 340 60 480 150" fill="none" stroke="#e87ba0" stroke-width="2"/>
    <path d="M 480 150 Q 580 90 680 180" fill="none" stroke="#e87ba0" stroke-width="2"/>
    <path d="M 260 320 Q 380 260 480 160" fill="none" stroke="#e87ba0" stroke-width="2"/>
    <path d="M 680 190 Q 740 290 770 375" fill="none" stroke="#e87ba0" stroke-width="2"/>
    <path d="M 200 180 Q 240 260 260 320" fill="none" stroke="#e87ba0" stroke-width="2"/>
    <!-- uzly -->
    <circle cx="200" cy="175" r="8" fill="#c9407a"/>
    <circle cx="260" cy="320" r="8" fill="#c9407a"/>
    <circle cx="480" cy="155" r="8" fill="#c9407a"/>
    <circle cx="680" cy="185" r="8" fill="#c9407a"/>
    <circle cx="770" cy="375" r="8" fill="#c9407a"/>
  </g>
  <text x="480" y="270" font-family="sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">JAK VYPADÁ INTERNET?</text>
  <text x="480" y="330" font-family="sans-serif" font-size="24" fill="#f5c518" text-anchor="middle">internet4kids.mff.cuni.cz</text>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8">Matfyz (MFF UK) · Pedagogická fakulta UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8" text-anchor="end">1</text>
</svg>
