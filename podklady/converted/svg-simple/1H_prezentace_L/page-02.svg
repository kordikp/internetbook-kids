<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Co můžeme dělat na mobilu, počítači nebo tabletu…</title>
  <desc>Úvodní otázka: co můžeme na digitálních zařízeních dělat online a co offline. Pod textem jsou zjednodušené ikony telefonu, notebooku a tabletu.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text x="480" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Co můžeme dělat na mobilu, počítači nebo tabletu,</text>
  <text x="480" y="118" font-family="sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle">když <tspan font-weight="bold" fill="#6644cc">jsme připojeni</tspan> k internetu a co můžeme dělat,</text>
  <text x="480" y="152" font-family="sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle">když <tspan font-weight="bold" fill="#e05252">připojeni nejsme</tspan>?</text>
  <g aria-label="Chytrý telefon">
    <title>Chytrý telefon s barevnými bloky aplikací na displeji</title>
    <rect x="180" y="230" width="110" height="200" rx="14" fill="none" stroke="#333333" stroke-width="3"/>
    <rect x="198" y="255" width="74" height="40" fill="#6644cc"/>
    <rect x="198" y="305" width="74" height="40" fill="#e05252"/>
    <rect x="198" y="355" width="74" height="40" fill="#f5c518"/>
    <text x="235" y="460" font-family="sans-serif" font-size="16" fill="#555555" text-anchor="middle">mobil</text>
  </g>
  <g aria-label="Notebook">
    <title>Otevřený notebook s webovou stránkou na obrazovce</title>
    <rect x="390" y="250" width="220" height="140" rx="8" fill="none" stroke="#333333" stroke-width="3"/>
    <rect x="408" y="268" width="90" height="50" fill="#6644cc"/>
    <rect x="508" y="268" width="84" height="24" fill="#f5c518"/>
    <rect x="508" y="300" width="84" height="18" fill="#e05252"/>
    <rect x="408" y="328" width="184" height="44" fill="#eeeeee"/>
    <rect x="370" y="392" width="260" height="12" rx="6" fill="#333333"/>
    <text x="500" y="460" font-family="sans-serif" font-size="16" fill="#555555" text-anchor="middle">počítač</text>
  </g>
  <g aria-label="Tablet">
    <title>Tablet s barevnými bloky obsahu</title>
    <rect x="690" y="240" width="150" height="190" rx="12" fill="none" stroke="#333333" stroke-width="3"/>
    <rect x="706" y="260" width="118" height="60" fill="#e05252"/>
    <rect x="706" y="330" width="55" height="55" fill="#f5c518"/>
    <rect x="770" y="330" width="54" height="55" fill="#6644cc"/>
    <text x="765" y="460" font-family="sans-serif" font-size="16" fill="#555555" text-anchor="middle">tablet</text>
  </g>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#999999">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="end">2</text>
</svg>
