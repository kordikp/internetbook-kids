<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Má internet řídící centrum nebo ředitele? – NE</title>
  <desc>Odpověď na první diskusní otázku: internet nemá řídící centrum ani ředitele, je to decentralizovaná síť. Dokládá to mapa datových center rozprostřených po celém světě.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#4a3a9e"/>
  <g aria-label="Otázka s odpovědí NE">
    <rect x="60" y="40" width="620" height="100" rx="16" fill="#e8823c"/>
    <text x="370" y="83" font-family="sans-serif" font-size="23" fill="#ffffff" text-anchor="middle">Má internet nějaké</text>
    <text x="370" y="116" font-family="sans-serif" font-size="23" font-weight="bold" fill="#ffffff" text-anchor="middle">řídící centrum nebo ředitele?</text>
    <text x="810" y="115" font-family="sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">NE</text>
  </g>
  <text x="480" y="185" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">Internet je <tspan font-weight="bold" fill="#f5c518">decentralizovaná</tspan> síť (nemá centrum).</text>
  <g role="img" aria-label="Mapa datových center světa">
    <title>Mapa světa s bublinovým kartogramem počtu datových center (kroužky 194 až 1, zeleně země s nadprůměrným podílem uživatelů internetu) – servery jsou rozprostřeny po celém světě, žádné jediné centrum neexistuje.</title>
    <rect x="150" y="215" width="660" height="250" rx="10" fill="#f2f6fa" stroke="#b9aee8" stroke-width="2"/>
    <ellipse cx="290" cy="300" rx="70" ry="42" fill="#bfe3bf"/>
    <ellipse cx="480" cy="290" rx="42" ry="30" fill="#bfe3bf"/>
    <ellipse cx="630" cy="305" rx="75" ry="45" fill="#dddddd"/>
    <ellipse cx="340" cy="395" rx="35" ry="45" fill="#dddddd"/>
    <ellipse cx="510" cy="390" rx="30" ry="45" fill="#dddddd"/>
    <ellipse cx="700" cy="415" rx="40" ry="22" fill="#bfe3bf"/>
    <circle cx="250" cy="295" r="24" fill="#8a6fd0" fill-opacity="0.7"/>
    <circle cx="325" cy="300" r="17" fill="#8a6fd0" fill-opacity="0.7"/>
    <circle cx="478" cy="285" r="20" fill="#8a6fd0" fill-opacity="0.7"/>
    <circle cx="655" cy="300" r="10" fill="#8a6fd0" fill-opacity="0.7"/>
    <circle cx="565" cy="330" r="7" fill="#8a6fd0" fill-opacity="0.7"/>
    <circle cx="350" cy="390" r="6" fill="#8a6fd0" fill-opacity="0.7"/>
    <circle cx="515" cy="400" r="5" fill="#8a6fd0" fill-opacity="0.7"/>
    <circle cx="705" cy="415" r="6" fill="#8a6fd0" fill-opacity="0.7"/>
    <text x="480" y="448" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">datová centra jsou po celém světě – žádné jediné centrum</text>
  </g>
  <text x="150" y="490" font-family="sans-serif" font-size="10" fill="#b9aee8">Zdroj mapy: © FNSP – Sciences Po, Atelier de cartographie, 2018; cable data by Greg Mahlknecht; CC BY-SA 2.0</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8" text-anchor="end">15</text>
</svg>
