<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Diskutujte ve skupině – první otázka zodpovězena (NE)</title>
  <desc>Stejný slide jako otázky k diskusi, ale první rámeček je zašedlý s velkým nápisem NE; druhá otázka o překopnutém kabelu zůstává aktivní.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#4a3a9e"/>
  <text x="480" y="80" font-family="sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">Diskutujte ve skupině</text>
  <g aria-label="Otázka 1 – zodpovězena NE">
    <rect x="140" y="130" width="680" height="110" rx="16" fill="#8a8a99"/>
    <text x="480" y="178" font-family="sans-serif" font-size="24" fill="#cccccc" text-anchor="middle">1. Má internet nějaké</text>
    <text x="480" y="212" font-family="sans-serif" font-size="24" fill="#cccccc" text-anchor="middle">řídící centrum nebo ředitele?</text>
    <text x="480" y="205" font-family="sans-serif" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">NE</text>
  </g>
  <g aria-label="Otázka 2">
    <rect x="140" y="280" width="680" height="170" rx="16" fill="#e05252"/>
    <text x="480" y="322" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">2. Co by se stalo, kdyby někdo <tspan font-weight="bold">překopl internetový kabel</tspan></text>
    <text x="480" y="352" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">vedoucí mezi Prahou a Brnem?</text>
    <text x="480" y="392" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">Budeme moci z Brna napsat zprávu přes Instagram</text>
    <text x="480" y="422" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">kamarádce, která je v Praze?</text>
  </g>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#b9aee8" text-anchor="end">16</text>
</svg>
