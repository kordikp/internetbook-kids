<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>KABELY – mapa podmořských kabelů</title>
  <desc>Velká mapa světa s globální sítí podmořských internetových kabelů: nejhustší svazky spojují Severní Ameriku s Evropou přes Atlantik, Evropu s Asií přes Rudé moře a východní Asii s USA přes Pacifik.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text x="480" y="60" font-family="sans-serif" font-size="40" font-weight="bold" fill="#1a1a1a" text-anchor="middle">KABELY</text>
  <g role="img" aria-label="Mapa podmořských internetových kabelů">
    <title>Mapa světa: červené linky podmořských kabelů podél pobřeží a napříč oceány; hlavní svazky Severní Amerika–Evropa (severní Atlantik), Evropa–Asie (Rudé moře, Indický oceán) a východní Asie–USA (Pacifik).</title>
    <rect x="60" y="90" width="840" height="360" rx="10" fill="#eef4fa" stroke="#999999" stroke-width="2"/>
    <!-- kontinenty -->
    <ellipse cx="220" cy="200" rx="90" ry="55" fill="#dddddd"/>
    <ellipse cx="285" cy="330" rx="45" ry="65" fill="#dddddd"/>
    <ellipse cx="470" cy="185" rx="50" ry="40" fill="#dddddd"/>
    <ellipse cx="495" cy="310" rx="42" ry="62" fill="#dddddd"/>
    <ellipse cx="660" cy="200" rx="100" ry="60" fill="#dddddd"/>
    <ellipse cx="760" cy="370" rx="50" ry="28" fill="#dddddd"/>
    <!-- kabely Atlantik -->
    <path d="M 300 180 C 360 150 400 160 430 175" fill="none" stroke="#4a7fd0" stroke-width="3"/>
    <path d="M 300 195 C 360 170 400 180 430 190" fill="none" stroke="#e05252" stroke-width="2"/>
    <path d="M 300 210 C 360 195 400 200 430 205" fill="none" stroke="#e05252" stroke-width="2"/>
    <!-- kabely Evropa–Asie -->
    <path d="M 500 220 C 540 260 580 250 620 230" fill="none" stroke="#e05252" stroke-width="2"/>
    <path d="M 505 235 C 545 285 600 280 650 250" fill="none" stroke="#e05252" stroke-width="2"/>
    <!-- kabely Pacifik -->
    <path d="M 750 190 C 810 170 860 175 895 185" fill="none" stroke="#e05252" stroke-width="2"/>
    <path d="M 150 190 C 110 185 80 190 65 195" fill="none" stroke="#e05252" stroke-width="2"/>
    <!-- kabely k Austrálii a Africe -->
    <path d="M 700 250 C 730 310 750 340 760 360" fill="none" stroke="#e05252" stroke-width="2"/>
    <path d="M 500 360 C 550 390 650 390 740 375" fill="none" stroke="#e05252" stroke-width="2"/>
    <path d="M 300 330 C 360 360 430 360 480 340" fill="none" stroke="#e05252" stroke-width="2"/>
    <text x="365" y="140" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">severní Atlantik – nejhustší svazek</text>
    <text x="820" y="230" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">Pacifik</text>
  </g>
  <text x="60" y="480" font-family="sans-serif" font-size="11" fill="#999999">Zdroj: cable data by Greg Mahlknecht, map by Openstreetmap contributors; CC BY-SA 2.0</text>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#999999">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="end">12</text>
</svg>
