<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>CHYTRÉ KŘIŽOVATKY</title>
  <desc>Schéma části internetové sítě: klient (notebook) vlevo nahoře, síť sedmi routerů propojených kabely a server v domečku vpravo dole. Mezi klientem a serverem vede více možných cest.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text x="480" y="60" font-family="sans-serif" font-size="42" font-weight="bold" fill="#e05252" text-anchor="middle">CHYTRÉ KŘIŽOVATKY</text>
  <!-- kabely mezi routery -->
  <g aria-label="Kabely propojující routery">
    <path d="M 260 200 C 350 160 420 150 490 165" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 490 165 C 580 185 640 200 720 210" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 490 165 C 480 230 470 280 450 330" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 720 210 C 660 260 560 300 450 330" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 720 210 C 800 230 870 250 940 260" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 450 330 C 350 360 250 390 165 415" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 165 415 C 260 440 350 450 440 450" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 440 450 C 550 450 620 440 690 420" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 450 330 C 540 360 620 395 690 420" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 690 420 L 800 420" fill="none" stroke="#333333" stroke-width="4"/>
    <path d="M 20 430 L 165 415" fill="none" stroke="#333333" stroke-width="4"/>
  </g>
  <!-- routery -->
  <g aria-label="Routery – křižovatky sítě">
    <rect x="455" y="150" width="70" height="26" rx="4" fill="#4a4a55"/>
    <rect x="685" y="197" width="70" height="26" rx="4" fill="#4a4a55"/>
    <rect x="415" y="317" width="70" height="26" rx="4" fill="#4a4a55"/>
    <rect x="130" y="402" width="70" height="26" rx="4" fill="#4a4a55"/>
    <rect x="405" y="437" width="70" height="26" rx="4" fill="#4a4a55"/>
    <rect x="655" y="407" width="70" height="26" rx="4" fill="#4a4a55"/>
    <circle cx="470" cy="163" r="3" fill="#7ee07e"/><circle cx="700" cy="210" r="3" fill="#7ee07e"/>
    <circle cx="430" cy="330" r="3" fill="#7ee07e"/><circle cx="145" cy="415" r="3" fill="#7ee07e"/>
    <circle cx="420" cy="450" r="3" fill="#7ee07e"/><circle cx="670" cy="420" r="3" fill="#7ee07e"/>
    <text x="450" y="300" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e05252" text-anchor="middle">router</text>
  </g>
  <g aria-label="Klient – notebook">
    <title>Notebook s webovou stránkou a ikonami aplikací – klient</title>
    <text x="175" y="105" font-family="sans-serif" font-size="22" font-weight="bold" fill="#6644cc" text-anchor="middle">klient</text>
    <rect x="110" y="120" width="130" height="80" rx="6" fill="none" stroke="#333333" stroke-width="3"/>
    <rect x="122" y="132" width="50" height="30" fill="#e8823c"/>
    <rect x="180" y="132" width="48" height="14" fill="#f5c518"/>
    <rect x="122" y="170" width="106" height="20" fill="#eeeeee"/>
    <rect x="95" y="200" width="160" height="10" rx="5" fill="#333333"/>
    <text x="175" y="235" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">prohlížeče a aplikace</text>
  </g>
  <g aria-label="Server v domečku">
    <title>Domeček se třemi serverovými jednotkami v racku – server</title>
    <path d="M 790 330 L 865 285 L 940 330 Z" fill="#e8823c"/>
    <rect x="800" y="330" width="130" height="120" fill="none" stroke="#333333" stroke-width="3"/>
    <rect x="815" y="345" width="100" height="26" rx="3" fill="#4a4a55"/>
    <rect x="815" y="378" width="100" height="26" rx="3" fill="#4a4a55"/>
    <rect x="815" y="411" width="100" height="26" rx="3" fill="#4a4a55"/>
    <circle cx="827" cy="358" r="3" fill="#7ee07e"/><circle cx="827" cy="391" r="3" fill="#7ee07e"/><circle cx="827" cy="424" r="3" fill="#7ee07e"/>
    <text x="865" y="480" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3a2a80" text-anchor="middle">server</text>
  </g>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#999999">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="end">13</text>
</svg>
