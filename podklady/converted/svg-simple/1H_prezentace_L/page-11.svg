<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>KABELY</title>
  <desc>Slide o internetových kabelech: čtyři kruhové fotografie (pokládka optických kabelů do výkopu, podmořský kabel na pobřeží, mapa podmořských kabelů, potápěč u kabelu na mořském dně) nahrazené piktogramy s popisky.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text x="480" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#1a1a1a" text-anchor="middle">KABELY</text>
  <!-- pozadí: propletené kabely -->
  <path d="M 0 480 C 200 420 400 520 960 460" fill="none" stroke="#e8a04a" stroke-width="5"/>
  <path d="M 0 495 C 200 435 400 535 960 475" fill="none" stroke="#333333" stroke-width="3"/>
  <g role="img" aria-label="Pokládka optických kabelů">
    <title>Dělníci ve žlutých reflexních vestách pokládají svazek zelených optických kabelů do výkopu.</title>
    <circle cx="180" cy="240" r="95" fill="#f7f7f7" stroke="#999999" stroke-width="2"/>
    <path d="M 120 280 L 160 280 L 170 300 L 190 300 L 200 280 L 240 280" fill="none" stroke="#8a6a3a" stroke-width="6"/>
    <path d="M 110 250 C 150 235 210 235 250 250" fill="none" stroke="#3a9e3a" stroke-width="5"/>
    <path d="M 110 260 C 150 245 210 245 250 260" fill="none" stroke="#3a9e3a" stroke-width="5"/>
    <text x="180" y="360" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">pokládka kabelů do výkopu</text>
  </g>
  <g role="img" aria-label="Podmořský kabel na pobřeží">
    <title>Podmořský kabel s ochranným článkovaným pláštěm ležící na kamenitém pobřeží.</title>
    <circle cx="390" cy="240" r="95" fill="#f7f7f7" stroke="#999999" stroke-width="2"/>
    <path d="M 310 270 C 350 230 430 260 470 220" fill="none" stroke="#555555" stroke-width="12"/>
    <path d="M 310 270 C 350 230 430 260 470 220" fill="none" stroke="#aaaaaa" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="330" cy="295" r="8" fill="#cccccc"/><circle cx="355" cy="300" r="6" fill="#bbbbbb"/><circle cx="380" cy="297" r="7" fill="#cccccc"/>
    <text x="390" y="360" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">podmořský kabel na pobřeží</text>
  </g>
  <g role="img" aria-label="Mapa podmořských kabelů">
    <title>Mapa světa s trasami podmořských kabelů přes Atlantik mezi Amerikou, Evropou a Afrikou.</title>
    <circle cx="600" cy="240" r="95" fill="#eef4fa" stroke="#999999" stroke-width="2"/>
    <ellipse cx="555" cy="215" rx="28" ry="35" fill="#dddddd"/>
    <ellipse cx="655" cy="215" rx="22" ry="28" fill="#dddddd"/>
    <ellipse cx="650" cy="285" rx="20" ry="26" fill="#dddddd"/>
    <path d="M 565 200 C 600 190 620 200 648 208" fill="none" stroke="#e05252" stroke-width="2"/>
    <path d="M 570 225 C 600 225 620 230 645 235" fill="none" stroke="#4a7fd0" stroke-width="2"/>
    <path d="M 570 240 C 600 260 620 270 642 280" fill="none" stroke="#e05252" stroke-width="2"/>
    <text x="600" y="360" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">mapa podmořských kabelů</text>
  </g>
  <g role="img" aria-label="Potápěč kontroluje kabel">
    <title>Potápěč ve výstroji kontroluje kabel položený na mořském dně mezi korály.</title>
    <circle cx="810" cy="240" r="95" fill="#e8f2f8" stroke="#999999" stroke-width="2"/>
    <circle cx="790" cy="205" r="14" fill="none" stroke="#333333" stroke-width="3"/>
    <line x1="790" y1="219" x2="790" y2="255" stroke="#333333" stroke-width="3"/>
    <line x1="790" y1="230" x2="815" y2="245" stroke="#333333" stroke-width="3"/>
    <line x1="790" y1="255" x2="775" y2="285" stroke="#333333" stroke-width="3"/>
    <line x1="790" y1="255" x2="808" y2="285" stroke="#333333" stroke-width="3"/>
    <path d="M 730 295 C 770 285 850 305 890 290" fill="none" stroke="#555555" stroke-width="8"/>
    <text x="810" y="360" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">potápěč u kabelu na dně</text>
  </g>
  <text x="40" y="430" font-family="sans-serif" font-size="11" fill="#999999">Zdroj: cable data by Greg Mahlknecht, map by Openstreetmap contributors; CC BY-SA 2.0</text>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#999999">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="end">11</text>
</svg>
