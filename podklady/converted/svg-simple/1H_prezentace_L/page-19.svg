<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>Správné odpovědi přiřazovací úlohy</title>
  <desc>Řešení přiřazovací úlohy: server = 2 (počítač s daty poskytující služby), datové centrum = 1 (prostor se servery), Wi-Fi router = 4 (umožňuje připojení přes Wi-Fi), síťový router = 3 (směruje data k cíli).</desc>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text x="480" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Správné odpovědi</text>
  <g aria-label="server = 2">
    <rect x="60" y="100" width="220" height="70" rx="10" fill="#f0b060" stroke="#e8823c" stroke-width="3"/>
    <text x="170" y="142" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">server</text>
    <text x="330" y="125" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6644cc">2.</text>
    <text x="360" y="125" font-family="sans-serif" font-size="17" fill="#1a1a1a">Počítač, kde je uloženo velké množství dat (například</text>
    <text x="360" y="148" font-family="sans-serif" font-size="17" fill="#1a1a1a">webové stránky, videa či naše zprávy), a který</text>
    <text x="360" y="171" font-family="sans-serif" font-size="17" fill="#1a1a1a">poskytuje nějaké služby.</text>
  </g>
  <g aria-label="datové centrum = 1">
    <rect x="60" y="205" width="220" height="70" rx="10" fill="#f0b060" stroke="#e8823c" stroke-width="3"/>
    <text x="170" y="247" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">datové centrum</text>
    <text x="330" y="245" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6644cc">1.</text>
    <text x="360" y="245" font-family="sans-serif" font-size="17" fill="#1a1a1a">Prostor, kde se nachází velké množství serverů.</text>
  </g>
  <g aria-label="Wi-Fi router = 4">
    <rect x="60" y="310" width="220" height="70" rx="10" fill="#f0b060" stroke="#e8823c" stroke-width="3"/>
    <text x="170" y="352" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Wi-Fi router</text>
    <text x="330" y="350" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6644cc">4.</text>
    <text x="360" y="350" font-family="sans-serif" font-size="17" fill="#1a1a1a">Zařízení, které nám umožňuje se připojit přes Wi-Fi.</text>
  </g>
  <g aria-label="síťový router = 3">
    <rect x="60" y="415" width="220" height="70" rx="10" fill="#f0b060" stroke="#e8823c" stroke-width="3"/>
    <text x="170" y="457" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">síťový router</text>
    <text x="330" y="445" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6644cc">3.</text>
    <text x="360" y="445" font-family="sans-serif" font-size="17" fill="#1a1a1a">Po internetové síti směruje data až k cíli</text>
    <text x="360" y="468" font-family="sans-serif" font-size="17" fill="#1a1a1a">(např. k serveru webové stránky).</text>
  </g>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="end">19</text>
</svg>
