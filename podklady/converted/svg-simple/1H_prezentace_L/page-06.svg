<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
  <title>SERVERY</title>
  <desc>Definice serveru: servery jsou počítače, kde je uloženo velké množství dat a které poskytují služby; nacházejí se v datových centrech. Vlevo rack se čtyřmi servery, vpravo náznak fotografie interiéru datového centra.</desc>
  <rect x="0" y="0" width="960" height="540" fill="#f7c94b"/>
  <text x="60" y="70" font-family="sans-serif" font-size="40" font-weight="bold" fill="#1a1a1a">SERVERY</text>
  <text x="60" y="115" font-family="sans-serif" font-size="22" fill="#1a1a1a">jsou <tspan font-weight="bold">počítače</tspan>, kde je <tspan font-weight="bold">uloženo</tspan> velké množství dat,</text>
  <text x="60" y="145" font-family="sans-serif" font-size="22" fill="#1a1a1a">a které poskytují nějaké <tspan font-weight="bold">služby</tspan>.</text>
  <text x="60" y="185" font-family="sans-serif" font-size="22" fill="#1a1a1a">Nacházejí se uvnitř <tspan font-weight="bold">datových center</tspan>.</text>
  <g aria-label="Rack se čtyřmi servery">
    <title>Ilustrace čtyř serverů naskládaných na sobě v racku, s kontrolkami a větracími otvory</title>
    <rect x="120" y="240" width="240" height="220" rx="8" fill="none" stroke="#333333" stroke-width="3"/>
    <rect x="135" y="255" width="210" height="42" rx="4" fill="#4a4a55"/>
    <rect x="135" y="307" width="210" height="42" rx="4" fill="#4a4a55"/>
    <rect x="135" y="359" width="210" height="42" rx="4" fill="#4a4a55"/>
    <rect x="135" y="411" width="210" height="42" rx="4" fill="#4a4a55"/>
    <circle cx="155" cy="276" r="4" fill="#7ee07e"/><circle cx="170" cy="276" r="4" fill="#f5c518"/>
    <circle cx="155" cy="328" r="4" fill="#7ee07e"/><circle cx="170" cy="328" r="4" fill="#f5c518"/>
    <circle cx="155" cy="380" r="4" fill="#7ee07e"/><circle cx="170" cy="380" r="4" fill="#f5c518"/>
    <circle cx="155" cy="432" r="4" fill="#7ee07e"/><circle cx="170" cy="432" r="4" fill="#f5c518"/>
    <rect x="250" y="266" width="80" height="20" fill="#2e2e38"/>
    <rect x="250" y="318" width="80" height="20" fill="#2e2e38"/>
    <rect x="250" y="370" width="80" height="20" fill="#2e2e38"/>
    <rect x="250" y="422" width="80" height="20" fill="#2e2e38"/>
  </g>
  <line x1="360" y1="350" x2="560" y2="350" stroke="#333333" stroke-width="2"/>
  <g role="img" aria-label="Fotografie interiéru datového centra">
    <title>Kruhová fotografie: skutečný interiér datového centra – dlouhá řada vysokých černých serverových skříní v chodbě.</title>
    <circle cx="700" cy="350" r="130" fill="#ffffff" stroke="#333333" stroke-width="3"/>
    <rect x="615" y="280" width="30" height="140" fill="#3a3a44"/>
    <rect x="655" y="290" width="30" height="120" fill="#4a4a55"/>
    <rect x="695" y="300" width="28" height="100" fill="#5a5a66"/>
    <rect x="733" y="308" width="26" height="84" fill="#6a6a77"/>
    <rect x="769" y="315" width="24" height="70" fill="#7a7a88"/>
    <text x="700" y="450" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">chodba datového centra</text>
  </g>
  <text x="30" y="522" font-family="sans-serif" font-size="12" fill="#8a7420">Matfyz · PedF UK</text>
  <text x="930" y="522" font-family="sans-serif" font-size="12" fill="#8a7420" text-anchor="end">6</text>
</svg>
