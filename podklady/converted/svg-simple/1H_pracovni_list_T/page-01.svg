<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" role="img" lang="cs">
  <title>Pracovní list č. 1T – Servery, routery, pakety</title>
  <desc>Pracovní list pro žáky: následky výpadku internetu v pěti oblastech, zjištění IP adresy školního webu přes traceroute-online.com, obsah paketu a zákres části internetové sítě se symboly pro pakety, routery a kabely.</desc>
  <rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
  <text x="42" y="40" font-family="sans-serif" font-size="14" fill="#333333">PRACOVNÍ LIST č.1T</text>
  <text x="440" y="40" font-family="sans-serif" font-size="14" fill="#777777">jméno:</text>
  <line x1="490" y1="42" x2="740" y2="42" stroke="#999999" stroke-width="1"/>
  <text x="42" y="78" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1a1a1a">SERVERY, ROUTERY, PAKETY</text>
  <!-- Úloha 1 -->
  <g aria-label="Úloha 1 – následky výpadku internetu">
    <text x="42" y="112" font-family="sans-serif" font-size="16" fill="#1a1a1a"><tspan font-weight="bold">1.  Co kdyby internet přestal fungovat?</tspan> Uveďte alespoň 1 problém z hlediska:</text>
    <rect x="42" y="130" width="128" height="210" rx="12" fill="none" stroke="#555555" stroke-width="2"/>
    <text x="106" y="155" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ŠKOLY</text>
    <rect x="188" y="130" width="128" height="210" rx="12" fill="none" stroke="#555555" stroke-width="2"/>
    <text x="252" y="155" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">POLITIKY</text>
    <rect x="334" y="130" width="128" height="210" rx="12" fill="none" stroke="#555555" stroke-width="2"/>
    <text x="398" y="150" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MĚ A JINÝCH</text>
    <text x="398" y="166" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">UŽIVATELŮ</text>
    <rect x="480" y="130" width="128" height="210" rx="12" fill="none" stroke="#555555" stroke-width="2"/>
    <text x="544" y="155" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ZDRAVOTNICTVÍ</text>
    <rect x="626" y="130" width="128" height="210" rx="12" fill="none" stroke="#555555" stroke-width="2"/>
    <text x="690" y="155" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DOPRAVY</text>
  </g>
  <!-- Úloha 2 -->
  <g aria-label="Úloha 2 – IP adresa školního webu a traceroute">
    <text x="42" y="385" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">2.  Jakou IP adresu má web vaší školy?</text>
    <line x1="360" y1="388" x2="620" y2="388" stroke="#555555" stroke-width="1"/>
    <g aria-label="QR kód na traceroute-online.com">
      <rect x="42" y="410" width="110" height="110" fill="#ffffff" stroke="#333333" stroke-width="2"/>
      <rect x="52" y="420" width="24" height="24" fill="#333333"/>
      <rect x="118" y="420" width="24" height="24" fill="#333333"/>
      <rect x="52" y="486" width="24" height="24" fill="#333333"/>
      <rect x="88" y="455" width="18" height="18" fill="#333333"/>
      <text x="97" y="537" font-family="sans-serif" font-size="10" fill="#333333" text-anchor="middle">QR: https://traceroute-online.com/</text>
    </g>
    <text x="175" y="432" font-family="sans-serif" font-size="14" fill="#1a1a1a">Použijte <tspan font-weight="bold">https://traceroute-online.com/</tspan>, který vám vypíše,</text>
    <text x="175" y="453" font-family="sans-serif" font-size="14" fill="#1a1a1a">přes jaké routery šel požadavek od jejich počítače v Americe</text>
    <text x="175" y="474" font-family="sans-serif" font-size="14" fill="#1a1a1a">až na webový server vaší školy.</text>
    <text x="175" y="510" font-family="sans-serif" font-size="14" fill="#1a1a1a"><tspan font-weight="bold">Kolik routerů</tspan> po cestě požadavek směrovalo?</text>
    <line x1="500" y1="513" x2="740" y2="513" stroke="#555555" stroke-width="1"/>
  </g>
  <!-- Úloha 3 -->
  <g aria-label="Úloha 3 – obsah paketu">
    <text x="42" y="580" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">3.  Co musí obsahovat každý paket?</text>
    <line x1="42" y1="625" x2="370" y2="625" stroke="#555555" stroke-width="1"/>
    <line x1="420" y1="625" x2="750" y2="625" stroke="#555555" stroke-width="1"/>
    <line x1="42" y1="675" x2="370" y2="675" stroke="#555555" stroke-width="1"/>
    <line x1="420" y1="675" x2="750" y2="675" stroke="#555555" stroke-width="1"/>
    <line x1="42" y1="725" x2="370" y2="725" stroke="#555555" stroke-width="1"/>
  </g>
  <!-- Úloha 4 -->
  <g aria-label="Úloha 4 – zákres části internetové sítě">
    <text x="42" y="775" font-family="sans-serif" font-size="15" fill="#1a1a1a"><tspan font-weight="bold">4.  Zakreslete</tspan> za použití symbolů pro routery a pakety <tspan font-weight="bold">část internetové sítě</tspan> pro přenos</text>
    <text x="65" y="797" font-family="sans-serif" font-size="15" fill="#1a1a1a">videa k uživateli z YouTube serveru.</text>
    <rect x="42" y="815" width="712" height="255" rx="14" fill="none" stroke="#555555" stroke-width="2"/>
    <g aria-label="Legenda symbolů">
      <path d="M 62 838 L 62 858 L 80 848 Z" fill="none" stroke="#333333" stroke-width="2"/>
      <text x="92" y="853" font-family="sans-serif" font-size="13" fill="#1a1a1a">PAKET</text>
      <circle cx="185" cy="848" r="10" fill="none" stroke="#333333" stroke-width="2"/>
      <text x="205" y="853" font-family="sans-serif" font-size="13" fill="#1a1a1a">ROUTER</text>
      <line x1="295" y1="848" x2="340" y2="848" stroke="#333333" stroke-width="2"/>
      <text x="350" y="853" font-family="sans-serif" font-size="13" fill="#1a1a1a">KABEL</text>
    </g>
    <g aria-label="Uživatel">
      <title>Kreslená postava člověka s notebookem v kruhu – uživatel</title>
      <circle cx="115" cy="985" r="42" fill="none" stroke="#555555" stroke-width="2"/>
      <circle cx="115" cy="968" r="12" fill="none" stroke="#333333" stroke-width="2"/>
      <line x1="115" y1="980" x2="115" y2="1003" stroke="#333333" stroke-width="2"/>
      <line x1="115" y1="988" x2="99" y2="1000" stroke="#333333" stroke-width="2"/>
      <line x1="115" y1="988" x2="131" y2="1000" stroke="#333333" stroke-width="2"/>
      <rect x="95" y="1003" width="40" height="8" rx="2" fill="none" stroke="#333333" stroke-width="2"/>
      <text x="115" y="1050" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">uživatel</text>
    </g>
    <g aria-label="Server">
      <title>Ikona serverové skříně se symbolem přehrávacího tlačítka YouTube – server</title>
      <rect x="638" y="945" width="80" height="76" rx="6" fill="none" stroke="#333333" stroke-width="2"/>
      <line x1="638" y1="964" x2="718" y2="964" stroke="#333333" stroke-width="2"/>
      <line x1="638" y1="1002" x2="718" y2="1002" stroke="#333333" stroke-width="2"/>
      <path d="M 670 973 L 670 993 L 688 983 Z" fill="none" stroke="#333333" stroke-width="2"/>
      <text x="678" y="1050" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">server</text>
    </g>
  </g>
  <text x="42" y="1105" font-family="sans-serif" font-size="12" fill="#777777">internet4kids.mff.cuni.cz</text>
  <line x1="690" y1="1098" x2="740" y2="1098" stroke="#999999" stroke-width="1"/>
  <text x="748" y="1105" font-family="sans-serif" font-size="12" fill="#777777">1</text>
</svg>
