<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Zformulujte 5 pravidel (snímek 21)</title>
<desc>Zadání úkolu 4 pracovního listu: pět pravidel, jak zacházet s datovou stopou, aby nemohla být zneužita. Pět kruhů s otazníky.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="480" y="140" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#000">Zformulujte 5 pravidel, jak zacházet s datovou</text>
<text x="480" y="182" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#000">stopou, aby nemohla být zneužita proti nám.</text>
<circle cx="160" cy="350" r="45" fill="none" stroke="#555" stroke-width="2.5"/><text x="160" y="365" font-family="sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#000">?</text>
<circle cx="320" cy="350" r="45" fill="none" stroke="#555" stroke-width="2.5"/><text x="320" y="365" font-family="sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#000">?</text>
<circle cx="480" cy="350" r="45" fill="none" stroke="#555" stroke-width="2.5"/><text x="480" y="365" font-family="sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#000">?</text>
<circle cx="640" cy="350" r="45" fill="none" stroke="#555" stroke-width="2.5"/><text x="640" y="365" font-family="sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#000">?</text>
<circle cx="800" cy="350" r="45" fill="none" stroke="#555" stroke-width="2.5"/><text x="800" y="365" font-family="sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#000">?</text>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">21</text>
