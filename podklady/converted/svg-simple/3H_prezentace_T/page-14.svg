<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Jak je to možné? Díky souborům cookies (snímek 15)</title>
<desc>Odpověď na otázku z předchozího snímku: díky souborům cookies. Doplněno kresbou sušenky — vizuální hříčka.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="480" y="110" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#000">Informace o nás mají, analyzují a využívají</text>
<text x="480" y="144" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#000">různé společnosti.</text>
<text x="480" y="195" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#000">Ukládají je na různých serverech.</text>
<text x="480" y="255" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#000">Jak je to možné?</text>
