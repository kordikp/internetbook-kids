<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Jak fungují cookies? — co se uloží (snímek 18)</title>
<desc>Po kliknutí na Souhlasím s cookies se do počítače uloží malý soubor s informacemi o návštěvě. Otázka: co může takový soubor obsahovat? (Odpověď na dalším snímku.)</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="480" y="60" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#6a3fc0">Jak fungují COOKIES?</text>
<rect x="60" y="110" width="300" height="60" rx="12" fill="#f0a820" stroke="#c78200" stroke-width="2"/>
<text x="210" y="148" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#4a2c00">Souhlasím s cookies</text>
<line x1="375" y1="140" x2="425" y2="140" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="445" y="130" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#000">Do vašeho počítače se uloží malý soubor</text>
<text x="445" y="158" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#000">s informacemi o naší návštěvě webové stránky.</text>
<text x="480" y="280" font-family="sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#000">Co může takový soubor obsahovat?</text>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">18</text>
</svg>
