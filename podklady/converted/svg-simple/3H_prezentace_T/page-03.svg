<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Jak funguje financování internetu?</title>
<desc>Dvě otázky pro skupinovou práci: vliv návštěvnosti a AdBlocku na výdělek majitele stránky a zda je internet někdy zcela zdarma (poskytovatelé internetu, ISP).</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="480" y="70" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#000">Jak funguje financování internetu?</text>
<rect x="80" y="120" width="800" height="150" rx="16" fill="none" stroke="#d97706" stroke-width="3"/>
<text x="480" y="170" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#000">Jak se projeví vysoká návštěvnost stránky a čas na ní strávený</text>
<text x="480" y="200" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#000">na výdělku majitele? Proč? Jak se projeví, když mám zapnutý</text>
<text x="480" y="230" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#000">AdBlock (automatické vypínání reklam)?</text>
<rect x="80" y="300" width="800" height="150" rx="16" fill="none" stroke="#e0705a" stroke-width="3"/>
<text x="480" y="350" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#000">Dostanu se k Internetu zcela zdarma? Platí za to někdo u mě</text>
<text x="480" y="380" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#000">doma, v McDonaldu na wifi, nebo když používám mobilní data?</text>
<text x="480" y="410" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#000">A kdo jsou tzv. poskytovatelé Internetu (ISP)?</text>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">3</text>
</svg>
