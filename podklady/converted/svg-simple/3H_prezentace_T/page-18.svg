<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Jak fungují cookies? — obsah souboru cookie (snímek 19)</title>
<desc>Co může soubor cookie obsahovat: jednoznačný identifikátor, nastavení, kliknutí, strávený čas, nákupní košík, herní skóre, přihlašovací údaje. Servery si informace mohou předávat.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="480" y="55" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#6a3fc0">Jak fungují COOKIES?</text>
<rect x="50" y="85" width="270" height="50" rx="10" fill="#f0a820" stroke="#c78200" stroke-width="2"/>
<text x="185" y="117" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4a2c00">Souhlasím s cookies</text>
<line x1="333" y1="110" x2="373" y2="110" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="390" y="100" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#000">Do vašeho počítače se uloží malý soubor</text>
<text x="390" y="124" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#000">s informacemi o naší návštěvě webové stránky.</text>
<text x="480" y="185" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#000">Co může takový soubor obsahovat?</text>
<g aria-label="Možný obsah souboru cookie">
<rect x="50" y="210" width="560" height="70" rx="14" fill="#fde68a" stroke="#c7a300" stroke-width="2"/>
<text x="330" y="240" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">Náš jednoznačný identifikátor</text>
<text x="330" y="265" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#555">(aby nás při příští návštěvě stránka poznala)</text>
<rect x="630" y="210" width="280" height="70" rx="14" fill="none" stroke="#6a3fc0" stroke-width="2"/>
<text x="770" y="240" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">Nastavení</text>
<text x="770" y="265" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#555">(jazyk, dark mode)</text>
<rect x="50" y="300" width="200" height="46" rx="23" fill="none" stroke="#888" stroke-width="1.5"/>
<text x="150" y="329" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#000">na co jsme klikli</text>
<rect x="270" y="300" width="280" height="46" rx="23" fill="none" stroke="#888" stroke-width="1.5"/>
<text x="410" y="329" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#000">kolik jsme kde strávili času</text>
<rect x="570" y="300" width="180" height="46" rx="23" fill="none" stroke="#888" stroke-width="1.5"/>
<text x="660" y="329" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#000">nákupní košík</text>
<rect x="50" y="366" width="160" height="46" rx="23" fill="none" stroke="#888" stroke-width="1.5"/>
<text x="130" y="395" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#000">herní skóre</text>
<rect x="230" y="366" width="220" height="46" rx="23" fill="none" stroke="#888" stroke-width="1.5"/>
<text x="340" y="395" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#000">přihlašovací údaje</text>
</g>
<text x="480" y="460" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">Servery stránek si ale mohou o nás nasbírané informace</text>
<text x="480" y="490" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">a přístup ke cookies souborům předávat.</text>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">19</text>
</svg>
