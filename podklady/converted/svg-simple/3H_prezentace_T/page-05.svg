<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Ne! (odpověď na 2. otázku)</title>
<desc>Odpověď na otázku o internetu zdarma: ne. Vždy za připojení někdo platí poskytovateli internetu; žádný „ředitel internetu“ neexistuje.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<rect x="180" y="40" width="600" height="70" rx="14" fill="none" stroke="#e0705a" stroke-width="3"/>
<text x="480" y="84" font-family="sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#000">Dostanu se k Internetu zcela zdarma?</text>
<text x="480" y="190" font-family="sans-serif" font-size="46" font-weight="bold" text-anchor="middle" fill="#c2571a">NE!</text>
<text x="480" y="250" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#000">Vždy za mě bude někdo platit, i když je to veřejná Wi-Fi.</text>
<text x="480" y="284" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#000">Za připojení k internetu platí většinou vaši rodiče</text>
<text x="480" y="318" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#000">tzv. poskytovateli Internetu.</text>
<text x="480" y="352" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#000">Těch je jen v naší republice několik (O2, Vodafone a další).</text>
<text x="480" y="386" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#000">Není žádný ředitel Internetu, kterému by všichni platili.</text>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">5</text>
</svg>
