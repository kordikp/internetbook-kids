<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" lang="cs">
<title>Servery vyhodnocují datovou stopu na základě pravděpodobnosti (snímek 13)</title>
<desc>Upozornění: servery volí nejpravděpodobnější variantu, ale ne nutně tu správnou. Zdroj: Internetem bezpečně.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a04030"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<rect x="120" y="170" width="720" height="180" rx="20" fill="none" stroke="#d97706" stroke-width="3"/>
<text x="480" y="235" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#000">Servery vyhodnocují datovou stopu na základě</text>
<text x="480" y="271" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#000">pravděpodobnosti. Volí tedy nejpravděpodobnější</text>
<text x="480" y="307" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#000">variantu, ale ne nutně tu správnou.</text>
<text x="60" y="505" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#888">1] Zdroj: Internetem bezpečně</text>
<text x="930" y="528" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#999">13</text>
</svg>
